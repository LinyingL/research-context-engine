[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rce"
version = "0.1.0"
description = "Research Context Engine -- local provenance graph over git/LaTeX/W&B for research projects."
requires-python = ">=3.11"
# "mcp" (official Model Context Protocol SDK): the project's first runtime
# dependency, approved by Owner 2026-07-22 for T5 (constitution section 0,
# Occam rule 1 -- official SDK over a hand-rolled stdio/JSON-RPC protocol).
dependencies = ["mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rce = "rce.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rce = ["migrations/*.sql"]
