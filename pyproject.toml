[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rce"
version = "0.1.0"
description = "Research Context Engine -- local provenance graph over git/LaTeX/W&B for research projects."
requires-python = ">=3.11"
# Zero required runtime third-party dependencies (positioning ruling
# 2026-07-22: RCE is a local-first standalone tool, not an MCP product --
# MCP is one optional exit among several, not a requirement to install the
# engine). See [project.optional-dependencies] below.
dependencies = []

[project.optional-dependencies]
# "mcp" (official Model Context Protocol SDK) backs only rce.mcp_server /
# `rce mcp` (constitution section 0, Occam rule 1 -- official SDK over a
# hand-rolled stdio/JSON-RPC protocol); every other subcommand works without
# it. Install with: pip install "rce[mcp]"
mcp = ["mcp>=1.0"]
# dev pulls in mcp too, so tests/test_mcp_server.py keeps running under the
# full test suite.
dev = ["pytest>=8", "mcp>=1.0"]

[project.scripts]
rce = "rce.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rce = ["migrations/*.sql"]
