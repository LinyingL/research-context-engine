[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rce"
version = "0.1.0"
description = "Research Context Engine -- local provenance graph over git/LaTeX/W&B for research projects."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["research", "provenance", "reproducibility", "latex", "mlflow", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Zero required runtime third-party dependencies (positioning ruling
# 2026-07-22: RCE is a local-first standalone tool, not an MCP product --
# MCP is one optional exit among several, not a requirement to install the
# engine). See [project.optional-dependencies] below.
dependencies = []

[project.optional-dependencies]
# "mcp" (official Model Context Protocol SDK) backs only rce.mcp_server /
# `rce mcp` (constitution section 0, Occam rule 1 -- official SDK over a
# hand-rolled stdio/JSON-RPC protocol); every other subcommand works without
# it. Install with: pip install "rce[mcp]"
# Upper bound is deliberate, not laziness: mcp 2.0.0 (released 2026-08)
# removed `mcp.server.fastmcp`, which rce.mcp_server is built on -- an
# unbounded `mcp>=1.0` silently broke CI the day 2.0 shipped. Supporting the
# 2.0 server API is a separate, testable piece of work; until then this pins
# the range the code is actually verified against.
mcp = ["mcp>=1.0,<2"]
# dev pulls in mcp too, so tests/test_mcp_server.py keeps running under the
# full test suite.
dev = ["pytest>=8", "mcp>=1.0,<2"]

[project.scripts]
rce = "rce.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rce = ["migrations/*.sql", "webapp/app.html"]
