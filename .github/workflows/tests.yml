name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: "tests (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" in pyproject.toml; all three are run
        # for real rather than trusting the floor version, since
        # src/rce/ingest/pyfig.py branches on ast.TypeAlias / PEP 695 type
        # params, which only exist from 3.12 onward and fall back to
        # getattr()-based compatibility checks on 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev + mcp extras)
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  zero-dependency-install:
    name: zero-dependency install (core commands only)
    runs-on: ubuntu-latest
    # DESIGN.md section 0/2: the deterministic layer is the mandatory,
    # zero-third-party-dependency baseline; MCP is one optional exit among
    # several (pyproject.toml `dependencies = []`). This job holds that
    # promise to a real check instead of relying on someone remembering it:
    # it installs with no extras at all and drives the CLI end-to-end
    # against a throwaway git repo, then confirms `rce mcp` fails clearly
    # (not with a traceback) when the optional 'mcp' extra is absent.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with no optional extras
        run: pip install -e .
      - name: Confirm no third-party packages were pulled in
        run: |
          set -euo pipefail
          extra_packages=$(pip list --format=freeze | grep -v -E '^(pip|setuptools|wheel|rce)==' || true)
          if [ -n "$extra_packages" ]; then
            echo "Unexpected third-party package(s) installed with plain 'pip install -e .':"
            echo "$extra_packages"
            exit 1
          fi
      - name: rce init / ingest / status / query / trace on a fixture repo
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "RCE CI"
          echo "hello" > README.md
          git add README.md
          git commit -q -m "init"
          project_id="project:$(basename "$workdir")"
          rce init .
          rce ingest .
          rce status
          rce query "$project_id"
          rce trace "$project_id"
      - name: rce attempts (the only command that reads a TOML config) on a minimal fixture table
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"
          git init -q
          git config user.email "ci@example.com"
          git config user.name "RCE CI"
          cat > map.md <<'EOF'
          ## Attempt timeline

          | # | Date | Path | Variables | Result | Verdict |
          |---|---|---|---|---|---|
          | 1 | 2026-07-01 | first pass | x | y | done |
          EOF
          git add map.md
          git commit -q -m "init"
          mkdir -p .rce
          cat > .rce/attempts.toml <<'EOF'
          file = "map.md"
          heading = "Attempt timeline"

          [columns]
          id = "#"
          date = "Date"
          description = "Path"
          variables = "Variables"
          result = "Result"
          verdict = "Verdict"
          EOF
          rce init .
          # Positional path (item 10), same as init/ingest.
          listing=$(rce attempts .)
          echo "$listing"
          echo "$listing" | grep -q "#1"
          check_output=$(rce attempts . --check)
          echo "$check_output"
          echo "$check_output" | grep -q "skipped"
      - name: rce mcp must fail clearly (exit 1) without the optional 'mcp' extra
        run: |
          set +e
          output=$(rce mcp 2>&1)
          mcp_exit_code=$?
          set -e
          echo "$output"
          if [ "$mcp_exit_code" -ne 1 ]; then
            echo "expected exit code 1 from 'rce mcp' with no mcp extra installed, got $mcp_exit_code"
            exit 1
          fi
          if ! echo "$output" | grep -q "optional 'mcp' extra"; then
            echo "expected a clear message naming the missing optional 'mcp' extra, got:"
            echo "$output"
            exit 1
          fi
