<!doctype html>
<!--
  RCE decision-tree / lineage viewer (task V2).

  Single self-contained file: inline CSS, inline JS, zero external
  resources, zero build step. Served verbatim by rce.webapp.server at "/"
  and read entirely client-side against this same process's JSON API
  (/api/summary, /api/attempts, /api/tree, /api/lineage, /api/file,
  /api/open, /api/projects, /api/projects/switch, /api/generation,
  /api/attempts/preview, /api/attempts/write -- see rce/webapp/server.py's
  module docstring for the contract each endpoint promises).

  Auto-refresh (task V3 phase 2): the server's own watcher re-ingests the
  attempts map / step scripts when they change on disk and bumps a
  generation counter; this page polls GET /api/generation every 2s and,
  when the number moved, re-fetches the current view's data while
  PRESERVING UI state -- which attempts/scripts are expanded, which view
  is active, and (for an attempt whose record still exists) the open
  panel. A small chip in the header says, in product language, when a
  rescan is in flight or when the last one failed (the raw error lives on
  the chip's hover title, technical detail folded away).

  Multi-project switching (task V3 phase 1): the header shows the current
  project's registry label (hover for the full path), and -- only when the
  registry has more than one entry -- a <select> to switch. Switching
  POSTs /api/projects/switch (the server accepts only exact registry
  members; this page only ever offers values it got from /api/projects),
  then re-fetches every view from scratch, since everything on screen
  belongs to the previous project.

  Writing from the UI (task V3 phase 3): the "＋ 新增尝试" header button and
  the attempt panel's "编辑" button open a form in the same slide-out
  panel, built from the project's OWN column names (the attempts_config
  echo in /api/summary -- nothing hardcoded). Submitting first POSTs
  /api/attempts/preview (a pure dry run: old row / new row, nothing
  written) and shows the change with an explicit Chinese confirm; only the
  confirm click POSTs /api/attempts/write, which edits the researcher's
  own map file (backed up first, written atomically, re-ingested
  server-side) -- the graph then follows the file, per DESIGN.md's
  "resync from source": this page never writes the graph, only the one
  source of truth. On success the form closes and the phase-2 auto-refresh
  renders the new state; update mode submits ONLY the fields the user
  actually changed, so untouched cells keep their raw markdown decoration
  byte-for-byte (prefills come from parsed/cleaned values and must not be
  round-tripped over cells nobody edited).

  Two views, switched by the top tab bar:
    - Decision Tree (default): GET /api/tree. attempt -> step script ->
      read/write data files, all three layers already computed
      server-side from graph edges; this page only renders them.
    - Lineage: GET /api/lineage. Four fixed blocks in report order --
      orphan inputs, chains, broken links, duplicate copies.

  Clicking any file path anywhere in either view opens the right-hand
  slide-out panel (GET /api/file for a preview, POST /api/open to reveal
  in Finder or open with the default app). Clicking an attempt row opens
  the same panel with that attempt's full record.

  Every fetch is wrapped (apiGet/apiPost below) so a failure renders a
  readable message inside the page -- never only to the console.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCE</title>
<style>
:root {
  --paper: #F7F2E9;
  --paper-alt: #F0E9DA;
  --ink: #26221B;
  --ink-soft: #5B564A;
  --line: rgba(38, 34, 27, 0.14);
  --line-strong: rgba(38, 34, 27, 0.32);
  --clay: #A64B2A;
  --clay-soft: #F1DCD0;
  --ochre: #9A6E1F;
  --ochre-soft: #F0E3C4;
  --olive: #6C7042;
  --olive-soft: #E4E6D4;
  --gray: #736F63;
  --gray-soft: #E7E4DB;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  --font-sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }

#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: baseline;
  gap: 2rem;
  padding: 1.25rem 2rem 1rem;
  border-bottom: 1px solid var(--line-strong);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 0.6rem; }
.brand-mark { font-family: var(--font-serif); font-size: 1.4rem; letter-spacing: 0.04em; }
.brand-sub { font-size: 0.78rem; color: var(--ink-soft); }

.project-switcher {
  font: inherit;
  font-size: 0.82rem;
  color: var(--ink);
  background: var(--paper-alt);
  border: 1px solid var(--line-strong);
  border-radius: 0;
  padding: 0.3rem 0.55rem;
  max-width: 18rem;
  align-self: center;
  cursor: pointer;
}
.project-switcher:hover { border-color: var(--ink); }
.project-switcher:focus { outline: 1px solid var(--clay); outline-offset: 1px; }

.refresh-chip {
  font-size: 0.76rem;
  color: var(--ink);
  background: var(--ochre-soft);
  border: 1px solid var(--ochre);
  padding: 0.18rem 0.6rem;
  align-self: center;
  white-space: nowrap;
}
.refresh-chip.err { background: var(--clay-soft); border-color: var(--clay); cursor: help; }

.tabs { display: flex; gap: 1.5rem; margin-left: auto; }
.tab {
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  font-size: 0.92rem;
  color: var(--ink-soft);
  padding: 0.3rem 0 0.5rem;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--ink); border-bottom-color: var(--clay); font-weight: 600; }
.tab:hover:not(.active) { color: var(--ink); }

.project-line {
  flex-basis: 100%;
  font-family: var(--font-mono);
  font-size: 0.74rem;
  color: var(--ink-soft);
  margin-top: 0.25rem;
}

main#main { flex: 1; padding: 1.75rem 2rem 4rem; max-width: 1080px; width: 100%; margin: 0 auto; }

.guide-card { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 1.5rem 1.75rem; max-width: 640px; }
.guide-card h2 { font-family: var(--font-serif); font-size: 1.15rem; margin: 0 0 0.6rem; }
.guide-card p { margin: 0.4rem 0; color: var(--ink-soft); }
.guide-card pre {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 0.9rem 1rem;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  line-height: 1.5;
  white-space: pre;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  margin: 2rem 0 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--line-strong);
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.section-title .count { font-family: var(--font-sans); font-size: 0.78rem; color: var(--ink-soft); font-weight: normal; }
.section-title.accent-clay { color: var(--clay); border-bottom-color: var(--clay); }

.empty-note { color: var(--ink-soft); font-size: 0.86rem; padding: 0.4rem 0 1rem; }

.attempt-list { margin: 0; }
.attempt-children { margin-left: 1.4rem; }
details.attempt-node { border-bottom: 1px solid var(--line); }
details.attempt-node > summary { list-style: none; cursor: default; padding: 0.55rem 0; display: flex; align-items: flex-start; gap: 0.6rem; }
details.attempt-node > summary::-webkit-details-marker { display: none; }

.caret {
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 0.75rem;
  width: 1em;
  flex: none;
  padding-top: 0.3em;
  user-select: none;
  transition: transform 0.12s;
}
details[open] > summary .caret { transform: rotate(90deg); }

.row-content { cursor: pointer; display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; padding: 0.1rem 0.35rem; margin: -0.1rem -0.35rem; }
.row-content:hover { background: var(--paper-alt); }
.attempt-number { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-soft); }
.attempt-date { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); }
.attempt-desc { font-weight: 500; }

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.6em;
  height: 1.6em;
  padding: 0 0.25em;
  border: 1px solid;
  font-size: 0.9rem;
  line-height: 1;
  flex: none;
}
.badge-olive { background: var(--olive-soft); border-color: var(--olive); }
.badge-ochre { background: var(--ochre-soft); border-color: var(--ochre); }
.badge-clay { background: var(--clay-soft); border-color: var(--clay); }
.badge-gray { background: var(--gray-soft); border-color: var(--gray); }
.badge-plain { background: var(--paper-alt); border-color: var(--line-strong); }

.script-list { margin: 0.15rem 0 0.6rem 1.9rem; }
details.script-node { border-left: 1px dashed var(--line-strong); margin: 0.15rem 0; }
details.script-node > summary { list-style: none; cursor: default; padding: 0.35rem 0 0.35rem 0.7rem; display: flex; align-items: baseline; gap: 0.5rem; }
details.script-node > summary::-webkit-details-marker { display: none; }
.script-path { font-family: var(--font-mono); font-size: 0.85rem; }

.rw-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0.3rem 0 0.1rem 1.9rem; }

.file-list { list-style: none; margin: 0 0 0.5rem 1.9rem; padding: 0; }
.file-row { display: flex; align-items: baseline; gap: 0.45rem; padding: 0.22rem 0.35rem; margin: 0 -0.35rem; cursor: pointer; font-family: var(--font-mono); font-size: 0.83rem; }
.file-row:hover { background: var(--paper-alt); }
.flow-icon { flex: none; color: var(--ink-soft); width: 1em; text-align: center; }
.flow-icon.read { color: var(--olive); }
.flow-icon.write { color: var(--ochre); }
.orphan-dot { flex: none; width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--clay); }
.missing-flag { color: var(--clay); font-size: 0.75rem; font-style: italic; }

.lineage-block { margin-bottom: 1rem; }
.lineage-item { border-bottom: 1px solid var(--line); padding: 0.5rem 0; }
.lineage-path { font-family: var(--font-mono); font-size: 0.88rem; }
.clickable { cursor: pointer; }
.clickable:hover { text-decoration: underline; }
.lineage-sub { margin: 0.3rem 0 0 1rem; font-size: 0.8rem; color: var(--ink-soft); font-family: var(--font-mono); }
.lineage-sub-title { font-family: var(--font-sans); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-top: 0.35rem; }
.lineage-sub ul { margin: 0.15rem 0; padding-left: 1.1rem; }

.error-box { border: 1px solid var(--clay); background: var(--clay-soft); color: var(--ink); padding: 0.9rem 1.1rem; font-size: 0.88rem; }
.error-box .error-title { font-weight: 600; color: var(--clay); margin-bottom: 0.25rem; }

.panel-backdrop { position: fixed; inset: 0; background: rgba(38, 34, 27, 0.28); z-index: 40; }
.panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(560px, 92vw);
  background: var(--paper);
  border-left: 1px solid var(--line-strong);
  z-index: 50;
  display: flex;
  flex-direction: column;
  box-shadow: -6px 0 24px rgba(38, 34, 27, 0.12);
}
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line-strong); }
.panel-title { font-family: var(--font-mono); font-size: 0.95rem; word-break: break-all; }
.panel-subtitle { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.25rem; }
.panel-close { background: none; border: none; font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--ink-soft); padding: 0 0.2rem; }
.panel-close:hover { color: var(--ink); }
.panel-body { flex: 1; overflow-y: auto; padding: 1.1rem 1.3rem; }

.panel-actions { display: flex; gap: 0.6rem; margin: 0 0 0.7rem; }
.btn { font: inherit; font-size: 0.82rem; padding: 0.4rem 0.85rem; background: var(--paper-alt); border: 1px solid var(--line-strong); cursor: pointer; color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.panel-status { font-size: 0.8rem; margin-bottom: 0.8rem; min-height: 1.1em; }
.panel-status.ok { color: var(--olive); }
.panel-status.err { color: var(--clay); }

.kv-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.86rem; }
.kv-table th { text-align: left; vertical-align: top; color: var(--ink-soft); font-weight: normal; padding: 0.3rem 0.8rem 0.3rem 0; white-space: nowrap; }
.kv-table td { padding: 0.3rem 0; word-break: break-word; }

.code-preview { border: 1px solid var(--line); overflow-x: auto; background: var(--paper-alt); }
.code-table { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.78rem; width: 100%; }
.code-table td.ln { color: var(--ink-soft); text-align: right; padding: 0 0.7em; user-select: none; border-right: 1px solid var(--line); white-space: nowrap; }
.code-table td.src { padding: 0 0.7em; white-space: pre; }
.truncated-note { font-size: 0.76rem; color: var(--ochre); margin-bottom: 0.6rem; }

.step-broken { color: var(--clay); font-size: 0.84rem; }

/* -- Attempt edit form (task V3 phase 3) -- same paper palette as the rest */
.new-attempt-btn { align-self: center; white-space: nowrap; }

.attempt-form { display: flex; flex-direction: column; gap: 0.75rem; }
.form-field label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
.form-input, .form-textarea {
  font: inherit;
  font-size: 0.86rem;
  color: var(--ink);
  background: var(--paper-alt);
  border: 1px solid var(--line-strong);
  border-radius: 0;
  padding: 0.35rem 0.55rem;
  width: 100%;
}
.form-textarea { resize: vertical; min-height: 3.2em; line-height: 1.5; }
.form-input:focus, .form-textarea:focus { outline: 1px solid var(--clay); outline-offset: 1px; }
.form-input:disabled { color: var(--ink-soft); cursor: not-allowed; }
.form-mono { font-family: var(--font-mono); }
.verdict-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
.chip { font: inherit; font-size: 0.76rem; padding: 0.12rem 0.5rem; background: var(--paper-alt); border: 1px solid var(--line); cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.form-actions { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
.btn-primary { background: var(--ochre-soft); border-color: var(--ochre); }
.diff-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0.6rem 0 0.2rem; }
.diff-row { font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.5; padding: 0.45rem 0.6rem; border: 1px solid var(--line); overflow-x: auto; white-space: pre; }
.diff-row.old { background: var(--clay-soft); border-color: var(--clay); }
.diff-row.new { background: var(--olive-soft); border-color: var(--olive); }
.confirm-note { font-size: 0.84rem; margin: 0.7rem 0 0.4rem; }

@media (max-width: 720px) {
  main#main { padding: 1.25rem 1rem 3rem; }
  .topbar { padding: 1rem 1rem 0.75rem; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">RCE</span>
      <span class="brand-sub">decision tree &amp; lineage</span>
    </div>
    <select id="project-switcher" class="project-switcher hidden" title="切换项目" aria-label="切换项目"></select>
    <span id="refresh-chip" class="refresh-chip hidden" role="status"></span>
    <button id="new-attempt-btn" class="btn new-attempt-btn" type="button">＋ 新增尝试</button>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="tree" role="tab" aria-selected="true">Decision Tree</button>
      <button class="tab" data-view="lineage" role="tab" aria-selected="false">Lineage</button>
    </nav>
    <div class="project-line" id="project-line"></div>
  </header>
  <main id="main">
    <section id="view-tree" class="view"></section>
    <section id="view-lineage" class="view hidden"></section>
  </main>
</div>

<div id="panel-backdrop" class="panel-backdrop hidden"></div>
<aside id="panel" class="panel hidden" aria-hidden="true">
  <div class="panel-head">
    <div class="panel-head-text">
      <div class="panel-title" id="panel-title"></div>
      <div class="panel-subtitle" id="panel-subtitle"></div>
    </div>
    <button class="panel-close" id="panel-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script>
"use strict";

// -- Small shared state ------------------------------------------------------
// attemptsById is populated once per Tree-view load from /api/attempts (which
// carries the full record -- attrs, verdict, result) and keyed by node id so
// clicking an attempt row in the tree (built from /api/tree, a slimmer shape)
// can show the complete record without a second round trip per click.
// projectLabel is the current project's registry label (task V3 phase 1),
// filled by loadProjects() and shown in the header line instead of the raw
// path (which stays reachable as the line's hover title).
// panelSubject remembers what the slide-out panel is currently showing
// ({kind: "attempt", id}, {kind: "file", path}, or {kind: "attempt-form"},
// null when closed), so an auto-refresh (task V3 phase 2) can re-validate
// it: an attempt whose record survived the re-ingest is re-rendered in
// place, one that vanished closes the panel instead of showing stale data.
// An open edit form is left alone entirely -- yanking a half-typed form
// out from under the user is never acceptable, and the write path
// re-validates against the file's real state server-side anyway.
// attemptsConfig is /api/summary's echo of .rce/attempts.toml (file +
// [columns] names, task V3 phase 3) -- the edit form is built from these,
// never from hardcoded column labels; null means no usable config.
const state = { attemptsById: new Map(), projectLabel: "", panelSubject: null, attemptsConfig: null };

// -- fetch wrappers: every failure becomes a readable Error, never a console-only one --

async function apiGet(path) {
  let res;
  try {
    res = await fetch(path, { headers: { "Accept": "application/json" } });
  } catch (err) {
    throw new Error("Network error requesting " + path + ": " + err.message);
  }
  const text = await res.text();
  let body = null;
  if (text) {
    try {
      body = JSON.parse(text);
    } catch (err) {
      throw new Error("Could not parse response from " + path + " as JSON: " + err.message);
    }
  }
  if (!res.ok) {
    throw new Error((body && body.error) ? body.error : (path + " failed: HTTP " + res.status));
  }
  return body;
}

async function apiPost(path, payload) {
  let res;
  try {
    res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    throw new Error("Network error requesting " + path + ": " + err.message);
  }
  const text = await res.text();
  let body = null;
  if (text) {
    try {
      body = JSON.parse(text);
    } catch (err) {
      throw new Error("Could not parse response from " + path + " as JSON: " + err.message);
    }
  }
  if (!res.ok) {
    throw new Error((body && body.error) ? body.error : (path + " failed: HTTP " + res.status));
  }
  return body;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function renderErrorBox(container, err) {
  container.innerHTML = "";
  const box = document.createElement("div");
  box.className = "error-box";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = "Something went wrong";
  const msg = document.createElement("div");
  msg.textContent = err instanceof Error ? err.message : String(err);
  box.append(title, msg);
  container.appendChild(box);
}

// -- Tabs ---------------------------------------------------------------------

const views = { tree: document.getElementById("view-tree"), lineage: document.getElementById("view-lineage") };
let currentView = null;

function activateView(name) {
  if (currentView === name) return;
  currentView = name;
  document.querySelectorAll(".tab").forEach((btn) => {
    const active = btn.dataset.view === name;
    btn.classList.toggle("active", active);
    btn.setAttribute("aria-selected", String(active));
  });
  Object.entries(views).forEach(([key, node]) => node.classList.toggle("hidden", key !== name));
  if (name === "tree" && !views.tree.dataset.loaded) loadTreeView();
  if (name === "lineage" && !views.lineage.dataset.loaded) loadLineageView();
}

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => activateView(btn.dataset.view));
});

// -- Project summary line (decorative; a failure here is not shown as an
// error box since neither view depends on it -- /api/tree and /api/lineage
// surface the same "project not initialized" failure prominently already
// whenever it actually matters) -------------------------------------------

function basename(path) {
  const parts = String(path).split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : String(path);
}

async function loadProjectSummary() {
  const line = document.getElementById("project-line");
  try {
    const data = await apiGet("/api/summary");
    // Registry label when loadProjects() found one, else the directory
    // basename -- never the raw path, which lives on as the hover title.
    const label = state.projectLabel || basename(data.project_root);
    line.textContent = "项目：" + label + "   ·   待确认：" + data.pending;
    line.title = data.project_root;
    // The edit form's column names ride along on this same fetch (task V3
    // phase 3) -- kept fresh here so a config edit mid-serve is picked up
    // by the next summary refresh, not only by a full page reload.
    state.attemptsConfig = data.attempts_config || null;
  } catch (err) {
    line.textContent = "";
    line.title = "";
  }
}

// -- Project switcher (task V3 phase 1) ------------------------------------
// The <select> only ever offers paths /api/projects returned -- the server
// additionally enforces registry membership on switch, so this page can
// never introduce a new filesystem path, only choose among registered ones.

const projectSwitcher = document.getElementById("project-switcher");

async function loadProjects() {
  let data;
  try {
    data = await apiGet("/api/projects");
  } catch (err) {
    // The switcher is a convenience; a registry hiccup must not take the
    // header down. Each view surfaces its own real errors already.
    projectSwitcher.classList.add("hidden");
    state.projectLabel = "";
    return;
  }
  const projects = data.projects || [];
  const current = data.current || "";
  const currentEntry = projects.find((p) => p.path === current);
  state.projectLabel = currentEntry ? currentEntry.label : basename(current);

  projectSwitcher.innerHTML = "";
  if (!currentEntry && current) {
    // Currently serving a project that is not (or no longer) a registry
    // member -- still show it as the selected entry so the select never
    // silently claims some other project is active.
    const opt = document.createElement("option");
    opt.value = current;
    opt.textContent = basename(current);
    opt.selected = true;
    projectSwitcher.appendChild(opt);
  }
  projects.forEach((p) => {
    const opt = document.createElement("option");
    opt.value = p.path;
    opt.textContent = p.label + (p.initialized ? "" : "（未初始化）");
    opt.title = p.path;
    opt.disabled = !p.initialized;
    opt.selected = p.path === current;
    projectSwitcher.appendChild(opt);
  });
  // Only worth showing when there is actually something to switch between.
  projectSwitcher.classList.toggle("hidden", projects.length <= 1);
}

async function reloadAllViews() {
  // Everything on screen belongs to the previous project: drop the cached
  // attempt records, mark both views stale, and re-fetch the one currently
  // visible (the other reloads lazily on its next activation).
  state.attemptsById = new Map();
  delete views.tree.dataset.loaded;
  delete views.lineage.dataset.loaded;
  closePanel();
  // The switch itself bumped the server's generation (watcher.retarget);
  // resync the poller's notion of "current" so the next tick doesn't
  // immediately re-fetch everything this function just fetched.
  await syncGeneration();
  await loadProjects();
  loadProjectSummary();
  if (currentView === "tree") loadTreeView();
  else if (currentView === "lineage") loadLineageView();
}

projectSwitcher.addEventListener("change", async () => {
  const line = document.getElementById("project-line");
  projectSwitcher.disabled = true;
  try {
    await apiPost("/api/projects/switch", { path: projectSwitcher.value });
  } catch (err) {
    line.textContent = "切换项目失败：" + (err instanceof Error ? err.message : String(err));
    line.title = "";
    await loadProjects(); // resync the select with what the server actually serves
    projectSwitcher.disabled = false;
    return;
  }
  await reloadAllViews();
  projectSwitcher.disabled = false;
});

// -- Auto-refresh (task V3 phase 2) -----------------------------------------
// GET /api/generation every 2s (matching the server watcher's own poll
// cadence). When the generation moved, the current view's data is
// re-fetched and re-rendered with UI state preserved: expanded rows stay
// expanded (captureTreeState/restoreTreeState), the active view stays
// active (only it re-fetches now; the hidden one is marked stale and
// reloads lazily on its next activation), and an open attempt panel is
// re-validated against the fresh data -- re-rendered if its record still
// exists, closed if the row was deleted from the map. A file panel is left
// as it stands: its preview is a point-in-time snapshot and yanking it
// mid-read would lose the user's scroll position for no gain.
//
// The chip states, in product language (the raw error string is folded
// onto the hover title): "正在重扫" while a rescan or re-fetch is in
// flight, a clay warning when the watcher's last re-ingest failed (a
// half-saved table, usually -- the next good save clears it), hidden
// otherwise. A failed generation poll itself is simply retried next tick,
// never surfaced as an error box: transient, and the page still shows
// consistent (if momentarily stale) data.

const REFRESH_POLL_MS = 2000;
const refreshChip = document.getElementById("refresh-chip");
let lastGeneration = null;
let refreshInFlight = false;

function showRefreshingChip() {
  refreshChip.classList.remove("hidden", "err");
  refreshChip.textContent = "地图有改动，正在重扫…";
  refreshChip.title = "";
}

function updateChipFromStatus(status) {
  if (status.last_error) {
    refreshChip.classList.remove("hidden");
    refreshChip.classList.add("err");
    refreshChip.textContent = "重扫失败，最新改动尚未同步";
    refreshChip.title = status.last_error;
  } else if (status.refreshing) {
    showRefreshingChip();
  } else {
    refreshChip.classList.add("hidden");
    refreshChip.classList.remove("err");
    refreshChip.title = "";
  }
}

function revalidatePanel() {
  if (!state.panelSubject || panel.classList.contains("hidden")) return;
  if (state.panelSubject.kind !== "attempt") return;
  if (state.attemptsById.has(state.panelSubject.id)) {
    openAttemptPanel(state.panelSubject.id); // re-render from the fresh record
  } else {
    closePanel(); // the row is gone; stale details must not linger on screen
  }
}

async function refreshCurrentView() {
  // Both views' data may have moved on disk; only the visible one
  // re-fetches now, the other is marked stale for its next activation.
  delete views.tree.dataset.loaded;
  delete views.lineage.dataset.loaded;
  if (currentView === "tree") {
    await loadTreeView(true);
    revalidatePanel(); // attemptsById was just refreshed by loadTreeView
  } else if (currentView === "lineage") {
    await loadLineageView();
  }
  loadProjectSummary(); // the pending count may have moved with the graph
}

async function syncGeneration() {
  try {
    const status = await apiGet("/api/generation");
    lastGeneration = status.generation;
    updateChipFromStatus(status);
  } catch (err) {
    // Leave lastGeneration as-is; the regular poll self-corrects.
  }
}

async function pollGeneration() {
  if (refreshInFlight) return; // never stack refreshes on a slow fetch
  let status;
  try {
    status = await apiGet("/api/generation");
  } catch (err) {
    return; // transient; retry on the next tick
  }
  if (lastGeneration === null) {
    lastGeneration = status.generation;
    updateChipFromStatus(status);
    return;
  }
  if (status.generation === lastGeneration) {
    updateChipFromStatus(status);
    return;
  }
  lastGeneration = status.generation;
  refreshInFlight = true;
  showRefreshingChip();
  try {
    await refreshCurrentView();
  } finally {
    refreshInFlight = false;
    updateChipFromStatus(status);
  }
}

const SAMPLE_ATTEMPTS_TOML =
  'file = "docs/attempt-log.md"     # markdown file, relative to project root\n' +
  'heading = "Attempt Log"          # heading right above the table\n' +
  'steps_dir = "scripts"            # optional: numbered step-script directory\n' +
  "\n" +
  "[columns]                        # your table's actual header text\n" +
  'id = "#"\n' +
  'date = "date"\n' +
  'description = "path"\n' +
  'variables = "variables"\n' +
  'result = "result"\n' +
  'verdict = "verdict"';

function renderGuideCard(hint) {
  const card = document.createElement("div");
  card.className = "guide-card";
  const h2 = document.createElement("h2");
  h2.textContent = "No attempt timeline configured yet";
  const p1 = document.createElement("p");
  p1.textContent = hint || "Configure .rce/attempts.toml and run 'rce attempts' to ingest your attempt timeline.";
  const p2 = document.createElement("p");
  p2.textContent = "Example .rce/attempts.toml:";
  const pre = document.createElement("pre");
  pre.textContent = SAMPLE_ATTEMPTS_TOML;
  card.append(h2, p1, p2, pre);
  return card;
}

const VERDICT_MARKERS = ["☠️", "✅", "🕒", "⚠️", "📋", "⛔"];
const VERDICT_BADGE_CLASS = {
  "☠️": "badge-gray", "✅": "badge-olive", "🕒": "badge-ochre",
  "⚠️": "badge-clay", "📋": "badge-plain", "⛔": "badge-plain",
};

function verdictMarker(text) {
  if (!text) return null;
  for (const marker of VERDICT_MARKERS) if (text.startsWith(marker)) return marker;
  return null;
}

function verdictBadge(verdictText) {
  const marker = verdictMarker(verdictText);
  const span = document.createElement("span");
  span.className = "badge " + (marker ? VERDICT_BADGE_CLASS[marker] : "badge-plain");
  span.textContent = marker || "·";
  span.title = verdictText || "(no verdict)";
  return span;
}

function renderAttemptNode(attempt) {
  const details = document.createElement("details");
  details.className = "attempt-node";
  // Stable key for auto-refresh (task V3 phase 2): captureTreeState()
  // records which attempt ids were expanded so restoreTreeState() can
  // re-open the same rows on the freshly built DOM.
  details.dataset.attemptId = attempt.id;

  const summary = document.createElement("summary");
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = "▸";

  const content = document.createElement("span");
  content.className = "row-content";
  content.appendChild(verdictBadge(attempt.verdict));
  const num = document.createElement("span");
  num.className = "attempt-number";
  num.textContent = "#" + attempt.number;
  const date = document.createElement("span");
  date.className = "attempt-date";
  date.textContent = attempt.date || "";
  const desc = document.createElement("span");
  desc.className = "attempt-desc";
  desc.textContent = attempt.description || "(no description)";
  content.append(num, date, desc);
  content.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    openAttemptPanel(attempt.id);
  });

  summary.append(caret, content);
  details.appendChild(summary);

  const body = document.createElement("div");
  if (attempt.scripts && attempt.scripts.length) {
    const scriptList = document.createElement("div");
    scriptList.className = "script-list";
    attempt.scripts.forEach((s) => scriptList.appendChild(renderScriptNode(s, attempt.id)));
    body.appendChild(scriptList);
  }
  if (attempt.children && attempt.children.length) {
    const childList = document.createElement("div");
    childList.className = "attempt-list attempt-children";
    attempt.children.forEach((c) => childList.appendChild(renderAttemptNode(c)));
    body.appendChild(childList);
  }
  details.appendChild(body);
  return details;
}

function renderScriptNode(script, attemptId) {
  const details = document.createElement("details");
  details.className = "script-node";
  details.dataset.rendered = "0";
  // Keyed per owning attempt, not by path alone: two attempts can link the
  // same step script, and auto-refresh must re-expand only the copy the
  // user actually had open.
  details.dataset.scriptKey = attemptId + "::" + script.path;

  const summary = document.createElement("summary");
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = "▸";
  const content = document.createElement("span");
  content.className = "row-content";
  const path = document.createElement("span");
  path.className = "script-path";
  path.textContent = script.path;
  content.appendChild(path);
  content.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    openFilePanel(script.path, "script");
  });
  summary.append(caret, content);
  details.appendChild(summary);

  const body = document.createElement("div");
  details.appendChild(body);

  // Lazy layer: a project with many attempts x many step scripts can carry
  // thousands of read/write rows in one /api/tree response. The JSON is
  // already all in memory, but the DOM for a script's file list is only
  // built the first time its <details> is actually opened. The renderer is
  // also kept reachable on the element itself (an expando -- fine for this
  // inline, build-free app) so restoreTreeState() can re-open a node and
  // fill its body synchronously, without waiting on the browser's
  // asynchronous toggle-event dispatch.
  const ensureRendered = () => {
    if (details.dataset.rendered === "0") {
      renderScriptBody(body, script);
      details.dataset.rendered = "1";
    }
  };
  details._ensureRendered = ensureRendered;
  details.addEventListener("toggle", () => {
    if (details.open) ensureRendered();
  });
  return details;
}

function rwLabel(text) {
  const d = document.createElement("div");
  d.className = "rw-label";
  d.textContent = text;
  return d;
}

function fileList(entries, direction) {
  const ul = document.createElement("ul");
  ul.className = "file-list";
  entries.forEach((entry) => {
    const li = document.createElement("li");
    li.className = "file-row";
    const icon = document.createElement("span");
    icon.className = "flow-icon " + direction;
    icon.textContent = direction === "read" ? "←" : "→";
    icon.title = direction === "read" ? "reads (data flows in)" : "writes (data flows out)";
    li.appendChild(icon);
    if (entry.role === "orphan_input") {
      const dot = document.createElement("span");
      dot.className = "orphan-dot";
      dot.title = "orphan input: no script anywhere writes this file";
      li.appendChild(dot);
    }
    const pathSpan = document.createElement("span");
    pathSpan.textContent = entry.path;
    li.appendChild(pathSpan);
    if (entry.missing) {
      const flag = document.createElement("span");
      flag.className = "missing-flag";
      flag.textContent = "(not found on disk)";
      li.appendChild(flag);
    }
    li.addEventListener("click", () => openFilePanel(entry.path));
    ul.appendChild(li);
  });
  return ul;
}

function renderScriptBody(body, script) {
  body.innerHTML = "";
  const hasReads = script.reads && script.reads.length;
  const hasWrites = script.writes && script.writes.length;
  if (!hasReads && !hasWrites) {
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = "No recorded reads or writes.";
    body.appendChild(note);
    return;
  }
  if (hasReads) {
    body.appendChild(rwLabel("Reads"));
    body.appendChild(fileList(script.reads, "read"));
  }
  if (hasWrites) {
    body.appendChild(rwLabel("Writes"));
    body.appendChild(fileList(script.writes, "write"));
  }
}

// -- Expansion-state capture/restore (auto-refresh, task V3 phase 2) --------
// Both walk the live DOM by the data-keys the renderers stamp on every
// <details>, so an auto-refresh rebuilds the tree from fresh data yet the
// user's open rows stay open. A key that no longer exists after re-ingest
// (row deleted, script unlinked) is simply not matched -- nothing to
// restore is the correct outcome for it.

function captureTreeState() {
  const openAttempts = new Set();
  const openScripts = new Set();
  views.tree.querySelectorAll("details.attempt-node[open]").forEach((d) => {
    if (d.dataset.attemptId) openAttempts.add(d.dataset.attemptId);
  });
  views.tree.querySelectorAll("details.script-node[open]").forEach((d) => {
    if (d.dataset.scriptKey) openScripts.add(d.dataset.scriptKey);
  });
  return { openAttempts, openScripts };
}

function restoreTreeState(saved) {
  views.tree.querySelectorAll("details.attempt-node").forEach((d) => {
    if (saved.openAttempts.has(d.dataset.attemptId)) d.open = true;
  });
  views.tree.querySelectorAll("details.script-node").forEach((d) => {
    if (saved.openScripts.has(d.dataset.scriptKey)) {
      d.open = true;
      // Fill the lazy body now -- the toggle event a property write queues
      // is asynchronous, and the restored row should not flash empty.
      if (d._ensureRendered) d._ensureRendered();
    }
  });
}

async function loadTreeView(preserveState) {
  const container = views.tree;
  const saved = preserveState ? captureTreeState() : null;
  // An auto-refresh keeps the old DOM in place until the new data has
  // actually arrived -- no "Loading…" flash wiping the user's view every
  // time they save a file in their editor.
  if (!saved) container.innerHTML = '<p class="empty-note">Loading…</p>';
  let treeData, attemptsData;
  try {
    [treeData, attemptsData] = await Promise.all([apiGet("/api/tree"), apiGet("/api/attempts")]);
  } catch (err) {
    renderErrorBox(container, err);
    return;
  }
  state.attemptsById = new Map((attemptsData.attempts || []).map((a) => [a.id, a]));
  container.innerHTML = "";
  if (!treeData.attempts || treeData.attempts.length === 0) {
    container.appendChild(renderGuideCard(treeData.hint));
    views.tree.dataset.loaded = "1";
    return;
  }
  const list = document.createElement("div");
  list.className = "attempt-list";
  treeData.attempts.forEach((a) => list.appendChild(renderAttemptNode(a)));
  container.appendChild(list);
  if (saved) restoreTreeState(saved);
  views.tree.dataset.loaded = "1";
}

// -- Lineage view ---------------------------------------------------------------

function clickablePath(text) {
  const span = document.createElement("span");
  span.className = "lineage-path clickable";
  span.textContent = text;
  span.addEventListener("click", () => openFilePanel(text));
  return span;
}

function scriptRefSpan(scriptPath, line, callee) {
  const span = document.createElement("span");
  span.className = "clickable";
  span.textContent = scriptPath + ":" + line + (callee ? " (" + callee + ")" : "");
  span.title = "Open " + scriptPath;
  span.addEventListener("click", () => openFilePanel(scriptPath, "script"));
  return span;
}

function subList(label, entries, renderEntry) {
  const wrap = document.createElement("div");
  wrap.className = "lineage-sub";
  const title = document.createElement("div");
  title.className = "lineage-sub-title";
  title.textContent = label;
  const ul = document.createElement("ul");
  entries.forEach((entry) => {
    const li = document.createElement("li");
    li.appendChild(renderEntry(entry));
    ul.appendChild(li);
  });
  wrap.append(title, ul);
  return wrap;
}

function renderOrphanItem(item) {
  const div = document.createElement("div");
  div.className = "lineage-item";
  div.appendChild(clickablePath(item.path));
  if (item.readers && item.readers.length) {
    div.appendChild(subList("Read by", item.readers, (r) => scriptRefSpan(r.script, r.line, r.callee)));
  }
  return div;
}

function renderChainItem(item) {
  const div = document.createElement("div");
  div.className = "lineage-item";
  div.appendChild(clickablePath(item.path));
  if (item.writers && item.writers.length) {
    div.appendChild(subList("Written by", item.writers, (w) => scriptRefSpan(w.script, w.line, w.callee)));
  }
  if (item.readers && item.readers.length) {
    div.appendChild(subList("Read by", item.readers, (r) => scriptRefSpan(r.script, r.line, r.callee)));
  }
  return div;
}

function renderBrokenItem(item) {
  const div = document.createElement("div");
  div.className = "lineage-item";
  const row = document.createElement("div");
  row.appendChild(scriptRefSpan(item.script, item.line, item.callee));
  const arrow = document.createElement("span");
  arrow.textContent = " " + (item.kind === "writes" ? "→" : "←") + " ";
  row.appendChild(arrow);
  row.appendChild(clickablePath(item.target));
  const flag = document.createElement("span");
  flag.className = "missing-flag";
  flag.textContent = " (" + item.kind + ", not found)";
  row.appendChild(flag);
  div.appendChild(row);
  return div;
}

function renderDuplicateItem(item) {
  const div = document.createElement("div");
  div.className = "lineage-item";
  div.appendChild(clickablePath(item.path));
  if (item.other_copies && item.other_copies.length) {
    div.appendChild(subList("Other copies", item.other_copies, (p) => clickablePath(p)));
  }
  return div;
}

function lineageBlock(title, items, renderItem, accentClay) {
  const section = document.createElement("div");
  section.className = "lineage-block";
  const heading = document.createElement("div");
  heading.className = "section-title" + (accentClay ? " accent-clay" : "");
  const titleSpan = document.createElement("span");
  titleSpan.textContent = title;
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = "(" + (items ? items.length : 0) + ")";
  heading.append(titleSpan, count);
  section.appendChild(heading);
  if (!items || items.length === 0) {
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = "None found.";
    section.appendChild(note);
    return section;
  }
  items.forEach((item) => section.appendChild(renderItem(item)));
  return section;
}

async function loadLineageView() {
  const container = views.lineage;
  container.innerHTML = '<p class="empty-note">Loading…</p>';
  let data;
  try {
    data = await apiGet("/api/lineage");
  } catch (err) {
    renderErrorBox(container, err);
    return;
  }
  container.innerHTML = "";
  container.appendChild(lineageBlock("Orphan inputs", data.orphans, renderOrphanItem, true));
  container.appendChild(lineageBlock("Chains", data.chains, renderChainItem, false));
  container.appendChild(lineageBlock("Broken links", data.broken_links, renderBrokenItem, false));
  container.appendChild(lineageBlock("Duplicate copies", data.duplicates, renderDuplicateItem, false));
  views.lineage.dataset.loaded = "1";
}

// -- Slide-out panel (shared by both views) --------------------------------------

const panel = document.getElementById("panel");
const panelBackdrop = document.getElementById("panel-backdrop");
const panelTitle = document.getElementById("panel-title");
const panelSubtitle = document.getElementById("panel-subtitle");
const panelBody = document.getElementById("panel-body");

function openPanel() {
  panel.classList.remove("hidden");
  panelBackdrop.classList.remove("hidden");
  panel.setAttribute("aria-hidden", "false");
}

function closePanel() {
  panel.classList.add("hidden");
  panelBackdrop.classList.add("hidden");
  panel.setAttribute("aria-hidden", "true");
  state.panelSubject = null;
}

document.getElementById("panel-close").addEventListener("click", closePanel);
panelBackdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !panel.classList.contains("hidden")) closePanel();
});

const FILE_TYPE_RULES = [
  [/\.(py|r|rmd|jl|ipynb|sh)$/i, "script (code)"],
  [/\.(csv|tsv|json|parquet|dta|rds|rda|pkl|feather|h5|hdf5)$/i, "dataset"],
  [/\.(png|jpe?g|pdf|svg|eps|gif|tiff?)$/i, "figure"],
  [/\.(md|txt|tex|bib|rst)$/i, "text / document"],
  [/\.(toml|yaml|yml|ini|cfg)$/i, "config"],
];

function classifyFileType(path, hint) {
  if (hint === "script") return "script (code)";
  for (const [pattern, label] of FILE_TYPE_RULES) if (pattern.test(path)) return label;
  return "file";
}

function codePreview(content) {
  const wrap = document.createElement("div");
  wrap.className = "code-preview";
  const table = document.createElement("table");
  table.className = "code-table";
  const lines = content.split("\n");
  table.innerHTML = lines.map((line, i) =>
    "<tr><td class=\"ln\">" + (i + 1) + "</td><td class=\"src\">" + escapeHtml(line) + "</td></tr>"
  ).join("");
  wrap.appendChild(table);
  return wrap;
}

async function runOpenAction(path, reveal, statusEl) {
  statusEl.className = "panel-status";
  statusEl.textContent = "Working…";
  try {
    const result = await apiPost("/api/open", { path, reveal });
    statusEl.className = "panel-status ok";
    statusEl.textContent = (reveal ? "Revealed in Finder: " : "Opened: ") + result.opened;
  } catch (err) {
    statusEl.className = "panel-status err";
    statusEl.textContent = err.message;
  }
}

function buildFileActions(path, statusEl) {
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  const openBtn = document.createElement("button");
  openBtn.className = "btn";
  openBtn.type = "button";
  openBtn.textContent = "Open";
  const revealBtn = document.createElement("button");
  revealBtn.className = "btn";
  revealBtn.type = "button";
  revealBtn.textContent = "Reveal in Finder";
  openBtn.addEventListener("click", () => runOpenAction(path, false, statusEl));
  revealBtn.addEventListener("click", () => runOpenAction(path, true, statusEl));
  actions.append(openBtn, revealBtn);
  return actions;
}

async function openFilePanel(path, hint) {
  state.panelSubject = { kind: "file", path: path };
  panelTitle.textContent = path;
  panelSubtitle.textContent = classifyFileType(path, hint);
  panelBody.innerHTML = "";
  const status = document.createElement("div");
  status.className = "panel-status";
  panelBody.appendChild(buildFileActions(path, status));
  panelBody.appendChild(status);
  const contentHost = document.createElement("div");
  contentHost.innerHTML = '<p class="empty-note">Loading preview…</p>';
  panelBody.appendChild(contentHost);
  openPanel();

  let data;
  try {
    data = await apiGet("/api/file?path=" + encodeURIComponent(path));
  } catch (err) {
    renderErrorBox(contentHost, err);
    return;
  }
  contentHost.innerHTML = "";
  if (data.truncated) {
    const note = document.createElement("div");
    note.className = "truncated-note";
    note.textContent = "Showing the first " + data.content.length + " of " + data.size + " bytes (truncated).";
    contentHost.appendChild(note);
  }
  contentHost.appendChild(codePreview(data.content));
}

function kvRow(table, label, value) {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  th.textContent = label;
  const td = document.createElement("td");
  if (typeof value === "string") td.textContent = value;
  else td.appendChild(value);
  tr.append(th, td);
  table.appendChild(tr);
}

function openAttemptPanel(id) {
  const attempt = state.attemptsById.get(id);
  state.panelSubject = { kind: "attempt", id: id };
  panelTitle.textContent = id;
  panelSubtitle.textContent = "attempt record";
  panelBody.innerHTML = "";
  if (!attempt) {
    renderErrorBox(
      panelBody,
      new Error("No details loaded for " + id + " -- reopen the Decision Tree tab and try again."),
    );
    openPanel();
    return;
  }
  const attrs = attempt.attrs || {};

  // 编辑 (task V3 phase 3): same form as "＋ 新增尝试", pre-filled for this
  // row -- writes go into the source map file via preview + confirm.
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  const editBtn = document.createElement("button");
  editBtn.className = "btn";
  editBtn.type = "button";
  editBtn.textContent = "编辑";
  editBtn.addEventListener("click", () => openAttemptForm("update", id));
  actions.appendChild(editBtn);
  panelBody.appendChild(actions);

  const table = document.createElement("table");
  table.className = "kv-table";
  kvRow(table, "#", attrs.number || "");
  kvRow(table, "Date", attrs.date || "");
  kvRow(table, "Path / description", attrs.description || "");
  kvRow(table, "Variables", attrs.variables || "");
  kvRow(table, "Verdict", attempt.verdict || "(none)");
  kvRow(table, "Result", attempt.result || "(none)");

  const sourceSpan = document.createElement("span");
  if (attrs.source_file) {
    sourceSpan.className = "clickable";
    sourceSpan.textContent = attrs.source_file + (attrs.source_line ? ":" + attrs.source_line : "");
    sourceSpan.addEventListener("click", () => openFilePanel(attrs.source_file));
  } else {
    sourceSpan.textContent = "(unknown)";
  }
  kvRow(table, "Source", sourceSpan);
  kvRow(table, "Step files", (attrs.step_files && attrs.step_files.length) ? attrs.step_files.join(", ") : "(none)");
  panelBody.appendChild(table);

  if (attrs.step_files_broken && attrs.step_files_broken.length) {
    const warn = document.createElement("div");
    warn.className = "step-broken";
    warn.textContent = "Unresolved step references: " + attrs.step_files_broken.join(", ");
    panelBody.appendChild(warn);
  }
  openPanel();
}

// -- Attempt edit form (task V3 phase 3) ------------------------------------
// One form for both "＋ 新增尝试" (append) and an attempt panel's 编辑
// (update), rendered into the same slide-out panel. Two-step by design:
// submit only ever calls POST /api/attempts/preview (a pure dry run) and
// shows the old/new row; the write happens exclusively on the explicit
// confirm click. Update mode submits ONLY dirty fields -- prefills come
// from the parser's *cleaned* values, so re-writing an untouched cell
// would silently strip the user's own markdown decoration from it.

const EDITABLE_KEYS = ["date", "description", "variables", "result", "verdict"];

function defaultNewNumber() {
  // Task spec: max existing top-level number + 1 ("14a" counts as 14).
  let max = 0;
  state.attemptsById.forEach((a) => {
    const n = parseInt((a.attrs && a.attrs.number) || "", 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return String(max + 1);
}

function defaultDateValue() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  // Match the format the table already uses: any existing bare "MM-DD"
  // row makes new rows follow suit; otherwise full "YYYY-MM-DD".
  let short = false;
  state.attemptsById.forEach((a) => {
    if (/^\d{2}-\d{2}/.test((a.attrs && a.attrs.date) || "")) short = true;
  });
  return short ? mm + "-" + dd : now.getFullYear() + "-" + mm + "-" + dd;
}

function distinctVerdicts() {
  // Quick choices = verdict values already present in this project's own
  // data -- never an invented vocabulary (the researcher owns the markers).
  const seen = new Set();
  state.attemptsById.forEach((a) => {
    const v = (a.verdict || "").trim();
    if (v && v.indexOf("\n") === -1) seen.add(v);
  });
  return Array.from(seen).slice(0, 8);
}

function toCellText(value) {
  // The exact inverse of the server parser's <br> handling (its cell
  // cleanup turns a literal <br> into "\n" when reading): a newline typed
  // -- or carried in from a prefilled multi-line cell -- goes back out as
  // "<br>", since a markdown table cell cannot hold a raw newline and the
  // server rejects one outright.
  return value.replace(/\r\n?/g, "\n").split("\n").map((s) => s.trim()).join("<br>")
    .replace(/^(<br>)+|(<br>)+$/g, "").trim();
}

function formFieldEl(labelText, inputEl) {
  const wrap = document.createElement("div");
  wrap.className = "form-field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.append(label, inputEl);
  return wrap;
}

function panelErrorBoxCn(message) {
  const box = document.createElement("div");
  box.className = "error-box";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = "无法打开编辑表单";
  const msg = document.createElement("div");
  msg.textContent = message;
  box.append(title, msg);
  return box;
}

function setFormStatus(statusEl, cls, cnText, err) {
  // Product language up front, the raw technical message folded below it
  // -- same division as the refresh chip's error handling.
  statusEl.className = "panel-status " + cls;
  statusEl.textContent = cnText + (err ? "：" + (err instanceof Error ? err.message : String(err)) : "");
}

function openAttemptForm(mode, attemptId) {
  state.panelSubject = { kind: "attempt-form" };
  panelBody.innerHTML = "";
  const config = state.attemptsConfig;
  if (!config) {
    panelTitle.textContent = mode === "append" ? "新增尝试" : "编辑尝试";
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn(
      "尚未找到可用的尝试年表配置（.rce/attempts.toml）。请先在项目里配置年表，再从界面新增或编辑。"
    ));
    openPanel();
    return;
  }
  const record = mode === "update" ? state.attemptsById.get(attemptId) : null;
  if (mode === "update" && !record) {
    panelTitle.textContent = "编辑尝试";
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn("找不到这条尝试的记录，请等页面刷新后重试。"));
    openPanel();
    return;
  }
  const attrs = record ? (record.attrs || {}) : {};
  const number = mode === "append" ? defaultNewNumber() : (attrs.number || "");
  panelTitle.textContent = mode === "append" ? "新增尝试" : "编辑尝试 #" + number;
  panelSubtitle.textContent = "将写入 " + config.file;

  const form = document.createElement("form");
  form.className = "attempt-form";
  const inputs = {};
  const initial = {};

  const numberInput = document.createElement("input");
  numberInput.className = "form-input form-mono";
  numberInput.value = number;
  if (mode === "update") {
    // The number is the row's identity (the graph node id derives from
    // it) -- renumbering is a hand edit in the file, not a cell update.
    numberInput.disabled = true;
    numberInput.title = "编号是这一行的身份，界面里不改；如需重编号请直接改源文件";
  }
  form.appendChild(formFieldEl("编号", numberInput));

  // Field labels come from the project's OWN [columns] header text -- the
  // researcher's words, not this tool's.
  const defs = [
    { key: "date", label: "日期（" + (config.columns.date || "date") + "）", mono: true },
    { key: "description", label: config.columns.description || "description", multiline: true },
    { key: "variables", label: config.columns.variables || "variables", multiline: true },
    { key: "result", label: config.columns.result || "result", multiline: true },
    { key: "verdict", label: config.columns.verdict || "verdict" },
  ];
  defs.forEach((def) => {
    let input;
    if (def.multiline) {
      input = document.createElement("textarea");
      input.className = "form-textarea";
      input.rows = 2;
    } else {
      input = document.createElement("input");
      input.className = "form-input" + (def.mono ? " form-mono" : "");
    }
    if (mode === "append") {
      input.value = def.key === "date" ? defaultDateValue() : "";
    } else {
      input.value = def.key === "verdict" ? (record.verdict || "")
        : def.key === "result" ? (record.result || "")
        : (attrs[def.key] || "");
    }
    inputs[def.key] = input;
    initial[def.key] = input.value;
    const fieldEl = formFieldEl(def.label, input);
    if (def.key === "verdict") {
      const verdicts = distinctVerdicts();
      if (verdicts.length) {
        const chips = document.createElement("div");
        chips.className = "verdict-chips";
        verdicts.forEach((v) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.textContent = v;
          chip.addEventListener("click", () => { input.value = v; });
          chips.appendChild(chip);
        });
        fieldEl.appendChild(chips);
      }
    }
    form.appendChild(fieldEl);
  });

  const statusEl = document.createElement("div");
  statusEl.className = "panel-status";

  const actionsEl = document.createElement("div");
  actionsEl.className = "form-actions";
  const submitBtn = document.createElement("button");
  submitBtn.type = "submit";
  submitBtn.className = "btn btn-primary";
  submitBtn.textContent = "预览改动";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "btn";
  cancelBtn.textContent = "取消";
  cancelBtn.addEventListener("click", closePanel);
  actionsEl.append(submitBtn, cancelBtn);
  form.appendChild(actionsEl);

  const previewHost = document.createElement("div");

  function collectBody() {
    const num = mode === "append" ? numberInput.value.trim() : number;
    if (!num) {
      setFormStatus(statusEl, "err", "编号不能为空");
      return null;
    }
    const fields = {};
    if (mode === "append") {
      EDITABLE_KEYS.forEach((key) => { fields[key] = toCellText(inputs[key].value); });
    } else {
      // Dirty fields only (section comment above): an untouched cell must
      // never be round-tripped through its cleaned prefill.
      EDITABLE_KEYS.forEach((key) => {
        if (inputs[key].value !== initial[key]) fields[key] = toCellText(inputs[key].value);
      });
      if (Object.keys(fields).length === 0) {
        setFormStatus(statusEl, "", "没有需要写入的改动");
        return null;
      }
    }
    return { op: mode, number: num, fields: fields };
  }

  function setFormDisabled(disabled) {
    numberInput.disabled = disabled || mode === "update";
    EDITABLE_KEYS.forEach((key) => { inputs[key].disabled = disabled; });
    submitBtn.disabled = disabled;
  }

  function renderPreview(preview, body) {
    previewHost.innerHTML = "";
    setFormDisabled(true); // frozen while the preview stands -- 返回修改 unfreezes
    if (preview.old_row !== null && preview.old_row !== undefined) {
      const oldLabel = document.createElement("div");
      oldLabel.className = "diff-label";
      oldLabel.textContent = "原行";
      const oldRow = document.createElement("div");
      oldRow.className = "diff-row old";
      oldRow.textContent = preview.old_row;
      previewHost.append(oldLabel, oldRow);
    }
    const newLabel = document.createElement("div");
    newLabel.className = "diff-label";
    newLabel.textContent = "新行";
    const newRow = document.createElement("div");
    newRow.className = "diff-row new";
    newRow.textContent = preview.new_row;
    previewHost.append(newLabel, newRow);

    const note = document.createElement("div");
    note.className = "confirm-note";
    note.textContent = "将写入 " + preview.file + "（已自动备份）";
    const confirmActions = document.createElement("div");
    confirmActions.className = "form-actions";
    const confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.className = "btn btn-primary";
    confirmBtn.textContent = "确认写入";
    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "btn";
    backBtn.textContent = "返回修改";
    backBtn.addEventListener("click", () => {
      previewHost.innerHTML = "";
      setFormDisabled(false);
      statusEl.textContent = "";
    });
    confirmActions.append(confirmBtn, backBtn);
    previewHost.append(note, confirmActions);

    confirmBtn.addEventListener("click", async () => {
      confirmBtn.disabled = true;
      backBtn.disabled = true;
      setFormStatus(statusEl, "", "正在写入…");
      let result;
      try {
        // The confirmed body, verbatim -- the server re-validates against
        // the file's current state under the ingest lock either way.
        result = await apiPost("/api/attempts/write", body);
      } catch (err) {
        setFormStatus(statusEl, "err", "写入失败，文件没有被修改", err);
        backBtn.disabled = false; // 返回修改, fix, and re-preview
        return;
      }
      if (result.ingest_error) {
        // The file edit itself landed (and is backed up) -- only the
        // rescan failed; the refresh chip carries the same error.
        setFormStatus(statusEl, "err", "已写入并备份，但重扫失败", result.ingest_error);
        backBtn.disabled = false;
        pollGeneration();
        return;
      }
      closePanel(); // success -- the auto-refresh renders the new state
      pollGeneration();
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = collectBody();
    if (!body) return;
    setFormStatus(statusEl, "", "正在生成预览…");
    let preview;
    try {
      preview = await apiPost("/api/attempts/preview", body);
    } catch (err) {
      setFormStatus(statusEl, "err", "无法生成预览", err);
      return;
    }
    statusEl.textContent = "";
    renderPreview(preview, body);
  });

  panelBody.append(form, statusEl, previewHost);
  openPanel();
  (mode === "append" ? numberInput : inputs.description).focus();
}

document.getElementById("new-attempt-btn").addEventListener("click", () => openAttemptForm("append"));

// -- Init -------------------------------------------------------------------
// loadProjects() first (awaited): it fills state.projectLabel, which the
// summary line prefers over a raw-path basename. The views themselves never
// wait on either -- activateView kicks off its own fetch. The generation
// poll (task V3 phase 2) starts alongside: syncGeneration() records the
// server's current generation as this page's starting point (so the first
// interval tick compares against reality, not null), then the interval
// keeps watching for the server-side watcher's bumps.

(async () => {
  await loadProjects();
  loadProjectSummary();
  activateView("tree");
  syncGeneration();
  setInterval(pollGeneration, REFRESH_POLL_MS);
})();
</script>
</body>
