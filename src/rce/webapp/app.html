    if (row.state !== "ok" && row.message) div.appendChild(mk("span", "var-chip bad", row.message));
    else if (row.trust_state && row.trust_state !== "ok" && row.message) div.appendChild(mk("span", "var-chip bad", row.message));
    (row.dead_flags || []).forEach((f) => div.appendChild(mk("span", "var-chip wait", f.message)));
    div.addEventListener("click", () => openVariableCard(row.id));
    host.appendChild(div);
  });
}

function versionLabel(v) {
  if (v.status === "unknown") return "v" + v.version + " · 状态暂不可知";
  if (v.status === "draft") return "v" + v.version + " · 草稿";
  if (v.status === "in_use") return "v" + v.version + " · 使用中";
  if (v.status === "superseded") return "v" + v.version + " · 已被 v" + v.superseded_by.version + " 取代（" + atText(v.superseded_by.at) + "）";
  if (v.status === "removed") return "v" + v.version + " · 已移除";
  if (v.status === "orphan_draft") return "v" + v.version + " · 未确认（不是最新编号）";
  return "v" + v.version + " · 已确认";
}

function defaultVersion(card) {
  const numbers = card.versions.map((v) => v.version);
  if (varState.version != null && numbers.indexOf(varState.version) >= 0) return varState.version;
  if (card.in_use != null) return card.in_use;
  if (card.draft != null) return card.draft;
  return numbers.length ? numbers[numbers.length - 1] : null;
}

function fieldRow(parent, label, value, cls) {
  const row = mk("div", "var-field");
  row.appendChild(mk("div", "var-field-label", label));
  const blank = value == null || (typeof value === "string" && !value.trim()) || (Array.isArray(value) && !value.length);
  const shown = blank ? "（未填写）" : Array.isArray(value) ? value.join("、") : String(value);
  row.appendChild(mk("div", "var-field-value" + (blank ? " var-empty-value" : cls ? " " + cls : ""), shown));
  parent.appendChild(row);
}

function varBlock(doc, title) {
  const block = mk("div", "var-block");
  block.appendChild(mk("h3", "var-block-title", title));
  doc.appendChild(block);
  return block;
}

// The five blocks of 9.11, as the researcher wrote them.
function renderDefinition(doc, content) {
  const c = content || {};
  const meaning = varBlock(doc, "含义");
  fieldRow(meaning, "含义", c.meaning);
  fieldRow(meaning, "单位", c.unit);
  fieldRow(meaning, "粒度", c.granularity);
  const inputs = varBlock(doc, "输入");
  if (!(c.input || []).length) inputs.appendChild(mk("div", "var-line soft", "（未填写）"));
  (c.input || []).forEach((item) => {
    const box = mk("div", "var-input");
    if (item.variable) fieldRow(box, "变量", item.variable, "path");
    else fieldRow(box, "数据文件", item.dataset, "path");
    if (item.fields) fieldRow(box, "字段", item.fields, "path");
    if (item.data_version != null) fieldRow(box, "数据版本", item.data_version);
    inputs.appendChild(box);
  });
  const cons = varBlock(doc, "构建口径");
  const k = c.construction || {};
  fieldRow(cons, "公式", k.formula, "formula");
  [["filter", "筛选"], ["aggregation", "聚合"], ["missing", "缺失处理"], ["transform", "变换"], ["params", "参数"]]
    .forEach(([key, label]) => fieldRow(cons, label, k[key]));
  const impl = varBlock(doc, "实现依据");
  const m = c.implementation || {};
  fieldRow(impl, "脚本", m.script, "path");
  if (m.chunk) fieldRow(impl, "代码块", m.chunk, "path");
  if (m.function) fieldRow(impl, "函数", m.function, "path");
  fieldRow(impl, "输出文件", m.output, "path");
  fieldRow(impl, "字段", m.field, "path");
  if (m.code_version) fieldRow(impl, "代码版本", m.code_version);
  const dec = varBlock(doc, "人工决策");
  const d = c.decision || {};
  fieldRow(dec, "理由", d.why);
  fieldRow(dec, "决定人", d.decided_by);
  fieldRow(dec, "采用日期", d.adopted_on);
}

async function openVariableCopy(cardId, entry, kind) {
  const subject = { kind: "variable-copy" };
  state.panelSubject = subject;
  panelTitle.textContent = kind === "code" ? "当时的代码" : "当时的文字";
  panelTitle.title = "";
  panelSubtitle.textContent = cardId + " · " + cardActText(entry);
  panelBody.innerHTML = "";
  panelBody.appendChild(mk("p", "empty-note", "载入中…"));
  openPanel();
  let data;
  try {
    data = await apiGet("/api/variables/" + (kind === "code" ? "code" : "frozen") +
      "?id=" + encodeURIComponent(cardId) + "&entry=" + encodeURIComponent(entry.id));
  } catch (err) {
    if (state.panelSubject !== subject) return;
    panelBody.innerHTML = "";
    const box = mk("div", "notice-status err");
    renderBlockingError(box, kind === "code" ? "无法读取当时的代码副本" : "无法读取当时的文字副本", err);
    panelBody.appendChild(box);
    return;
  }
  if (state.panelSubject !== subject) return;
  panelBody.innerHTML = "";
  panelBody.appendChild(mk("div", "fact-line", kind === "code"
    ? "确认时复制下来的脚本：.rce/variables/" + data.copy + "（不会被改动）"
    : "确认时冻结的版本文字：" + data.frozen + "（不会被改动）"));
  if (data.truncated) panelBody.appendChild(mk("div", "truncated-note", "只显示了开头的部分。"));
  panelBody.appendChild(mk("pre", "var-code", data.text));
}

function confirmationSection(host, card, v) {
  const sec = mk("div", "var-section");
  sec.appendChild(mk("div", "var-section-title", "确认记录"));
  const entry = v.entry || {};
  sec.appendChild(mk("div", "var-line", "确认于 " + atText(v.confirmed_at) +
    (entry.act === "corrected" ? "；当前文字来自 " + atText(entry.at) + " 的更正" : "")));
  // The attestation was given at the confirmation, about the text confirmed
  // and the output then on disk: it is set beside THAT confirmation's own
  // checks, never beside a later correction's (9.11).
  const words = confirmationWording(v);
  const moment = words.moment;
  sec.appendChild(mk("div", "var-statement", words.statement));
  const checked = v.checked || {};
  const lines = [];
  ["script", "writes"].forEach((k) => { if (checked[k]) lines.push([k, checked[k]]); });
  (checked.reads || []).forEach((r) => lines.push(["reads", r]));
  if (checked.field) lines.push(["field", checked.field]);
  if (lines.length) sec.appendChild(mk("div", "var-section-title", words.checksTitle));
  lines.forEach(([k, item]) => {
    const cls = item.result === "已核对" ? " ok" : item.result === "不符" ? " bad" : " soft";
    const line = mk("div", "var-line" + cls, checkLine(k, item));
    if (k === "script" && item.copy && !v.code_missing) {
      line.appendChild(mkButton("查看当时的代码", "btn btn-small", () => openVariableCopy(card.id, entry, "code")));
    }
    sec.appendChild(line);
  });
  const observed = v.observed || {};
  if (observed.output || (observed.inputs || []).length) sec.appendChild(mk("div", "var-section-title", words.observedTitle));
  if (observed.output) sec.appendChild(mk("div", "var-line soft", observedLine("output", observed.output, moment)));
  (observed.inputs || []).forEach((i) => sec.appendChild(mk("div", "var-line soft", observedLine("input", i, moment))));
  if (v.copy_missing) sec.appendChild(mk("div", "var-line bad", v.copy_missing));
  if (v.reference) {
    sec.appendChild(mk("div", "var-line soft", "引用这一版：" + v.reference.label +
      (v.reference.resolves === false ? "（引用暂不可解析）" : "")));
  }
  (v.upstream || []).forEach((u) => sec.appendChild(mk("div", "var-line soft", "建立在 " + u.ref + " 之上" + (u.resolves ? "" : "（" + u.unresolvable + "）"))));
  (v.upstream_notes || []).forEach((n) => sec.appendChild(mk("div", "var-line", n)));
  host.appendChild(sec);
}

function draftActions(host, card, v) {
  const actions = mk("div", "var-actions");
  const status = mk("div", "notice-status");
  const buttons = [];
  const path = ".rce/variables/" + card.id + "/" + v.file;
  const open = mkButton("在编辑器中打开", "btn", () => runOpenAction(path, false, status));
  actions.appendChild(open);
  const blocked = humanRecordsBlocked();
  const key = card.id + ":v" + v.version;
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
  } else if (v.status === "draft") {
    const ask = mkButton("确认这一版", "btn btn-primary", () => {
      varState.asking = key;
      varState.askingHash = v.content_hash;
      loadVariablesView();
    });
    buttons.push(ask);
    actions.appendChild(ask);
  }
  host.append(actions);
  // 9.12: an answer belongs to the question that was shown. The draft was
  // saved again since the question opened: the question closes, and the
  // researcher reads the new text before answering.
  if (varState.asking === key && v.content_hash !== varState.askingHash) {
    varState.asking = null;
    varState.askingHash = null;
    host.appendChild(mk("div", "notice-status err", "草稿在提问之后又被改动了：请先看一遍现在的内容，再点「确认这一版」。"));
  }
  if (varState.asking === key && !blocked && v.status === "draft") {
    const box = mk("div", "var-ask");
    box.appendChild(mk("div", "notice-title", "确认之前，回答一个问题（只问这一次）"));
    box.appendChild(mk("p", null, "输出文件现在的内容，是按这一版口径生成的吗？你的回答会作为你本人的说明记下来；RCE 不会凭文件指纹替你推断。"));
    const row = mk("div", "var-actions");
    [["yes", "是"], ["no", "否"], ["unknown", "不确定"]].forEach(([answer, label]) => {
      const b = mkButton(label, "btn", async () => {
        const res = await variableAction("confirm", { id: card.id, attested: answer, content_hash: varState.askingHash },
          status, buttons, "没能确认这一版");
        if (res) { varState.asking = null; varState.askingHash = null; varState.version = res.version; }
      });
      buttons.push(b);
      row.appendChild(b);
    });
    const cancel = mkButton("先不确认", "btn", () => { varState.asking = null; varState.askingHash = null; loadVariablesView(); });
    row.appendChild(cancel);
    box.appendChild(row);
    host.appendChild(box);
  }
  host.appendChild(status);
}

function inUseActions(host, card, v) {
  const blocked = humanRecordsBlocked();
  const actions = mk("div", "var-actions");
  const status = mk("div", "notice-status");
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
    host.append(actions);
    return;
  }
  const buttons = [];
  if (card.draft == null) {
    const revise = mkButton("修订口径", "btn", () => variableAction("revise", { id: card.id }, status, buttons, "没能打开下一版草稿")
      .then((res) => { if (res) { varState.version = res.version; loadVariablesView(); } }));
    revise.title = "把这一版的文件原样复制为下一版草稿，在草稿里改";
    buttons.push(revise);
    actions.appendChild(revise);
  } else {
    actions.appendChild(mk("span", "review-note", "已有草稿 v" + card.draft + "：在草稿里改，确认后它取代这一版"));
  }
  const note = varNote("abandon:" + card.id, "弃用的理由（必填，用你自己的话）");
  const abandon = mkButton("弃用", "btn", () => {
    if (!note.value.trim()) { setStatus(status, "err", "请写下弃用的理由"); return; }
    variableAction("abandon", { id: card.id, note: note.value }, status, buttons, "没能弃用这个变量")
      .then((res) => { if (res) varState.notes.delete("abandon:" + card.id); });
  });
  buttons.push(abandon);
  actions.append(note, abandon);
  host.append(actions, status);
}

function renderVersion(host, card, v) {
  const doc = mk("div", "var-doc");
  if (v.status === "draft" || v.status === "orphan_draft") doc.appendChild(mk("div", "var-doc-label", v.label || "草稿 · 改动不留版本"));
  // A card whose log.toml cannot be trusted: no status is derived from it
  // -- never 「草稿」, which would say confirmed text may be edited freely.
  if (v.status === "unknown") doc.appendChild(mk("div", "var-doc-label", v.label || "记录文件无法使用，这一版的状态暂不可知"));
  if (v.error) {
    const err = mk("div", "notice-status err");
    renderBlockingError(err, v.file_state === "invalid"
      ? "这个版本文件有一处无法读取" + (v.line ? "（第 " + v.line + " 行）" : "")
      : "这个版本文件现在无法读取", v.error);
    doc.appendChild(err);
  }
  if (v.question && v.question_kind === "absent") {
    doc.appendChild(mk("div", "var-doc-label", "版本文件在确认后不见了；下面是确认时冻结的文字。"));
  } else if (v.question) {
    doc.appendChild(mk("div", "var-doc-label", "文件在确认后被改动了；下面是确认时的文字，改动没有生效。"));
  }
  if (v.content) renderDefinition(doc, v.content);
  else if (!v.error) doc.appendChild(mk("div", "var-line soft", "这个版本的文件不在了。"));
  host.appendChild(doc);
  if (v.status === "draft" || v.status === "orphan_draft") draftActions(host, card, v);
  if (v.entry) confirmationSection(host, card, v);
  if (v.status === "in_use" && !card.abandoned) inUseActions(host, card, v);
}

function questionNotice(card, q) {
  const box = notice("warn");
  noticeHead(box, q.message);
  box.appendChild(mk("p", null, q.kind === "absent"
    ? "现在生效的仍是确认时冻结的那一份文字。要把版本文件放回原处吗？"
    : q.kind === "unreadable"
      ? "这个文件现在读不出文字，RCE 没有采用它，现在生效的仍是确认时冻结的那一份。"
      : "RCE 没有采用改动后的文字，现在生效的仍是确认时的那一份。请告诉 RCE 这次改动是什么："));
  const status = mk("div", "notice-status");
  const buttons = [];
  const help = q.kind === "absent" ? {
    new: "v" + q.version + " 的文件不在了，没有改动可以保留：按确认时冻结的副本原样放回。",
  } : q.kind === "unreadable" ? {
    new: "读不出的文件内容原样存为新草稿 v" + card.next_version + "（不丢任何字节）；v" + q.version + " 的文件按冻结副本原样放回。",
  } : {
    new: "改动后的文件原样成为新草稿 v" + card.next_version + "；v" + q.version + " 的文件按冻结副本原样放回。",
    correct: "这是更正（错字、表述更清楚、脚本换了位置）：记一条更正，前后两种文字都保留可读。",
  };
  if (humanRecordsBlocked()) {
    box.appendChild(mk("p", null, humanRecordsBlocked()));
    return box;
  }
  q.answers.forEach((answer) => {
    const row = mk("div", "answer");
    const b = mkButton(q.answer_labels[answer], "btn", () =>
      variableAction("answer", { id: card.id, question: "edited", answer: answer, version: q.version, content_hash: q.content_hash },
        status, buttons, "没能完成这个回答"));
    buttons.push(b);
    row.append(b, mk("span", "answer-help", help[answer] || ""));
    box.appendChild(row);
  });
  box.appendChild(status);
  return box;
}

function cardTrustNotice(card) {
  const trust = card.trust || {};
  if (card.state === "ok" && (!trust.state || trust.state === "ok")) return null;
  if (card.state === "frozen" && card.reason === "conflict" && card.dispute) return disputeNotice(card);
  if (trust.state === "shrunk") {
    const missing = trust.missing || [];
    const box = notice("warn");
    noticeHead(box, trust.message || "变量卡的记录文件比图谱少了 " + missing.length + " 条记录");
    box.appendChild(mk("p", null, "图谱记得下面这些记录，但卡片的 log.toml 里没有了。RCE 什么都没改，等你决定以哪一份为准。"));
    const list = mk("ul", "entry-list");
    missing.forEach((m) => list.appendChild(mk("li", null, cardActText(m) + (m.note ? " · " + m.note : ""))));
    box.appendChild(list);
    const ids = missing.map((m) => m.id);
    const status = mk("div", "notice-status");
    const buttons = [];
    [["file", "以文件为准", "图谱忘掉这些记录；被移除的版本编号不再使用。"],
     ["restore", "把缺少的补回文件", "把这些记录按原样追加回 log.toml 末尾（标为补回）。"]].forEach(([answer, label, help]) => {
      const row = mk("div", "answer");
      const b = mkButton(label, "btn", () =>
        variableAction("answer", { id: card.id, question: "shrunk", answer: answer, missing: ids }, status, buttons, "没能完成这个回答"));
      buttons.push(b);
      row.append(b, mk("span", "answer-help", help));
      box.appendChild(row);
    });
    box.appendChild(status);
    return box;
  }
  const box = notice("bad");
  noticeHead(box, card.message || trust.message || "这张变量卡当前无法读取");
  box.appendChild(mk("p", null, "修好之前，这张卡的确认、弃用等动作都不会被记录；其他卡片照常。"));
  const raw = [card.detail || trust.detail].concat(card.problems || []).filter(Boolean).join("\n");
  if (raw) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", raw);
    box.appendChild(d);
  }
  return box;
}

// 9.12: two histories in a card's log are settled by naming what stands.
// Both histories side by side; 「以这一条为准」 beside each disputed
// confirmation; one confirm step that lists what will stand. Nothing is
// chosen for the researcher -- not by position, not by time.
const settleChoice = new Map(); // card id -> {version: entry id}

function disputeNotice(card) {
  const d = card.dispute;
  const box = notice("warn");
  noticeHead(box, "这张卡的记录里有两份历史（两处的记录被合并了）");
  box.appendChild(mk("p", null, "两台电脑（或两个副本）各自记下了不同的确认，同步后合在了一个 log.toml 里。" +
    "RCE 不按先后、不按时间替你选：请为每个有争议的版本指明以哪一条为准。其余记录留在历史里，标为不再生效。"));
  const chosen = settleChoice.get(card.id) || {};
  settleChoice.set(card.id, chosen);
  const candidateOf = {};
  d.versions.forEach((v) => v.candidates.forEach((id) => { candidateOf[id] = v.version; }));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  const entryLine = (e) => {
    const line = mk("div", "var-line" + (chosen[candidateOf[e.id]] === e.id ? " chosen" : ""), cardActText(e));
    if (e.content) line.appendChild(mk("span", "var-id", " · 内容 " + String(e.content).slice(7, 15)));
    if (e.attested) line.appendChild(mk("span", "var-id", " · 说明：输出按此口径生成 — " + (ATTESTED_WORDS[e.attested] || e.attested)));
    if (e.frozen) line.appendChild(mkButton("查看这一条的文字", "btn btn-small", () => openVariableCopy(card.id, e, "frozen")));
    if (candidateOf[e.id] != null && !blocked) {
      const pick = mkButton(chosen[candidateOf[e.id]] === e.id ? "已选：以这一条为准" : "以这一条为准", "btn btn-small", () => {
        chosen[candidateOf[e.id]] = e.id;
        loadVariablesView();
      });
      line.appendChild(pick);
    }
    return line;
  };
  if (d.common.length) {
    const shared = mk("div", "var-history");
    shared.appendChild(mk("div", "var-history-title", "两份历史共有的记录"));
    d.common.forEach((e) => shared.appendChild(entryLine(e)));
    box.appendChild(shared);
  }
  const cols = mk("div", "var-histories");
  d.branches.forEach((branch, i) => {
    const col = mk("div", "var-history");
    col.appendChild(mk("div", "var-history-title", "第 " + (i + 1) + " 份历史（分开之后）"));
    if (!branch.length) col.appendChild(mk("div", "var-line soft", "这份历史在分开之后没有关于这张卡的记录"));
    branch.forEach((e) => col.appendChild(entryLine(e)));
    cols.appendChild(col);
  });
  box.appendChild(cols);
  if (blocked) { box.appendChild(mk("p", null, blocked)); return box; }
  const byId = {};
  const where = {};
  d.common.forEach((e) => { byId[e.id] = e; where[e.id] = "两份历史共有"; });
  d.branches.forEach((branch, i) => branch.forEach((e) => { byId[e.id] = e; where[e.id] = "第 " + (i + 1) + " 份历史"; }));
  const label = (id) => where[id] + "：" + cardActText(byId[id]) + (byId[id].content ? " · 内容 " + String(byId[id].content).slice(7, 15) : "");
  const missing = d.versions.filter((v) => !chosen[v.version]).map((v) => "v" + v.version);
  if (missing.length) {
    box.appendChild(mk("p", null, "还需要选：" + missing.join("、")));
  } else {
    const keeps = d.versions.map((v) => chosen[v.version]);
    const confirmBox = mk("div", "var-ask");
    confirmBox.appendChild(mk("div", "notice-title", "确认之后，以这些为准："));
    const list = mk("ul", "entry-list");
    d.versions.forEach((v) => list.appendChild(mk("li", null, "v" + v.version + " — " + label(chosen[v.version]))));
    confirmBox.appendChild(list);
    const off = d.shown.filter((id) => keeps.indexOf(id) < 0 && byId[id] && d.common.indexOf(byId[id]) < 0);
    // Shown in file order, as both histories list them.
    off.sort((x, y) => (byId[x].seq || 0) - (byId[y].seq || 0));
    if (off.length) {
      confirmBox.appendChild(mk("div", null, "这些记录留在历史里，但不再生效："));
      const offList = mk("ul", "entry-list");
      off.forEach((id) => offList.appendChild(mk("li", null, label(id))));
      confirmBox.appendChild(offList);
    }
    const buttons = [];
    const actions = mk("div", "var-actions");
    const go = mkButton("确认，以这些为准", "btn", () =>
      variableAction("settle", { id: card.id, keeps: keeps, shown: d.shown }, status, buttons, "没能记下这个选择")
        .then((res) => { if (res) settleChoice.delete(card.id); }));
    const clear = mkButton("重新选", "btn", () => { settleChoice.delete(card.id); loadVariablesView(); });
    buttons.push(go, clear);
    actions.append(go, clear);
    confirmBox.appendChild(actions);
    box.appendChild(confirmBox);
  }
  box.appendChild(status);
  return box;
}

function abandonedNotice(card) {
  const a = card.abandoned;
  const box = notice("");
  noticeHead(box, "已弃用 · " + atText(a.at));
  box.appendChild(mk("p", null, "你当时写下的理由：" + (a.note || "")));
  box.appendChild(mk("p", null, "弃用期间没有版本在使用；每个确认过的版本仍可被引用、仍可阅读。"));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  if (blocked) { box.appendChild(mk("p", null, blocked)); return box; }
  const actions = mk("div", "var-actions");
  const note = varNote("revive:" + card.id, "恢复的理由（必填）");
  const buttons = [];
  const revive = mkButton("恢复", "btn", () => {
    if (!note.value.trim()) { setStatus(status, "err", "请写下恢复的理由"); return; }
    variableAction("revive", { id: card.id, note: note.value }, status, buttons, "没能恢复这个变量")
      .then((res) => { if (res) varState.notes.delete("revive:" + card.id); });
  });
  buttons.push(revive);
  actions.append(note, revive);
  box.append(actions, status);
  return box;
}

// The stage-(b) comparison of one card's version in use: how far it looked,
// and -- when something moved -- the two answers.
function implementationSection(host, card, review) {
  const sec = mk("div", "var-section");
  sec.appendChild(mk("div", "var-section-title", "实现依据现在的样子（与 v" + review.version + " 最近一次" +
    (review.baseline_act === "reaffirmed" ? "确认口径未变" : review.baseline_act === "corrected" ? "更正" : "确认") +
    "时相比，" + atText(review.baseline_at) + "）"));
  sec.appendChild(mk("div", "var-line" + (review.script.state === "same" ? "" : review.script.state === "changed" || review.script.state === "region_missing" ? " bad" : " soft"),
    coverageLine(review.script, "script")));
  review.inputs.forEach((i) => sec.appendChild(mk("div", "var-line" + (i.state === "changed" ? " bad" : i.state === "same" ? "" : " soft"), coverageLine(i, "input"))));
  const large = review.inputs.some((i) => i.large && i.state === "same" && i.coverage !== "full");
  const status = mk("div", "notice-status");
  if (large && !humanRecordsBlocked()) {
    const actions = mk("div", "var-actions");
    const full = mkButton("完整比对", "btn btn-small", () =>
      variableAction("full-compare", { id: card.id }, status, [full], "没能完成完整比对"));
    full.title = "逐字节计算大文件的内容指纹，与确认时记下的比较（可能要一会儿）";
    actions.append(full, mk("span", "answer-help", "大文件只比较了大小；需要时可以逐字节比对。"));
    sec.appendChild(actions);
  }
  sec.appendChild(status);
  if (review.under_review) sec.appendChild(cardReviewMember(review, true));
  host.appendChild(sec);
}

// One card under review, with 「口径未变」 / 「口径已变」.
function cardReviewMember(review, standalone) {
  const box = mk("div", standalone ? "var-ask" : "var-member");
  const title = mk("div", "review-link", (review.name || review.card) + " · " + review.card + " v" + review.version);
  if (!standalone) {
    title.classList.add("clickable");
    title.addEventListener("click", () => openVariableCard(review.card));
  }
  box.appendChild(title);
  review.reasons.forEach((r) => box.appendChild(mk("span", "review-reason", r.label)));
  if (!standalone) {
    box.appendChild(mk("div", "var-line soft", coverageLine(review.script, "script")));
    review.inputs.forEach((i) => box.appendChild(mk("div", "var-line soft", coverageLine(i, "input"))));
  }
  box.appendChild(mk("p", "review-note", review.cannot_tell));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  if (blocked) {
    box.appendChild(mk("p", "review-note", blocked));
    return box;
  }
  const actions = mk("div", "var-actions");
  const buttons = [];
  const region = review.reasons.some((r) => r.code === "chunk_missing" || r.code === "function_missing");
  let dataVersion = null;
  if (review.needs_data_version && !region) {
    dataVersion = varNote("dv:" + review.card + ":" + review.signature, "新的数据版本说明（必填），例：2017-01 至 2024-12，2026-10 重新下载");
    actions.appendChild(dataVersion);
  }
  if (region) {
    box.appendChild(mk("p", "review-note", "卡片指定的代码块或函数找不到了：如果只是改了名字，在卡片文件里改正 chunk / function，再回答「这是更正」；否则选「口径已变」。"));
  } else {
    const same = mkButton("口径未变", "btn", () => {
      if (dataVersion && !dataVersion.value.trim()) { setStatus(status, "err", "输入数据变了：请写下新的数据版本说明"); return; }
      const item = { id: review.card, version: review.version, signature: review.signature };
      if (dataVersion) item.data_version = dataVersion.value.trim();
      variableAction("reaffirm", { items: [item] }, status, buttons, "没能记下口径未变");
    });
    same.title = "记下：实现变了，但这一版的口径没有变（附上现在的指纹）";
    buttons.push(same);
    actions.appendChild(same);
  }
  if (review.draft != null) {
    actions.appendChild(mk("span", "review-note", review.draft_note));
  } else {
    const changed = mkButton("口径已变", "btn", () =>
      variableAction("revise", { id: review.card }, status, buttons, "没能打开下一版草稿"));
    changed.title = "打开下一版草稿，在草稿里写下新的口径";
    buttons.push(changed);
    actions.appendChild(changed);
  }
  box.append(actions, status);
  return box;
}

// The cards' part of the 待复核 list: one item per changed script.
function renderCardReviewGroups(host, cardItems) {
  host.appendChild(mk("div", "review-quiet-title", "变量卡：实现依据有变化"));
  cardItems.groups.forEach((group) => {
    const box = mk("div", "review-item");
    if (group.script) {
      box.appendChild(mk("div", "review-link", group.script));
      box.appendChild(mk("span", "review-reason", group.message));
    } else {
      box.appendChild(mk("div", "review-link", "输入数据"));
    }
    if (!group.counted) box.appendChild(mk("div", "review-note", "已为它打开下一版草稿，不计入待复核数；确认草稿之后这一项自然消失。"));
    const status = mk("div", "notice-status");
    const answerable = group.cards.filter((m) => m.draft == null);
    const together = group.cards.length > 1 && answerable.length > 1 && !humanRecordsBlocked() &&
      answerable.every((m) => !m.needs_data_version && !m.reasons.some((r) => r.code !== "script_changed"));
    if (together) {
      const actions = mk("div", "var-actions");
      const all = mkButton("全部口径未变", "btn btn-primary", () => variableAction("reaffirm", {
        items: answerable.map((m) => ({ id: m.card, version: m.version, signature: m.signature })),
      }, status, [all], "没能全部记下口径未变"));
      all.title = "为下面每张卡各记一条「口径未变」";
      actions.append(all, mk("span", "answer-help", "下面 " + answerable.length + " 张卡各记一条；也可以逐个回答。"));
      box.append(actions, status);
    }
    group.cards.forEach((m) => box.appendChild(cardReviewMember(m, false)));
    host.appendChild(box);
  });
}

function renderVariableCard(host, card) {
  const back = mkButton("← 全部变量", "var-back", () => { varState.card = null; varState.version = null; loadVariablesView(); });
  host.appendChild(back);
  const head = mk("div", "var-head");
  head.append(mk("h2", "var-title", card.name), mk("span", "var-id", card.id));
  cardChips({ state: card.state, reason: card.reason, abandoned: !!card.abandoned, in_use: card.in_use, draft: card.draft })
    .forEach(([text, cls]) => head.appendChild(mk("span", "var-chip " + cls, text)));
  host.appendChild(head);
  const shownVersion = card.versions.find((v) => v.version === card.in_use) || card.versions[card.versions.length - 1];
  const aliases = shownVersion && shownVersion.content && shownVersion.content.aliases;
  if (aliases && aliases.length) host.appendChild(mk("div", "var-aliases", "尝试表里的写法：" + aliases.join("、")));
  const notes = mk("div", "notices");
  const trust = cardTrustNotice(card);
  if (trust) notes.appendChild(trust);
  if (card.abandoned) notes.appendChild(abandonedNotice(card));
  (card.questions || []).forEach((q) => notes.appendChild(questionNotice(card, q)));
  (card.dead_flags || []).forEach((f) => {
    const box = notice("warn");
    noticeHead(box, f.message);
    box.appendChild(mk("p", null, f.direction === "card_only"
      ? "这张卡已弃用，但 .rce/attempts.toml 的已弃用变量列表里没有它的任何写法。"
      : "attempts.toml 把「" + (f.dead || []).join("、") + "」列为已弃用，但这张卡没有弃用。两处说法不一致，RCE 不替你统一。"));
    notes.appendChild(box);
  });
  if (notes.childElementCount) host.appendChild(notes);
  if (!card.versions.length) {
    host.appendChild(mk("p", "empty-note", "这张卡还没有版本文件。"));
    return;
  }
  const selected = defaultVersion(card);
  const tabs = mk("div", "var-versions");
  card.versions.forEach((v) => {
    const b = mkButton(versionLabel(v), "var-version-btn" + (v.version === selected ? " active" : ""), () => {
      varState.version = v.version;
      loadVariablesView();
    });
    tabs.appendChild(b);
  });
  host.appendChild(tabs);
  const v = card.versions.find((x) => x.version === selected);
  if (card.implementation && v && v.version === card.implementation.version) implementationSection(host, card, card.implementation);
  if (v) renderVersion(host, card, v);
  const hist = mk("div", "var-section");
  hist.appendChild(mk("div", "var-section-title", "记录（log.toml，按追加顺序）"));
  if (!(card.history || []).length) hist.appendChild(mk("div", "var-line soft", card.state === "ok"
    ? "还没有记录：草稿确认之前，log.toml 里什么都没有。"
    : "log.toml 现在无法读取，里面的记录暂时看不到（文件本身没有被改动）。"));
  (card.history || []).forEach((e) => {
    const line = mk("div", "var-line" + (e.in_force === false ? " off" : ""), cardActText(e) + (e.in_force === false ? "（不再生效）" : ""));
    if (e.attested) line.appendChild(mk("span", "var-id", " · 说明：输出按此口径生成 — " + (ATTESTED_WORDS[e.attested] || e.attested)));
    if (e.note) line.appendChild(mk("div", "entry-sub", "理由：" + e.note));
    if (e.frozen) line.appendChild(mkButton("查看这一版当时的文字", "btn btn-small", () => openVariableCopy(card.id, e, "frozen")));
    hist.appendChild(line);
  });
  host.appendChild(hist);
}
// -- end of the 变量 view --------------------------------------------------------

// -- Notices above the views ------------------------------------------------------
// One place for what the record needs from the researcher, rebuilt from
// state.summary on every summary refresh -- but only when what it shows
// changed (a typed answer or a running migration is never wiped), and
// never while an answer is in flight.

function notice(tone) {
  return mk("div", "notice" + (tone ? " " + tone : ""));
}

function noticeHead(box, title, onClose) {
  if (onClose) {
    const close = mkButton("×", "notice-close", onClose);
    close.setAttribute("aria-label", "关闭");
    close.title = "关闭";
    box.appendChild(close);
  }
  box.appendChild(mk("div", "notice-title", title));
}

function renderNotices(force) {
  const host = document.getElementById("notices");
  if (!host || (state.noticeBusy && !force)) return;
  const s = state.summary;
  const sig = JSON.stringify([
    state.projectMoved, s && s.read_only, s && s.needs_migration, s && s.migration, s && s.records,
    state.migrationInfo && [state.migrationInfo.loading, !!state.migrationInfo.data, !!state.migrationInfo.error],
    state.sessionNotes.length,
  ]);
  if (!force && sig === state.noticeSig) return;
  state.noticeSig = sig;
  host.innerHTML = "";
  if (state.projectMoved) host.appendChild(movedNotice());
  if (s && s.read_only) host.appendChild(readOnlyNotice());
  if (s && s.needs_migration) host.appendChild(migrationNotice(s));
  // An unfinished migration is said once, by its own banner, not again as
  // a ledger that refuses writes (one cause, one message).
  const migrating = s && s.records && s.records.reason === "migrating" && s.needs_migration;
  if (s && s.records && s.records.state && s.records.state !== "ok" && !migrating) host.appendChild(recordsNotice(s.records));
  state.sessionNotes.forEach((n, i) => host.appendChild(sessionNotice(n, i)));
}

async function reopenProject(statusEl, buttons) {
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在重新打开…");
  try {
    await apiPost("/api/project/reopen", {});
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能重新打开", err);
    return;
  }
  state.projectMoved = false;
  await reloadAllViews();
}

function movedNotice() {
  const box = notice("bad");
  noticeHead(box, "项目已移动或已在别处认领，请重新打开");
  box.appendChild(mk("p", null,
    "刚才的操作没有写入任何东西：这个文件夹已经不在原处，或者另一个文件夹已经认领了这个项目。重新打开后，RCE 会重新确认它是谁。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新打开", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

function readOnlyNotice() {
  const box = notice("warn");
  noticeHead(box, "只读打开");
  box.appendChild(mk("p", null, "原位置暂时无法确认，这次只浏览：不认领、不写入任何东西。原位置能访问后，点「重新检查」回答是移动还是复制。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新检查", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

// -- 9.5: a pre-V5 project's migration -------------------------------------------

async function ensureMigrationInfo(summary) {
  const waiting = (summary.migration && summary.migration.waiting) || [];
  if (!waiting.length || (summary.migration && summary.migration.migrating_from)) return;
  const key = state.dataEpoch + ":" + waiting.map((w) => w.key).join(",");
  if (state.migrationInfo && state.migrationInfo.key === key) return;
  const info = { key: key, loading: true, data: null, error: null };
  state.migrationInfo = info;
  renderNotices();
  try {
    info.data = await apiGet("/api/migration");
  } catch (err) {
    info.error = err;
  }
  info.loading = false;
  if (state.migrationInfo === info) renderNotices();
}

function previewLines(p) {
  const lines = [];
  if (p.error) {
    lines.push("这个旧索引读不出来（" + p.db_path + "）");
    return lines;
  }
  if (p.recorded_path) {
    lines.push("旧索引说它来自：" + p.recorded_path +
      (p.path_exists === false ? "（这个位置现在没有文件夹）" : p.path_exists ? "（这个位置还在）" : ""));
  } else {
    lines.push("旧索引没有记下它来自哪里（" + p.db_path + "）");
  }
  lines.push("里面有 " + p.confirmed + " 条确认、" + p.rejected + " 条否决，" + p.arranged_views + " 个摆放过的画布视图" +
    (p.mapping_links ? "；另有 " + p.mapping_links + " 条手工连线，它们本来就在 mappings.toml 里" : ""));
  if (p.judged) {
    lines.push(p.judged + " 条里有 " + p.produced + " 条的两端能在这个文件夹里扫到");
    if (p.produced / p.judged < 0.5) lines.push("匹配很低：这些判断可能属于另一个项目。");
    if (p.produced < p.judged && p.outside) {
      lines.push("这个文件夹里有 " + p.outside + " 个脚本读写的是文件夹以外的绝对路径——项目被移动或复制过时，匹配就会这样偏低。");
    }
  }
  if (p.scan_error) lines.push("扫描这个文件夹时出了错，能扫到的数目可能偏低。");
  return lines;
}

function migrationNotice(s) {
  const box = notice("warn");
  const waiting = (s.migration && s.migration.waiting) || [];
  const resuming = s.migration && s.migration.migrating_from;
  noticeHead(box, resuming ? "上次迁移没有完成" : waiting.length ? "旧版本的判断在等待迁移" : "这个项目来自旧版本");
  box.appendChild(mk("p", null, "迁移后才能记录判断。" + (resuming || waiting.length
    ? "迁移会把旧索引里的确认、否决和画布位置写进项目自己的 .rce/，核对数目对上之后才把旧索引移到一旁（不删除）。"
    : "没有找到等待迁移的旧索引；在终端运行 rce migrate --list 可以查看本机所有旧索引。")));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  if (resuming) {
    box.appendChild(mk("div", "fact-line", "旧索引：" + resuming));
    const b = mkButton("继续迁移", "btn btn-primary", () => runMigration("migrate", status, [b]));
    actions.appendChild(b);
  } else if (waiting.length) {
    const info = state.migrationInfo;
    if (!info || info.loading) {
      box.appendChild(mk("p", null, "正在核对旧索引与这个文件夹…"));
    } else if (info.error) {
      const e = mk("div", "notice-status err");
      renderBlockingError(e, "没能读出等待迁移的旧索引", info.error);
      box.appendChild(e);
    } else {
      (info.data.previews || []).forEach((p) => {
        const list = mk("ul", "entry-list");
        previewLines(p).forEach((l) => list.appendChild(mk("li", null, l)));
        box.appendChild(list);
      });
      const yes = mkButton("迁移这些记录", "btn btn-primary", () => runMigration("migrate", status, [yes, no]));
      const no = mkButton("这不是这个项目的", "btn", () => runMigration("not_mine", status, [yes, no]));
      actions.append(yes, no);
    }
  }
  box.append(actions, status);
  return box;
}

function tallyLines(t) {
  if (!t) return [];
  const lines = ["旧索引里有 " + t.m + " 条确认或否决：" + t.applied + " 条已生效，" + t.review_other + " 条待复核" +
    (t.contradicted ? "（其中 " + t.contradicted + " 条记录冲突）" : "") + "，" + t.review_not_produced + " 条机器不再得出、同样待复核"];
  if (t.skipped_mappings) lines.push("手工连线 " + t.skipped_mappings + " 条本来就在 mappings.toml 里，没有重复迁移");
  if (t.stale_mirror && t.stale_mirror.length) lines.push("旧索引里有 " + t.stale_mirror.length + " 处和你的文件不一致，以文件为准");
  if (t.review_other + t.review_not_produced > 0) lines.push("待复核的可以点页面顶部的「待复核」逐条查看。");
  return lines;
}

function migrationResultNote(res) {
  if (res.declined) {
    return { tone: "", title: "已记下：这些旧记录不属于这个项目", lines: ["旧索引保持原样，没有被删除；这个文件夹以后不再提示它们。"] };
  }
  const results = res.results || [];
  const last = results[results.length - 1] || {};
  if (res.ok) {
    const lines = [];
    results.forEach((r) => {
      tallyLines(r.tally).forEach((l) => lines.push(l));
      if (r.retired_to) lines.push("旧索引已移到：" + r.retired_to);
    });
    return { tone: "", title: "迁移完成", lines: lines };
  }
  if (last.holders && last.holders.length) {
    // 8.8: the engine's own description of each holder is English -- it
    // lives behind 「详情」, never in the notice's body.
    return {
      tone: "bad", title: "记录已经写好，但旧索引还被占用，没有移走",
      lines: last.holders.map((h) => "占用旧索引的进程" + (h.pid != null ? " " + h.pid : "") + "（它是什么，见「详情」）")
        .concat(["请先退出 RCE 与 MCP 服务（占用它的那一个），然后点「继续迁移」。"]),
      detail: last.holders.map((h) => (h.pid != null ? h.pid + ": " : "") + (h.what || ""))
        .concat([last.stopped]).filter(Boolean).join("\n"),
    };
  }
  return {
    tone: "bad", title: "核对没有对上，迁移停了下来",
    lines: ["什么都没有移走，旧索引继续使用；再试一次不会重复写入。"].concat(tallyLines(last.tally)),
    detail: [last.stopped].concat((last.tally && last.tally.unmatched) || []).filter(Boolean).join("\n"),
  };
}

async function runMigration(answer, statusEl, buttons) {
  if (answer === "not_mine" && !window.confirm(
    "确定这些旧记录不属于这个项目？\n\n旧索引保持原样，不会被删除；这个文件夹以后不再提示它们。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", answer === "migrate" ? "正在迁移…（会重新扫描整个项目，可能要一会儿）" : "正在记下…");
  let res;
  try {
    res = await apiPost("/api/migration/run", { answer: answer });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", answer === "migrate" ? "迁移没有完成" : "没能记下", err);
    return;
  }
  state.noticeBusy = false;
  // The latest outcome replaces an earlier one (a refused retire, then 继续迁移).
  state.sessionNotes = state.sessionNotes.filter((n) => n.kind !== "migration");
  state.sessionNotes.push(Object.assign(migrationResultNote(res), { kind: "migration" }));
  await reloadAllViews();
}

// -- 9.3: a ledger RCE cannot trust, and the shrink question -----------------------

const RECORD_TROUBLE = {
  missing: ["判断记录文件不见了", "项目身份文件记着这个项目有判断记录（.rce/judgements.toml），但文件不在。RCE 不会新建一个空文件来代替它；请从备份或同步服务里把它找回来。"],
  dataless: ["判断记录文件还在云端", "系统正在下载 .rce/judgements.toml，下载完成后会自动恢复。"],
  unreadable: ["判断记录文件无法读取", ".rce/judgements.toml 读不出来。"],
  invalid: ["判断记录文件有一处无法解析", ".rce/judgements.toml 里有一处读不懂（常见于手工编辑），请修正它。"],
  empty_but_expected: ["判断记录文件是空的", "这个项目记录过判断，但 .rce/judgements.toml 现在没有任何条目。"],
  conflict_copy: ["判断记录文件旁有同步冲突副本", "同步服务在 .rce/ 里留下了冲突副本。RCE 不会自行合并：请留下正确的那一份，把另一份移走。"],
  no_identity: ["项目身份文件无法读取", "没有可读的项目身份，判断无处记录。"],
  migrating: ["项目正在迁移", "迁移完成之前不能记录判断。"],
};

function recordsNotice(rec) {
  if (rec.state === "shrunk") return shrinkNotice(rec);
  const box = notice("bad");
  const trouble = RECORD_TROUBLE[rec.reason] || [rec.message || "判断记录文件当前无法读取，请先恢复它", ""];
  noticeHead(box, trouble[0]);
  if (trouble[1]) box.appendChild(mk("p", null, trouble[1]));
  if (rec.reason === "invalid" && rec.line) box.appendChild(mk("div", "fact-line", "出错的位置：第 " + rec.line + " 行"));
  if (rec.conflict_copies && rec.conflict_copies.length) box.appendChild(mk("div", "fact-line", "冲突副本：" + rec.conflict_copies.join("、")));
  box.appendChild(mk("p", null, "修好之前，确认、否决、撤回都不会被记录；图谱保留着它原来知道的判断状态，没有因此改变。"));
  if (rec.detail) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", rec.detail);
    box.appendChild(d);
  }
  return box;
}

function shrinkNotice(rec) {
  const missing = rec.missing || [];
  const n = missing.length;
  const box = notice("warn");
  noticeHead(box, "记录文件比图谱少了 " + n + " 条判断");

  const list = mk("ul", "entry-list");

  ];

async function answerShrink(answer, ids, n, statusEl, buttons) {
  if (answer === "file" && !window.confirm("以文件为准？\n\n图谱会忘掉这 " + n + " 条判断，以 .rce/judgements.toml 现在的内容为准。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  try {
    await apiPost("/api/records/answer", { file: "judgements", answer: answer, missing: ids });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个回答", err);
    return;
  }
  state.noticeBusy = false;
  state.sessionNotes.push(answer === "file"
    ? { tone: "", title: "已以文件为准", lines: ["图谱现在只按 .rce/judgements.toml 里的判断显示。"] }
    : { tone: "", title: "已把缺少的 " + n + " 条判断补回文件", lines: ["它们追加在 .rce/judgements.toml 末尾，标为补回。"] });
  await refreshCurrentView();
  renderNotices(true);
}

function sessionNotice(note, index) {

// -- 9.4: the identity questions, asked where the view would have been ------------

const SITUATION_TITLES = {
  copy: "这个文件夹是一个项目的副本",

  lost_id: "项目身份文件不见了",
  unreadable_id: "项目身份文件无法读取",

  claim: "这里才是原项目：项目的索引改为跟随这个文件夹，并按它重新建立；另一个文件夹下次打开时会被问同样的问题。",
  other: "这个文件夹只是收到了别处复制来的 .rce/：给它新的身份；复制来的判断、画布位置和变量卡移到 .rce/backups/，不再算作它的记录。",
  readonly: "先只浏览，不认领、不写入任何东西；原位置能访问后再来回答。",
  restore: "用 .rce/backups/ 里的快照把项目身份文件放回去，项目恢复原来的身份。",
  adopt: "给这个文件夹新的项目身份，.rce/ 里现有的判断、画布位置和变量卡全部保留，并据此重新建立索引。",
};

const ANSWER_CONFIRM = {
  claim: "这里才是原项目？\n\n项目的索引会按这个文件夹重新建立；另一个文件夹下次打开时会被问同样的问题。",
  other: "这是另一个项目？\n\n复制来的判断、画布位置和变量卡会被移到 .rce/backups/（不删除），这个文件夹得到新的身份。",
};

function resolveNote(answer, res) {
  const lines = [];
  if (answer === "fork") lines.push("新的项目身份：" + res.project_id + "。从现在起，这里的判断不会出现在原项目里。");
  if (answer === "claim") lines.push("项目的索引已按这个文件夹重新建立。");
  if (answer === "adopt") lines.push("新的项目身份：" + res.project_id + "，原有记录都保留了。");
  if (answer === "restore" && res.restored_from) lines.push("项目身份文件已从备份恢复：" + res.restored_from);
  if (res.git_tracked_identity) lines.push("注意：.rce/project.toml 由 git 跟踪；提交它，会把新的身份带进它被合并到的分支。");
  if (res.moved_aside && res.moved_aside.length) lines.push("复制来的记录已移进 .rce/backups/（没有删除）：" + res.moved_aside.join("、"));
  const titles = {
    fork: "已作为独立分支继续", claim: "已认领：这里是原项目", other: "已作为另一个项目打开",
    restore: "项目身份已恢复", adopt: "已沿用这些记录，建立新身份",
  };
  if (!titles[answer]) return null;
  if (res.build_error) lines.push("重新建立索引时出了错，下次打开会再试。");
  return { tone: res.build_error ? "bad" : "", title: titles[answer], lines: lines, detail: res.build_error || null };
}

async function answerSituation(answer, statusEl, buttons) {
  if (ANSWER_CONFIRM[answer] && !window.confirm(ANSWER_CONFIRM[answer])) return;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  let res;
  try {
    res = await apiPost("/api/project/resolve", { answer: answer });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个选择", err);
    return;
  }
  const note = resolveNote(answer, res);
  if (note) state.sessionNotes.push(note);
  await reloadAllViews();
}

async function locateProject(projectId, path, statusEl, buttons) {
  if (!path || path.charAt(0) !== "/") {
    setStatus(statusEl, "err", "请填写文件夹的完整路径（以 / 开头）");
    return;
  }
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在确认这个文件夹是不是这个项目…");
  try {
    await apiPost("/api/projects/locate", { id: projectId, path: path });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能使用这个位置", err);
    return;
  }
  await reloadAllViews();
}

// `opts` (DESIGN.md 10.2, the add dialog): the same question for a folder
// being added -- `answer(answer, statusEl, buttons)` and `recheck()` in place
// of the served project's resolve / reopen, and no talk of switching away.
function renderSituation(err, opts) {
  const o = opts || {};
  const answerWith = o.answer || answerSituation;
  const sit = err.situation;
  const box = mk("div", "notice bad state-note");
  noticeHead(box, SITUATION_TITLES[sit.situation] || PROJECT_STATES.project_blocked.title);
  if (sit.message && sit.message !== SITUATION_TITLES[sit.situation]) box.appendChild(mk("p", null, sit.message));
  const fact = (label, value) => { if (value) box.appendChild(mk("div", "fact-line", label + value)); };
  const status = mk("div", "notice-status");
  const buttons = [];
  if (sit.situation === "missing") {
    fact("项目列表里记的位置：", sit.path);
    if (sit.reason === "path_holds_another_project") {
      box.appendChild(mk("p", null, "这个位置现在放着另一个项目（或一个没有项目身份的文件夹），不会被当成它。"));
    }
    if (!sit.project_id) {
      box.appendChild(mk("p", null, "这个项目来自旧版本，没有项目身份，无法按身份找回；请在新位置运行 rce serve。"));
    } else {
      box.appendChild(mk("p", null, "如果你把它移到了别处，在下面指明新位置：RCE 只认带着这个项目身份的文件夹，不会自己去找。"));
      box.appendChild(mk("div", "notice-title", "选择新位置…"));
      const row = mk("div", "locate-row");
      const input = mk("input", "form-input");
      input.id = "locate-path";
      input.placeholder = "新位置的完整路径，例如 /Users/你/Documents/项目文件夹";
      const use = mkButton("使用这个位置", "btn", () => locateProject(sit.project_id, input.value.trim(), status, buttons));
      buttons.push(use);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") use.click(); });
      row.append(input, use);
      if (shellCan("choose-folder")) {
        const pick = mkButton("选择文件夹…", "btn", async () => {
          const chosen = await chooseFolder("locate");
          if (!chosen) return; // cancelled in the native panel
          input.value = chosen;
          locateProject(sit.project_id, chosen, status, buttons);
        });
        buttons.push(pick);
        row.appendChild(pick);
      }
      box.appendChild(row);
    }
  } else {
    fact("这个文件夹：", sit.path);
    if (sit.situation === "copy" || sit.situation === "cannot_check") fact("项目原来的位置：", sit.home);
    if (sit.situation === "lost_id") {
      if (Array.isArray(sit.records) && sit.records.length) fact("在 .rce/ 里找到的记录：", sit.records.join("、"));
      if (sit.snapshot) fact("备份里的项目身份：", sit.snapshot.file + (sit.snapshot.created ? "（创建于 " + sit.snapshot.created + "）" : ""));
    }
    if (sit.situation === "unreadable_id") {
      if (sit.line) fact("出错的位置：", "第 " + sit.line + " 行");
      if (Array.isArray(sit.conflict_copies) && sit.conflict_copies.length) fact("旁边的同步冲突副本：", sit.conflict_copies.join("、"));
      box.appendChild(mk("p", null, "修好 .rce/project.toml（或等它从云端取回、移走冲突副本）之后，点「重新检查」。"));
    }
    box.appendChild(mk("p", null, ((sit.answers || []).length ? "选择之前" : "修好之前") +
      "，RCE 不会写入任何东西，包括项目列表。" + (o.inDialog ? "" : "也可以在上方切换到别的项目。")));
    (sit.answers || []).forEach((answer) => {
      const label = (sit.answer_labels && sit.answer_labels[answer]) || answer;
      const row = mk("div", "answer");
      const b = mkButton(label, "btn", () => answerWith(answer, status, buttons));
      buttons.push(b);
      row.append(b, mk("span", "answer-help", ANSWER_HELP[answer] || ""));
      box.appendChild(row);
    });
    if (!(sit.answers || []).length) {
      const actions = mk("div", "notice-actions");
      const again = mkButton("重新检查", "btn", () => (o.recheck ? o.recheck() : reopenProject(status, buttons)));
      buttons.push(again);
      actions.appendChild(again);
      box.appendChild(actions);
    }
  }
  box.appendChild(status);
  const raw = sit.detail || err.message;
  if (raw && !o.inDialog) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", raw);
    box.appendChild(d);
  }
  return box;
}

// 「选择文件夹…」 through the native shell (8.9's bridge, task V5 phase 9
// implements the Swift side): page -> native {type: "choose-folder",
// request, purpose}; native -> page window.RCE.folderChosen(request, path |
// null). Offered only when the shell says it can (window.RCEShellFeatures),
// so a shell without it -- or a plain browser -- simply has the path field.
// `purpose` (DESIGN.md 10.7: "add" | "locate") changes only the panel's
// message; it is sent only to a shell that says it takes it
// ("choose-folder-purpose"), since a shell built before V6 ignores any
// message with a third key -- and its panel then reads as 「选择新位置」.
const folderRequests = new Map();

function shellCan(feature) {
  try {
    return Array.isArray(window.RCEShellFeatures) && window.RCEShellFeatures.indexOf(feature) >= 0 &&
      !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce);
  } catch (err) {
    return false;
  }
}

const FOLDER_PURPOSES = ["add", "locate"];

function chooseFolder(purpose) {
  return new Promise((resolve) => {
    const request = "folder-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    folderRequests.set(request, resolve);
    const message = { type: "choose-folder", request: request };
    if (FOLDER_PURPOSES.indexOf(purpose) >= 0 && shellCan("choose-folder-purpose")) message.purpose = purpose;
    try {
      window.webkit.messageHandlers.rce.postMessage(message);
    } catch (err) {
      folderRequests.delete(request);
      resolve(null);
    }
  });
}

function folderChosen(request, path) {
  const resolve = folderRequests.get(String(request));
  if (!resolve) return false;
  folderRequests.delete(String(request));
  resolve(typeof path === "string" && path ? path : null);
  return true;
}

// -- Add-project wording (pure; DESIGN.md 10.2, 10.3) ---------------------------
// What the add dialog and the scan chip say, as functions of the engine's
// payloads only -- tests/test_v6_page.py loads this block into node. The
// preview's numbers are the engine's (the scan's own inventory); this only
// words them.
const ADD_GROUP_WORDS = [
  ["scripts", "脚本（.py、.R、.Rmd）"],
  ["data", "数据文件"],
  ["drafts", "文稿（.md、.tex、.bib）"],
  ["images", "图片"],
];
const ADD_LARGE_THRESHOLD = 5000; // rce.addproject.LARGE_THRESHOLD
const ADD_ENTRY_CAP = 100000; // rce.addproject.ENTRY_CAP

function groupedNumber(n) {
  return String(Math.max(0, Math.floor(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// {head, items: [[words, n]], notes: [{text, tone}]} for a preview.
function addPreviewText(p) {
  const out = { head: "", items: [], notes: [] };
  if (!p || typeof p !== "object") return out;
  const counts = p.counts || {};
  const git = p.source === "git" && p.git ? p.git : null;
  if (git && git.tracked == null) {
    out.head = "这是一个 git 仓库，但 RCE 没能向 git 问出它跟踪哪些文件；照现在这样，扫描会在这一步停下。";
  } else if (git) {
    out.head = "这是一个 git 仓库：RCE 只读取 git 跟踪的文件，共 " + groupedNumber(git.tracked) + " 个。其中要扫描的有：";
  } else {
    out.head = "RCE 会读取这个文件夹里的这些文件：";
  }
  ADD_GROUP_WORDS.forEach(([key, words]) => out.items.push([words, groupedNumber(counts[key])]));
  out.items.push(["共计要扫描", groupedNumber(p.to_scan)]);
  if (counts.other > 0) {
    out.notes.push({ text: "另有 " + groupedNumber(counts.other) + " 个文件不属于这几类，RCE 不读它们。", tone: "" });
  }
  if (git && git.tracked != null) {
    if (git.untracked > 0) {
      out.notes.push({
        text: "另有 " + (git.untracked_truncated ? "至少 " : "") + groupedNumber(git.untracked) + " 个未被 git 跟踪的文件不会被扫描。",
        tone: "warn",
      });
    } else if (git.error) {
      out.notes.push({ text: "没能数出有多少文件未被 git 跟踪；未被跟踪的文件不会被扫描。", tone: "warn" });
    }
  }
  if (p.dataless > 0 && p.cloud && p.cloud.message) {
    // 11.1: only in the cloud and nobody can download them -- never read.
    out.notes.push({ text: "其中 " + groupedNumber(p.dataless) + " 个文件不会被读取：" + p.cloud.message + "。", tone: "warn" });
  } else if (p.dataless > 0) {
    const where = p.cloud && p.cloud.name ? p.cloud.name : "iCloud";
    out.notes.push({ text: "其中 " + groupedNumber(p.dataless) + " 个文件还在 " + where + " 云端，下载到这台电脑之后才会被读取。", tone: "" });
  }
  if (p.truncated) {
    out.notes.push({ text: "文件太多：数到 " + groupedNumber(ADD_ENTRY_CAP) + " 个就停下了，实际还有更多。", tone: "warn" });
  }
  if (p.large) {
    out.notes.push({
      text: "要扫描的文件超过 " + groupedNumber(ADD_LARGE_THRESHOLD) + " 个，第一次扫描会花一些时间；加入之前会再问你一次。",
      tone: "warn",
    });
  }
  return out;
}

// 10.2: what adding writes, per kind (and, for an RCE project that opens,
// per what opening it does: 9.4's moved / no index on this machine).
function addWritesText(insp) {
  if (!insp) return "";
  if (insp.kind === "new_folder") {
    return "加入会写入：这个文件夹里的 .rce/（项目身份文件 project.toml、它的一份备份 .rce/backups/，和一份简短的 README），以及 ~/.rce 下的索引。文件夹里别的东西都不会被创建或改动。";
  }
  if (insp.kind === "pre_v5" && insp.moves_graph) {
    return "加入会把它写进项目列表；打开时，.rce/ 里的旧图谱 graph.db 会移到 ~/.rce 下（先复制并核对，再删除原文件），并在 .rce/ 里留一份简短的 README 说明去向。迁移旧记录要等你在页面上方确认之后才会进行。";
  }
  if (insp.kind === "pre_v5") {
    return "加入只会把它写进项目列表。迁移旧记录要等你在页面上方确认之后才会进行。";
  }
  if (insp.kind === "rce_project" && insp.can_add) {
    const sit = insp.situation && insp.situation.situation;
    if (sit === "moved") return "加入会把它写进项目列表，并记下项目的新位置（更新 ~/.rce 下的索引和 .rce/README）。";
    if (sit === "no_index") return "这台电脑上还没有它的索引：加入后会按文件夹里的文件和 .rce/ 里的记录在 ~/.rce 下重新建立。";
    return "加入只会把它写进项目列表。";
  }
  return "";
}

function scanProgressText(s) {
  const label = s && s.label ? s.label : "准备中";
  const n = s && Number.isFinite(s.n) ? s.n : 0;
  const m = s && Number.isFinite(s.m) ? s.m : 0;
  return "正在扫描：" + label + "（" + n + "/" + m + "）";
}

function scanDoneText(last) {
  if (!last) return "";
  if (!last.ok) return last.message || "扫描没有完成";
  const n = Array.isArray(last.unreadable_sources) ? last.unreadable_sources.length : 0;
  return n ? "扫描完成，有 " + n + " 个文件暂时读不了" : "扫描完成";
}

// 10.2 / 9.6: which files the scan could not read, by name -- what the
// scan chip's 「详情」 reveals. `unreadable_sources` entries are
// "<extractor>: <file>"; a file read by two extractors is named once.
function unreadableFilesText(sources) {
  const files = [];
  (Array.isArray(sources) ? sources : []).forEach((s) => {
    const text = String(s);
    const at = text.indexOf(": ");
    const file = at >= 0 ? text.slice(at + 2) : text;
    if (file && !files.includes(file)) files.push(file);
  });
  if (!files.length) return "";
  return "读不了的文件：" + files.join("、") + "。它们恢复可读后，下次扫描会读到。";
}
// 11.1: why some of them cannot be read -- only in a synced folder's cloud,
// its client not running -- one sentence per provider.
function cloudNotesText(notes) {
  const out = [];
  (Array.isArray(notes) ? notes : []).forEach((n) => {
    if (n && typeof n.message === "string" && n.message) out.push(n.message + "。");
  });
  return out.length ? " " + out.join(" ") : "";
}

const ADD_REASK_MS = 2000;
let addDialog = null; // {subject, path, inspection, labelEdited, label, confirmLarge, busy, timer}

function openAddDialog() {
  closeProjectMenu(false);
  if (addDialog && addDialog.timer !== null) clearTimeout(addDialog.timer);
  const subject = { kind: "add-project" };
  state.panelSubject = subject;
  addDialog = {
    subject: subject, path: "", inspection: null, labelEdited: false, label: "", confirmLarge: false, busy: false,
    timer: null, why: "", whyErr: null, // why the folder is being looked at again (a refused add), and its error
  };
  panelTitle.textContent = "添加项目";
  panelTitle.title = "";
  panelSubtitle.textContent = "先看一看这个文件夹；你确认之前，什么都不会写入";
  panelBody.innerHTML = "";
  const choose = mk("div", "add-choose");
  const row = mk("div", "locate-row");
  const input = mk("input", "form-input");
  input.id = "add-path";
  input.type = "text";
  input.placeholder = "文件夹的完整路径，例如 ~/Documents/我的研究";
  input.setAttribute("aria-label", "项目文件夹的路径");
  const check = mkButton("检查这个文件夹", "btn", () => inspectForAdd(subject, input.value.trim()));
  check.id = "add-check";
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check.click(); } });
  row.append(input, check);
  if (shellCan("choose-folder")) {
    const pick = mkButton("选择文件夹…", "btn", () => pickFolderForAdd(subject));
    pick.id = "add-pick";
    choose.appendChild(pick);
  }
  choose.appendChild(row);
  const status = mk("div", "notice-status");
  status.id = "add-status";
  const result = mk("div", "add-result");
  result.id = "add-result";
  panelBody.append(choose, status, result);
  openPanel();
  if (shellCan("choose-folder")) pickFolderForAdd(subject);
  else input.focus();
}

function addDialogLive(subject) {
  return !!addDialog && addDialog.subject === subject && state.panelSubject === subject && !panel.classList.contains("hidden");
}

async function pickFolderForAdd(subject) {
  const chosen = await chooseFolder("add");
  if (!chosen || !addDialogLive(subject)) return; // cancelled in the native panel
  const input = document.getElementById("add-path");
  if (input) input.value = chosen;
  inspectForAdd(subject, chosen);
}

function addStatus(cls, text, err) {
  const el = document.getElementById("add-status");
  if (el) setStatus(el, cls, text, err);
}

async function inspectForAdd(subject, path, why, whyErr) {
  if (!addDialogLive(subject)) return;
  if (addDialog.timer !== null) { clearTimeout(addDialog.timer); addDialog.timer = null; }
  if (!path) {
    addStatus("err", "请先填写文件夹的路径（以 / 或 ~ 开头），或选择一个文件夹");
    return;
  }
  if (path !== addDialog.path) { addDialog.labelEdited = false; addDialog.confirmLarge = false; }
  addDialog.path = path;
  addDialog.why = why || "";
  addDialog.whyErr = whyErr || null;
  const check = document.getElementById("add-check");
  if (check) check.disabled = true;
  if (!addDialog.inspection || addDialog.inspection.kind !== "waiting_permission") {
    const result = document.getElementById("add-result");
    if (result) { result.innerHTML = ""; result.appendChild(mk("div", "add-busy", "正在查看这个文件夹……")); }
  }
  addStatus("", "");
  let insp;
  try {
    insp = await apiPost("/api/projects/inspect", { path: path });
  } catch (err) {
    if (!addDialogLive(subject) || addDialog.path !== path) return;
    if (check) check.disabled = false;
    const result = document.getElementById("add-result");
    if (result) result.innerHTML = "";
    addStatus("err", "没能查看这个文件夹", err);
    return;
  }
  if (!addDialogLive(subject) || addDialog.path !== path) return; // closed, or another folder chosen meanwhile
  if (check) check.disabled = false;
  showInspection(subject, insp);
}

function showInspection(subject, insp) {
  const previous = addDialog.inspection;
  if (previous && previous.root !== insp.root) addDialog.labelEdited = false;
  addDialog.inspection = insp;
  if (!addDialog.labelEdited) addDialog.label = insp.label || insp.name || "";
  if (addDialog.why) addStatus("err", addDialog.why, addDialog.whyErr);
  renderInspection(subject);
  if (insp.kind === "waiting_permission") {
    // 10.2 "Waiting for the system": asked again until the listing returns.
    addDialog.timer = setTimeout(() => {
      addDialog.timer = null;
      inspectForAdd(subject, addDialog.path, addDialog.why, addDialog.whyErr);
    }, ADD_REASK_MS);
  }
}

function addLabelField() {
  const field = mk("div", "form-field");
  const label = mk("label", null, "显示名称");
  label.setAttribute("for", "add-label");
  const input = mk("input", "form-input");
  input.id = "add-label";
  input.type = "text";
  input.value = addDialog.label;
  input.addEventListener("input", () => { addDialog.label = input.value; addDialog.labelEdited = true; });
  const help = mk("div", "add-note", "只在 RCE 的项目列表里显示；文件夹本身不会改名。");
  field.append(label, input, help);
  return field;
}

function addPreviewBlock(insp) {
  const box = mk("div");
  const t = addPreviewText(insp.preview);
  box.appendChild(mk("p", "add-note", t.head));
  const list = mk("ul", "add-counts");
  t.items.forEach(([words, n]) => {
    const li = mk("li");
    li.append(mk("span", null, words), mk("span", "n", n + " 个"));
    list.appendChild(li);
  });
  box.appendChild(list);
  t.notes.forEach((note) => box.appendChild(mk("p", "add-note" + (note.tone ? " " + note.tone : ""), note.text)));
  const gitError = insp.preview && insp.preview.git && insp.preview.git.error;
  if (gitError) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "git 的回答", gitError);
    box.appendChild(d);
  }
  return box;
}

function renderInspection(subject) {
  const result = document.getElementById("add-result");
  if (!result) return;
  const insp = addDialog.inspection;
  result.innerHTML = "";
  if (insp.root) result.appendChild(mk("div", "add-root", insp.root));
  const asks = insp.kind === "rce_project" && !insp.can_add && !!insp.situation;
  // A 9.4 question says its own sentence, under its own title (below).
  if (!asks) result.appendChild(mk("div", "add-lead" + (insp.kind === "refused" ? " bad" : ""), insp.message || ""));
  const actions = mk("div", "add-actions");
  const again = () => mkButton("重新选择", "btn", () => chooseAgain(subject));
  const cancel = () => mkButton("取消", "btn", closePanel);

  if (insp.kind === "waiting_permission") {
    result.appendChild(mk("p", "add-note", "RCE 每隔两秒会再问一次，页面不会卡住；也可以换一个文件夹。"));
    actions.append(again(), cancel());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "refused") {
    if (insp.refusal && insp.refusal.detail) {
      const d = mk("div", "notice-status");
      renderBlockingError(d, "", insp.refusal.detail);
      d.firstChild.remove(); // only the 「详情」 toggle: the sentence is the lead above
      result.appendChild(d);
    }
    actions.append(again());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "already_registered") {
    const entry = insp.entry || {};
    if (entry.label) result.appendChild(mk("p", "add-note", "在列表里的名字：" + entry.label));
    const isOpen = !state.noProject && ((state.currentId && entry.id) ? entry.id === state.currentId : entry.path === state.currentPath);
    if (isOpen) {
      result.appendChild(mk("p", "add-note", "它就是现在打开的项目。"));
      actions.append(mkButton("好", "btn", closePanel));
    } else {
      const go = mkButton("切换过去", "btn", async () => {
        go.disabled = true;
        closePanel();
        await switchToProject({ path: entry.path, id: entry.id });
      });
      actions.append(go, cancel());
    }
    result.appendChild(actions);
    return;
  }
  if (asks) {
    // 9.4's question, here: nothing -- the registry included -- is written
    // until one answer is chosen (the answer adds, then resolves).
    result.appendChild(addLabelField());
    result.appendChild(renderSituation({ situation: insp.situation, message: "" }, {
      inDialog: true,
      answer: (answer, statusEl, buttons) => answerForAdd(subject, answer, statusEl, buttons),
      recheck: () => inspectForAdd(subject, addDialog.path),
    }));
    actions.append(again(), cancel());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "new_folder") result.appendChild(addPreviewBlock(insp));
  result.appendChild(addLabelField());
  const writes = addWritesText(insp);
  if (writes) result.appendChild(mk("p", "add-writes", writes));
  const verb = insp.kind === "new_folder" ? "加入并扫描" : "加入列表并打开";
  const go = mkButton(verb, "btn", () => {
    if (insp.kind === "new_folder" && insp.preview && insp.preview.large && !addDialog.confirmLarge) {
      showLargeConfirm(subject, result, actions);
      return;
    }
    writeAdd(subject, [go]);
  });
  go.id = "add-go";
  go.disabled = !insp.can_add;
  actions.append(go, cancel());
  result.appendChild(actions);
}

// 10.2: above 5,000 files to scan, the preview asks a second time.
function showLargeConfirm(subject, result, actions) {
  const insp = addDialog.inspection;
  const box = mk("div", "add-confirm");
  box.appendChild(mk("p", "add-note", "要扫描的文件有 " + groupedNumber(insp.preview.to_scan) + " 个，超过 " +
    groupedNumber(ADD_LARGE_THRESHOLD) + " 个。第一次扫描会花一些时间，扫描期间页面照常可用。确定要加入并扫描吗？"));
  const row = mk("div", "add-actions");
  const yes = mkButton("确定，加入并扫描", "btn", () => { addDialog.confirmLarge = true; writeAdd(subject, [yes, no]); });
  const no = mkButton("先不加入", "btn", () => { box.remove(); actions.classList.remove("hidden"); });
  row.append(yes, no);
  box.appendChild(row);
  actions.classList.add("hidden");
  result.appendChild(box);
  yes.focus();
}

function chooseAgain(subject) {
  if (addDialog.timer !== null) { clearTimeout(addDialog.timer); addDialog.timer = null; }
  addDialog.inspection = null;
  addDialog.path = "";
  addDialog.why = "";
  addDialog.whyErr = null;
  const result = document.getElementById("add-result");
  if (result) result.innerHTML = "";
  addStatus("", "");
  const input = document.getElementById("add-path");
  if (shellCan("choose-folder")) pickFolderForAdd(subject);
  else if (input) { input.focus(); input.select(); }
}

function addBody() {
  return { path: addDialog.path, label: addDialog.label, inspected: addDialog.inspection.inspected };
}

// A refused add: a changed folder (or one now waiting, or now refused) is
// shown as it is now, with the reason above it; anything else (a display
// name the registry will not take) is said in the dialog's status line.
function addRefused(subject, err, buttons) {
  buttons.forEach((b) => { b.disabled = false; });
  if (err.inspection && addDialogLive(subject)) {
    addDialog.why = blockingErrorText("没能加入这个文件夹", err);
    addDialog.whyErr = err;
    addDialog.confirmLarge = false;
    showInspection(subject, err.inspection);
    return;
  }
  addStatus("err", "没能加入这个文件夹", err);
}

async function writeAdd(subject, buttons) {
  if (!addDialogLive(subject) || addDialog.busy) return;
  buttons.forEach((b) => { b.disabled = true; });
  addDialog.busy = true;
  addStatus("", "正在加入…");
  let res;
  try {
    res = await apiPost("/api/projects/add", addBody());
  } catch (err) {
    addDialog.busy = false;
    addRefused(subject, err, buttons);
    return;
  }
  addDialog.busy = false;
  await addDone(res);
}

async function addDone(res) {
  if (res.kind === "already_registered") {
    // Nothing was written and nothing switched: offer the switch.
    if (addDialog && res.inspection) { addDialog.why = ""; addDialog.whyErr = null; showInspection(addDialog.subject, res.inspection); }
    return;
  }
  closePanel();
  state.sessionNotes = [];
  await reloadAllViews({ scanStarted: !!res.scanning });
  if (res.scan_error) {
    const err = new Error(res.scan_error.error || "");
    err.state = res.scan_error.state;
    showHeaderError("已加入项目，但没能开始扫描；可以在项目菜单里「重新扫描这个项目」", err);
  }
  refreshScanStatus();
}

// An answer to the 9.4 question from inside the dialog: the add (which
// serves the folder with its question open, writing nothing), then the
// answer itself -- which, for a folder added from here, registers it under
// the display name chosen above.
async function answerForAdd(subject, answer, statusEl, buttons) {
  if (ANSWER_CONFIRM[answer] && !window.confirm(ANSWER_CONFIRM[answer])) return;
  if (!addDialogLive(subject) || addDialog.busy) return;
  buttons.forEach((b) => { b.disabled = true; });
  addDialog.busy = true;
  setStatus(statusEl, "", "正在处理…");
  let added;
  try {
    added = await apiPost("/api/projects/add", addBody());
  } catch (err) {
    addDialog.busy = false;
    addRefused(subject, err, buttons);
    return;
  }
  if (!added.blocked) { // the question no longer stood: added and opened as it is
    addDialog.busy = false;
    await addDone(added);
    return;
  }
  let res;
  try {
    res = await apiPost("/api/project/resolve", { answer: answer });
  } catch (err) {
    addDialog.busy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个选择", err);
    return;
  }
  addDialog.busy = false;
  closePanel();
  const note = resolveNote(answer, res);
  state.sessionNotes = note ? [note] : [];
  await reloadAllViews();
}

// -- 停止服务 (task V3 phase 4) ----------------------------------------------
// The footer button POSTs /api/shutdown behind an explicit Chinese confirm.
// Success replaces the whole page with a plain stopped state and stops the
// generation poll -- the server is gone, and polling it would only spray
// connection errors into the console. Failure re-enables the button and
// says so in the header line (same spot a failed project switch reports),
// leaving the page fully usable.

function renderStoppedState() {
  if (pollTimer !== null) clearInterval(pollTimer);
  closePanel();
  document.getElementById("app").innerHTML =
    '<main id="main"><div class="stopped-note">' +
    "<h2>服务已停止</h2>" +
    "<p>本地服务已经关闭，可以关闭此页。</p>" +
    "<p>下次要查看时，双击 RCE.app，或在终端运行 <code>rce serve</code>。</p>" +
    "</div></main>";
}

document.getElementById("shutdown-btn").addEventListener("click", async () => {
  if (!window.confirm("确定要停止本地服务吗？停止后这个页面将无法继续使用。")) return;
  const btn = document.getElementById("shutdown-btn");
  btn.disabled = true;
  try {
    await apiPost("/api/shutdown", {});
  } catch (err) {
    btn.disabled = false;
    showHeaderError("停止服务失败", err);
    return;
  }
  renderStoppedState();
});

// -- Native shell bridge (DESIGN.md section 8.9, task V4 phase 3) ----------
// RCE.app is a native window around this same page. Its menus reach the
// page through ONE entry point, window.RCE.command(name), which the shell
// calls as the fixed string `window.RCE && RCE.command('<name>')` with a
// name from its own compiled-in whitelist; this table is the page's side
// of that whitelist. Anything not in it returns false and does nothing.
// In a plain browser nobody calls it and nothing is lost: every command
// here is something the page can already do from its own controls.
//
// The two Finder commands go through the existing POST /api/open, never a
// new endpoint: the project root is the path "." (which the server's
// resolve-then-relative_to check maps to the served root itself), and the
// map file is the one the server's own /api/summary echoes from
// .rce/attempts.toml -- fetched fresh at command time so a project switch
// can never open the previous project's map. The server confines both
// exactly as it confines every other /api/open path.
//
// The page reports the current project's label to the shell (window
// title 「RCE — <label>」) over webkit.messageHandlers.rce -- the only
// message shape the shell accepts -- after every loadProjects(), i.e. on
// load and on every project switch. Absent bridge: a silent no-op.

const TEXT_ZOOM_STEPS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
let textZoomIndex = TEXT_ZOOM_STEPS.indexOf(1);

// 放大/缩小/实际大小: the canvas zooms its own camera; the two reading
// views scale their own sections (never the canvas section, whose pointer
// geometry must stay in unscaled CSS pixels).
function shellZoom(step) {
  if (currentView === "canvas") {
    if (step > 0) RCECanvas.zoomIn();
    else if (step < 0) RCECanvas.zoomOut();
    else RCECanvas.zoomReset();
    return;
  }
  textZoomIndex = step === 0 ? TEXT_ZOOM_STEPS.indexOf(1)
    : Math.max(0, Math.min(TEXT_ZOOM_STEPS.length - 1, textZoomIndex + step));
  const z = TEXT_ZOOM_STEPS[textZoomIndex];
  views.tree.style.zoom = z === 1 ? "" : String(z);
  views.lineage.style.zoom = z === 1 ? "" : String(z);
}

// A failed Finder command reports in the header line, the same spot a
// failed project switch uses; the engine's own text sits behind 「详情」.
function shellReport(message, err) {
  showHeaderError(message, err);
}

async function shellOpen(path, reveal, failure) {
  try {
    await apiPost("/api/open", { path: path, reveal: reveal });
  } catch (err) {
    shellReport(failure, err);
  }
}

async function shellOpenMap() {
  let config = null;
  try {
    config = (await apiGet("/api/summary")).attempts_config;
  } catch (err) {
    shellReport("无法打开项目地图", err);
    return;
  }
  if (!config || !config.file) {
    shellReport("这个项目还没有配置项目地图（.rce/attempts.toml）", null);
    return;
  }
  await shellOpen(config.file, false, "无法打开项目地图");
}

const SHELL_COMMANDS = {
  "tree": () => activateView("tree"),
  "lineage": () => activateView("lineage"),
  "canvas": () => activateView("canvas"),
  "variables": () => activateView("variables"),
  "new-attempt": () => openAttemptForm("append"),
  // 文件 → 「添加项目… ⌘O」 (DESIGN.md 10.1, 10.7).
  "add-project": () => openAddDialog(),
  "reload": () => window.location.reload(),
  "zoom-in": () => shellZoom(1),
  "zoom-out": () => shellZoom(-1),
  "zoom-reset": () => shellZoom(0),
  // 适应全部 is a canvas notion; from another view it brings the canvas up
  // first rather than silently doing nothing -- and when that starts the
  // canvas's first load, fits once the cards are there (fitting the empty
  // canvas was lost: entering the view then restored its saved viewport).
  "fit": () => {
    const loading = activateView("canvas");
    if (loading) loading.then(() => { if (currentView === "canvas" && views.canvas.dataset.loaded) RCECanvas.fitAll(); });
    else RCECanvas.fitAll();
  },
  "reveal-project": () => shellOpen(".", true, "无法在 Finder 中显示项目"),
  "open-map": () => shellOpenMap(),
};

window.RCE = Object.freeze({
  // The native shell's answer to {type: "choose-folder"} (see chooseFolder).
  folderChosen(request, path) {
    return folderChosen(request, path);
  },
  command(name) {
    if (typeof name !== "string" || !Object.prototype.hasOwnProperty.call(SHELL_COMMANDS, name)) return false;
    // After 停止服务 the page is a static note; a menu click must not throw.
    if (!document.getElementById("view-tree")) return false;
    try {
      SHELL_COMMANDS[name]();
    } catch (err) {
      return false;
    }
    return true;
  },
});

function postShellTitle() {
  try {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce;
    if (bridge) bridge.postMessage({ type: "title", text: String(state.projectLabel || "") });
  } catch (err) {
    /* no shell, or the shell went away: the page works the same */
  }
}

// -- Init -------------------------------------------------------------------
// loadProjects() first (awaited): it fills state.projectLabel, which the
// summary line prefers over a raw-path basename. The views themselves never
// wait on either -- activateView kicks off its own fetch. The generation
// poll (task V3 phase 2) starts alongside: syncGeneration() records the
// server's current generation as this page's starting point (so the first
// interval tick compares against reality, not null), then the interval
// keeps watching for the server-side watcher's bumps.

(async () => {
  await loadProjects();
  loadProjectSummary();
  activateView(storedView() || "tree");
  syncGeneration();
  pollTimer = setInterval(pollGeneration, REFRESH_POLL_MS);
})();
</script>
