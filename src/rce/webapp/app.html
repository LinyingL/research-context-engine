const panel = document.getElementById("panel");
const panelBackdrop = document.getElementById("panel-backdrop");
const panelTitle = document.getElementById("panel-title");
const panelSubtitle = document.getElementById("panel-subtitle");
const panelBody = document.getElementById("panel-body");

function openPanel() {
  panel.classList.remove("hidden");
  panelBackdrop.classList.remove("hidden");
  panel.setAttribute("aria-hidden", "false");
}

function closePanel() {
  panel.classList.add("hidden");
  panelBackdrop.classList.add("hidden");
  panel.setAttribute("aria-hidden", "true");
  state.panelSubject = null;
}

document.getElementById("panel-close").addEventListener("click", closePanel);
panelBackdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !panel.classList.contains("hidden")) closePanel();
});

const FILE_TYPE_RULES = [
  [/\.(py|r|rmd|jl|ipynb|sh)$/i, "脚本"],
  [/\.(csv|tsv|json|parquet|dta|rds|rda|pkl|feather|h5|hdf5)$/i, "数据集"],
  [/\.(png|jpe?g|pdf|svg|eps|gif|tiff?)$/i, "图表"],
  [/\.(md|txt|tex|bib|rst)$/i, "文本 / 文档"],
  [/\.(toml|yaml|yml|ini|cfg)$/i, "配置"],
];

function classifyFileType(path, hint) {
  if (hint === "script") return "脚本";
  for (const [pattern, label] of FILE_TYPE_RULES) if (pattern.test(path)) return label;
  return "文件";
}

function codePreview(content) {
  const wrap = document.createElement("div");
  wrap.className = "code-preview";
  const table = document.createElement("table");
  table.className = "code-table";
  const lines = content.split("\n");
  table.innerHTML = lines.map((line, i) =>
    "<tr><td class=\"ln\">" + (i + 1) + "</td><td class=\"src\">" + escapeHtml(line) + "</td></tr>"
  ).join("");
  wrap.appendChild(table);
  return wrap;
}

async function runOpenAction(path, reveal, statusEl) {
  statusEl.className = "panel-status";
  statusEl.textContent = "处理中…";
  try {
    const result = await apiPost("/api/open", { path, reveal });
    statusEl.className = "panel-status ok";
    statusEl.textContent = (reveal ? "已在 Finder 中显示：" : "已打开：") + result.opened;
    statusEl.title = "";
  } catch (err) {
    statusEl.className = "panel-status err";
    // 8.8 "Errors": Chinese framing up front, the engine's text behind 「详情」.
    renderBlockingError(statusEl, reveal ? "无法在 Finder 中显示" : "无法打开", err);
  }
}

function buildFileActions(path, statusEl) {
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  const openBtn = document.createElement("button");
  openBtn.className = "btn";
  openBtn.type = "button";
  openBtn.textContent = "打开";
  const revealBtn = document.createElement("button");
  revealBtn.className = "btn";
  revealBtn.type = "button";
  revealBtn.textContent = "在 Finder 中显示";
  openBtn.addEventListener("click", () => runOpenAction(path, false, statusEl));
  revealBtn.addEventListener("click", () => runOpenAction(path, true, statusEl));
  actions.append(openBtn, revealBtn);
  return actions;
}

async function openFilePanel(path, hint) {
  state.panelSubject = { kind: "file", path: path };
  panelTitle.textContent = path;
  panelTitle.title = "";
  panelSubtitle.textContent = classifyFileType(path, hint);
  panelBody.innerHTML = "";
  const status = document.createElement("div");
  status.className = "panel-status";
  panelBody.appendChild(buildFileActions(path, status));
  panelBody.appendChild(status);
  const contentHost = document.createElement("div");
  contentHost.innerHTML = '<p class="empty-note">预览载入中…</p>';
  panelBody.appendChild(contentHost);
  openPanel();

  let data;
  try {
    data = await apiGet("/api/file?path=" + encodeURIComponent(path));
  } catch (err) {
    renderErrorBox(contentHost, err);
    return;
  }
  contentHost.innerHTML = "";
  if (data.truncated) {
    const note = document.createElement("div");
    note.className = "truncated-note";
    note.textContent = "只显示了开头 " + data.content.length + " 个字符，文件共 " + data.size + " 字节（已截断）。";
    contentHost.appendChild(note);
  }
  contentHost.appendChild(codePreview(data.content));
}

function kvRow(table, label, value) {
  const tr = document.createElement("tr");
  const th = document.createElement("th");
  th.textContent = label;
  const td = document.createElement("td");
  if (typeof value === "string") td.textContent = value;
  else td.appendChild(value);
  tr.append(th, td);
  table.appendChild(tr);
}

function openAttemptPanel(id) {
  const attempt = state.attemptsById.get(id);
  state.panelSubject = { kind: "attempt", id: id };
  // The graph id ("attempt:<file>#14") is an engine key, not copy: the
  // title reads like the tree row, the raw id stays on the hover.
  const shownNumber = attempt && attempt.attrs && attempt.attrs.number;
  panelTitle.textContent = shownNumber ? "尝试 #" + String(shownNumber).replace(/^#/, "") : id;
  panelTitle.title = id;
  panelSubtitle.textContent = "尝试记录";
  panelBody.innerHTML = "";
  if (!attempt) {
    renderErrorBox(
      panelBody,
      new Error("没有载入 " + id + " 的详情——请重新打开「决策树」再试。"),
    );
    openPanel();
    return;
  }
  const attrs = attempt.attrs || {};

  // 编辑 (task V3 phase 3): same form as "＋ 新增尝试", pre-filled for this
  // row -- writes go into the source map file via preview + confirm.
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  const editBtn = document.createElement("button");
  editBtn.className = "btn";
  editBtn.type = "button";
  editBtn.textContent = "编辑";
  editBtn.addEventListener("click", () => openAttemptForm("update", id));
  actions.appendChild(editBtn);
  panelBody.appendChild(actions);

  const table = document.createElement("table");
  table.className = "kv-table";
  kvRow(table, "#", attrs.number || "");
  kvRow(table, "日期", attrs.date || "");
  kvRow(table, "路径 / 描述", attrs.description || "");
  kvRow(table, "变量", attrs.variables || "");
  kvRow(table, "结论", attempt.verdict || "（无）");
  kvRow(table, "结果", attempt.result || "（无）");

  const sourceSpan = document.createElement("span");
  if (attrs.source_file) {
    sourceSpan.className = "clickable";
    sourceSpan.textContent = attrs.source_file + (attrs.source_line ? ":" + attrs.source_line : "");
    sourceSpan.addEventListener("click", () => openFilePanel(attrs.source_file));
  } else {
    sourceSpan.textContent = "（未知）";
  }
  kvRow(table, "出处", sourceSpan);
  kvRow(table, "步骤脚本", (attrs.step_files && attrs.step_files.length) ? attrs.step_files.join(", ") : "（无）");
  panelBody.appendChild(table);

  if (attrs.step_files_broken && attrs.step_files_broken.length) {
    const warn = document.createElement("div");
    warn.className = "step-broken";
    warn.textContent = "找不到的步骤脚本：" + attrs.step_files_broken.join(", ");
    panelBody.appendChild(warn);
  }
  openPanel();
}

// -- Attempt edit form (task V3 phase 3) ------------------------------------
// One form for both "＋ 新增尝试" (append) and an attempt panel's 编辑
// (update), rendered into the same slide-out panel. Two-step by design:
// submit only ever calls POST /api/attempts/preview (a pure dry run) and
// shows the old/new row; the write happens exclusively on the explicit
// confirm click. Update mode submits ONLY dirty fields -- prefills come
// from the parser's *cleaned* values, so re-writing an untouched cell
// would silently strip the user's own markdown decoration from it.

const EDITABLE_KEYS = ["date", "description", "variables", "result", "verdict"];

// -- Attempt records: one loader, one freshness rule -------------------------
// state.attemptsById (full records, from /api/attempts) and
// state.attemptsConfig (the map file and its column names, from
// /api/summary) are read by the attempt panel and by this form, and the
// form can be opened from any view: the header button and the native
// menu's 新增尝试 work on 画布 and 血缘 too, where nothing has loaded the
// records (verifier finding on 53c61a7: a page that reopened on 画布 built
// the form from an empty map -- number 1, a full date in an MM-DD table,
// no verdict choices). So ensureAttemptData() re-reads BOTH, every time,
// before the form is built. It used to skip the read when the server's
// generation counter had not moved since the last one (a038210), but that
// counter is not a reliable "the graph changed" signal (verifier finding on
// a038210): a CLI `rce attempts` / `rce ingest` while the server is up, or
// a server restart that starts counting again from 1, changes the records
// without moving it, and the form then proposed a number that already
// exists and left out new verdict choices. Two small requests per form
// opening cost nothing a researcher can notice.
// Everything from here to toCellText is loaded into node by
// tests/test_webapp_canvas_js.py; the first three functions are pure.

// `attempts`: any iterable of /api/attempts records.
function defaultNewNumber(attempts) {
  // Task spec: max existing top-level number + 1 ("14a" counts as 14).
  let max = 0;
  for (const a of attempts) {
    const n = parseInt((a.attrs && a.attrs.number) || "", 10);
    if (!isNaN(n) && n > max) max = n;
  }
  return String(max + 1);
}

function defaultDateValue(attempts, now) {
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  // Match the format the table already uses: any existing bare "MM-DD"
  // row makes new rows follow suit; otherwise full "YYYY-MM-DD".
  let short = false;
  for (const a of attempts) {
    if (/^\d{2}-\d{2}/.test((a.attrs && a.attrs.date) || "")) short = true;
  }
  return short ? mm + "-" + dd : now.getFullYear() + "-" + mm + "-" + dd;
}

function distinctVerdicts(attempts) {
  // Quick choices = verdict values already present in this project's own
  // data -- never an invented vocabulary (the researcher owns the markers).
  const seen = new Set();
  for (const a of attempts) {
    const v = (a.verdict || "").trim();
    if (v && v.indexOf("\n") === -1) seen.add(v);
  }
  return Array.from(seen).slice(0, 8);
}

// The ONE path that fills state.attemptsById (the tree view loads through
// it too). Resolves true when the records were stored, false when the
// project was switched while the request was out (they are dropped);
// rejects when /api/attempts failed.
async function fetchAttemptRecords() {
  const epoch = state.dataEpoch;
  const data = await apiGet("/api/attempts");
  if (epoch !== state.dataEpoch) return false;
  state.attemptsById = new Map((data.attempts || []).map((a) => [a.id, a]));
  return true;
}

// The ONE path that fills state.attemptsConfig (the header's summary line
// reads through it too). Resolves the /api/summary body, or null when the
// project was switched meanwhile.
async function fetchSummary() {
  const epoch = state.dataEpoch;
  const data = await apiGet("/api/summary");
  if (epoch !== state.dataEpoch) return null;
  state.attemptsConfig = data.attempts_config || null;
  return data;
}

// Re-reads the records and the config (both, always -- see above).
// Resolves true when both are current, false when a project switch
// overtook it; rejects with the fetch's error.
async function ensureAttemptData() {
  const epoch = state.dataEpoch;
  const results = await Promise.all([
    fetchAttemptRecords(),
    fetchSummary().then((d) => d !== null),
  ]);
  return epoch === state.dataEpoch && results.every(Boolean);
}

function toCellText(value) {
  // The exact inverse of the server parser's <br> handling (its cell
  // cleanup turns a literal <br> into "\n" when reading): a newline typed
  // -- or carried in from a prefilled multi-line cell -- goes back out as
  // "<br>", since a markdown table cell cannot hold a raw newline and the
  // server rejects one outright. Normalized FIRST is the full set of
  // characters Python's str.splitlines() treats as line boundaries (the
  // server's _LINE_BOUNDARY_CHARS), not just \r\n: U+2028 rides along
  // invisibly in text pasted from PDFs and \x0b is PowerPoint's soft line
  // break, and any of them left through would be refused server-side --
  // here they just become the same <br> a typed newline becomes.
  return value.replace(/\r\n?/g, "\n")
    .replace(/[\v\f\x1c\x1d\x1e\x85\u2028\u2029]/g, "\n")
    .split("\n").map((s) => s.trim()).join("<br>")
    .replace(/^(<br>)+|(<br>)+$/g, "").trim();
}

function formFieldEl(labelText, inputEl) {
  const wrap = document.createElement("div");
  wrap.className = "form-field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.append(label, inputEl);
  return wrap;
}

// `err` (optional): the engine failure behind it, shown through the shared
// blocking-error helper -- the Chinese sentence, the raw text behind 「详情」.
function panelErrorBoxCn(message, err) {
  const box = document.createElement("div");
  box.className = "error-box";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = "无法打开编辑表单";
  const msg = document.createElement("div");
  if (err) renderBlockingError(msg, message, err);
  else msg.textContent = message;
  box.append(title, msg);
  return box;
}

function setFormStatus(statusEl, cls, cnText, err) {
  // Product language up front -- the specific sentence when the engine named
  // the cause (a duplicate number, ...) -- and the raw technical message one
  // click away behind 「详情」 (8.8 "Errors").
  statusEl.className = "panel-status " + cls;
  if (err) {
    renderBlockingError(statusEl, cnText, err);
    return;
  }
  statusEl.textContent = cnText;
  statusEl.title = "";
}

// Every way into the form -- 「＋ 新增尝试」, the native menu's 新增尝试,
// an attempt panel's 编辑 -- comes through here, and the form's defaults
// (next number, date format, verdict choices) and an edit's prefill are
// derived only after ensureAttemptData() has made the records and the
// config current. Meanwhile the panel says 载入中…; a failure is said in
// Chinese with the engine's text behind 「详情」, never an empty form with
// wrong defaults.
async function openAttemptForm(mode, attemptId) {
  const subject = { kind: "attempt-form" };
  state.panelSubject = subject;
  panelTitle.textContent = mode === "append" ? "新增尝试" : "编辑尝试";
  panelTitle.title = "";
  panelSubtitle.textContent = "";
  panelBody.innerHTML = '<p class="empty-note">载入中…</p>';
  openPanel();
  let ready = false;
  let failure = null;
  try {
    ready = await ensureAttemptData();
  } catch (err) {
    failure = err;
  }
  if (state.panelSubject !== subject) return; // closed, replaced, or the project switched
  if (!ready) {
    panelBody.innerHTML = "";
    panelBody.appendChild(failure
      ? panelErrorBoxCn("没能读到最新的尝试年表，表单先不打开，以免编号和日期填错。", failure)
      : panelErrorBoxCn("项目刚刚切换，请重新打开表单。"));
    return;
  }
  renderAttemptForm(mode, attemptId);
}

// Builds the form from the (now current) records and config.
function renderAttemptForm(mode, attemptId) {
  panelTitle.title = "";
  panelBody.innerHTML = "";
  const attempts = Array.from(state.attemptsById.values());
  const config = state.attemptsConfig;
  if (!config) {
    panelTitle.textContent = mode === "append" ? "新增尝试" : "编辑尝试";
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn(
      "尚未找到可用的尝试年表配置（.rce/attempts.toml）。请先在项目里配置年表，再从界面新增或编辑。"
    ));
    openPanel();
    return;
  }
  const record = mode === "update" ? state.attemptsById.get(attemptId) : null;
  if (mode === "update" && !record) {
    panelTitle.textContent = "编辑尝试";
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn("年表里已经没有这条尝试了，可能刚在文件里被改掉。"));
    openPanel();
    return;
  }
  const attrs = record ? (record.attrs || {}) : {};
  const number = mode === "append" ? defaultNewNumber(attempts) : (attrs.number || "");
  panelTitle.textContent = mode === "append" ? "新增尝试" : "编辑尝试 #" + number;
  panelSubtitle.textContent = "将写入 " + config.file;

  const form = document.createElement("form");
  form.className = "attempt-form";
  const inputs = {};
  const initial = {};

  const numberInput = document.createElement("input");
  numberInput.className = "form-input form-mono";
  numberInput.value = number;
  if (mode === "update") {
    // The number is the row's identity (the graph node id derives from
    // it) -- renumbering is a hand edit in the file, not a cell update.
    numberInput.disabled = true;
    numberInput.title = "编号是这一行的身份，界面里不改；如需重编号请直接改源文件";
  }
  form.appendChild(formFieldEl("编号", numberInput));

  // Field labels come from the project's OWN [columns] header text -- the
  // researcher's words, not this tool's.
  const defs = [
    { key: "date", label: config.columns.date ? "日期（" + config.columns.date + "）" : "日期", mono: true },
    { key: "description", label: config.columns.description || "描述", multiline: true },
    { key: "variables", label: config.columns.variables || "变量", multiline: true },
    { key: "result", label: config.columns.result || "结果", multiline: true },
    { key: "verdict", label: config.columns.verdict || "结论" },
  ];
  defs.forEach((def) => {
    let input;
    if (def.multiline) {
      input = document.createElement("textarea");
      input.className = "form-textarea";
      input.rows = 2;
    } else {
      input = document.createElement("input");
      input.className = "form-input" + (def.mono ? " form-mono" : "");
    }
    if (mode === "append") {
      input.value = def.key === "date" ? defaultDateValue(attempts, new Date()) : "";
    } else {
      input.value = def.key === "verdict" ? (record.verdict || "")
        : def.key === "result" ? (record.result || "")
        : (attrs[def.key] || "");
    }
    inputs[def.key] = input;
    initial[def.key] = input.value;
    const fieldEl = formFieldEl(def.label, input);
    if (def.key === "verdict") {
      const verdicts = distinctVerdicts(attempts);
      if (verdicts.length) {
        const chips = document.createElement("div");
        chips.className = "verdict-chips";
        verdicts.forEach((v) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.textContent = v;
          chip.addEventListener("click", () => { input.value = v; });
          chips.appendChild(chip);
        });
        fieldEl.appendChild(chips);
      }
    }
    form.appendChild(fieldEl);
  });

  const statusEl = document.createElement("div");
  statusEl.className = "panel-status";

  const actionsEl = document.createElement("div");
  actionsEl.className = "form-actions";
  const submitBtn = document.createElement("button");
  submitBtn.type = "submit";
  submitBtn.className = "btn btn-primary";
  submitBtn.textContent = "预览改动";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "btn";
  cancelBtn.textContent = "取消";
  cancelBtn.addEventListener("click", closePanel);
  actionsEl.append(submitBtn, cancelBtn);
  form.appendChild(actionsEl);

  const previewHost = document.createElement("div");

  function collectBody() {
    const num = mode === "append" ? numberInput.value.trim() : number;
    if (!num) {
      setFormStatus(statusEl, "err", "编号不能为空");
      return null;
    }
    const fields = {};
    if (mode === "append") {
      EDITABLE_KEYS.forEach((key) => { fields[key] = toCellText(inputs[key].value); });
    } else {
      // Dirty fields only (section comment above): an untouched cell must
      // never be round-tripped through its cleaned prefill.
      EDITABLE_KEYS.forEach((key) => {
        if (inputs[key].value !== initial[key]) fields[key] = toCellText(inputs[key].value);
      });
      if (Object.keys(fields).length === 0) {
        setFormStatus(statusEl, "", "没有需要写入的改动");
        return null;
      }
    }
    return { op: mode, number: num, fields: fields };
  }

  function setFormDisabled(disabled) {
    numberInput.disabled = disabled || mode === "update";
    EDITABLE_KEYS.forEach((key) => { inputs[key].disabled = disabled; });
    submitBtn.disabled = disabled;
  }

  function renderPreview(preview, body) {
    previewHost.innerHTML = "";
    setFormDisabled(true); // frozen while the preview stands -- 返回修改 unfreezes
    if (preview.old_row !== null && preview.old_row !== undefined) {
      const oldLabel = document.createElement("div");
      oldLabel.className = "diff-label";
      oldLabel.textContent = "原行";
      const oldRow = document.createElement("div");
      oldRow.className = "diff-row old";
      oldRow.textContent = preview.old_row;
      previewHost.append(oldLabel, oldRow);
    }
    const newLabel = document.createElement("div");
    newLabel.className = "diff-label";
    newLabel.textContent = "新行";
    const newRow = document.createElement("div");
    newRow.className = "diff-row new";
    newRow.textContent = preview.new_row;
    previewHost.append(newLabel, newRow);

    const note = document.createElement("div");
    note.className = "confirm-note";
    note.textContent = "将写入 " + preview.file + "（已自动备份）";
    const confirmActions = document.createElement("div");
    confirmActions.className = "form-actions";
    const confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.className = "btn btn-primary";
    confirmBtn.textContent = "确认写入";
    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "btn";
    backBtn.textContent = "返回修改";
    backBtn.addEventListener("click", () => {
      previewHost.innerHTML = "";
      setFormDisabled(false);
      statusEl.textContent = "";
    });
    confirmActions.append(confirmBtn, backBtn);
    previewHost.append(note, confirmActions);

    confirmBtn.addEventListener("click", async () => {
      confirmBtn.disabled = true;
      backBtn.disabled = true;
      setFormStatus(statusEl, "", "正在写入…");
      let result;
      try {
        // The confirmed body, verbatim -- the server re-validates against
        // the file's current state under the ingest lock either way.
        result = await apiPost("/api/attempts/write", body);
      } catch (err) {
        setFormStatus(statusEl, "err", "写入失败，文件没有被修改", err);
        backBtn.disabled = false; // 返回修改, fix, and re-preview
        return;
      }
      if (result.ingest_error) {
        // The file edit itself landed (and is backed up) -- only the
        // rescan failed; the refresh chip carries the same error.
        setFormStatus(statusEl, "err", "已写入并备份，但重扫失败", result.ingest_error);
        backBtn.disabled = false;
        pollGeneration();
        return;
      }
      closePanel(); // success -- the auto-refresh renders the new state
      pollGeneration();
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = collectBody();
    if (!body) return;
    setFormStatus(statusEl, "", "正在生成预览…");
    let preview;
    try {
      preview = await apiPost("/api/attempts/preview", body);
    } catch (err) {
      setFormStatus(statusEl, "err", "无法生成预览", err);
      return;
    }
    statusEl.textContent = "";
    renderPreview(preview, body);
  });

  panelBody.append(form, statusEl, previewHost);
  openPanel();
  (mode === "append" ? numberInput : inputs.description).focus();
}

document.getElementById("new-attempt-btn").addEventListener("click", () => openAttemptForm("append"));

// -- The human record's surfaces (DESIGN.md 9.3-9.6, task V5 phase 7) --------
// The 待复核 list (9.6), the 记录 inventory (9.2), the identity questions
// (9.4), the migration banner (9.5), the ledger's trust and shrink states
// (9.3). Every write goes through an existing origin-checked endpoint and
// the server's one human write path; every refusal is shown with the
// shared helper (a Chinese sentence, the engine's text behind 「详情」).

const JUDGE_UNDO_MS = 10000; // as long as the canvas's 「撤销」 offer

function mk(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function mkButton(label, cls, onClick) {
  const b = mk("button", cls || "btn btn-small", label);
  b.type = "button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}

function keyOf(x) {
  return { src: x.src, dst: x.dst, type: x.type, extractor: x.extractor };
}

function keyId(x) {
  return JSON.stringify([x.src, x.dst, x.type, x.extractor]);
}

function setStatus(el, cls, text, err) {
  el.className = "notice-status" + (cls ? " " + cls : "");
  if (err) renderBlockingError(el, text, err);
  else { el.textContent = text || ""; el.title = ""; }
}

// What stops a human record before it is even tried (9.10, 9.4): the page
// says it in place of the action rather than letting the click fail.
function humanRecordsBlocked() {
  const s = state.summary;
  if (!s) return null;
  if (s.needs_migration) return "迁移后才能记录判断";
  if (s.read_only) return "只读打开：不会写入任何东西";
  return null;
}

// One human act on one machine link, through POST /api/judgements (the
// one write path, 9.1). Resolves the response, or throws the refusal.
function postJudgement(key, verdict, note) {
  const body = Object.assign(keyOf(key), { verdict: verdict });
  if (note && note.trim()) body.note = note.trim();
  return apiPost("/api/judgements", body);
}

// -- 待复核 (9.6) ---------------------------------------------------------------

const reviewNotes = new Map(); // keyId -> a note being typed, kept across re-renders

async function openReviewPanel(focus) {
  const subject = { kind: "review", focus: focus ? keyId(focus) : null, scrolled: false };
  state.panelSubject = subject;
  panelTitle.textContent = "待复核";
  panelTitle.title = "";
  panelSubtitle.textContent = "证据变了的旧判断，等你再看一眼";
  panelBody.innerHTML = '<p class="empty-note">载入中…</p>';
  openPanel();
  await renderReviewPanel(subject);
}

function reasonNow(item) {
  if (item.basis_now) return basisLines(item.basis_now);
  if (item.reason === "not_produced") return ["本次扫描读到了两端，但没有得出这条关联"];
  if (item.reason === "endpoint_gone") return ["关联的一端不在本次扫描结果里"];
  return ["本次扫描没有给出依据"];
}

function basisColumn(title, lines) {
  const col = mk("div", "basis-col");
  col.appendChild(mk("div", "basis-col-title", title));
  (lines.length ? lines : ["（没有记录依据）"]).forEach((l) => col.appendChild(mk("div", null, l)));
  return col;
}

function reviewActions(item) {
  if (item.outcome === "conflict") {
    return [["定为确认", "confirmed"], ["定为否决", "rejected"], ["撤回", "withdrawn"]];
  }
  const opposite = item.verdict === "confirmed" ? ["改为否决", "rejected"] : ["改为确认", "confirmed"];
  return [["仍然成立", item.verdict], opposite, ["撤回", "withdrawn"]];
}

async function judgeFromReview(target, verdict, note, statusEl, buttons, done) {
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在记录…");
  try {
    const res = await postJudgement(target, verdict, note);
    // This page re-fetches right below; the poll need not do it again.
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能记录这条判断", err);
    return;
  }
  reviewNotes.delete(keyId(target));
  state.reviewOffer = { text: done + "：" + linkText(target), key: keyOf(target), until: Date.now() + JUDGE_UNDO_MS };
  setTimeout(() => {
    if (state.reviewOffer && state.reviewOffer.until <= Date.now()) {
      state.reviewOffer = null;
      const subject = state.panelSubject;
      if (subject && subject.kind === "review") renderReviewPanel(subject);
    }
  }, JUDGE_UNDO_MS + 50);
  await refreshCurrentView(); // the count, the marks and this list, now
}

async function undoFromReview(key, statusEl) {
  state.reviewOffer = null;
  setStatus(statusEl, "", "正在撤销…");
  try {
    const res = await postJudgement(key, "undone");
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
  } catch (err) {
    setStatus(statusEl, "err", "无法撤销", err);
    return;
  }
  await refreshCurrentView();
}

function renderReviewItem(item, subject) {
  const id = keyId(item);
  const box = mk("div", "review-item" + (subject.focus === id ? " focus" : ""));
  box.dataset.key = id;
  const link = mk("div", "review-link", linkText(item));
  link.title = item.src + " → " + item.dst + "（" + item.type + " · " + item.extractor + "）";
  box.append(link, mk("span", "review-reason", item.label || "待复核"));
  if (item.outcome === "conflict") {
    const d = item.detail || {};
    box.appendChild(mk("p", "review-note", d.contradicts
      ? "迁移来的旧判断和记录里已有的判断相反（两台电脑各判断过一次）。RCE 不按迁移日期替你选，请写一条新判断定下它。"
      : "两份记录各自追加了不同的内容（可能是两台电脑各改了一份，再被同步合并）。RCE 不按时间替你选，请写一条新判断定下它。"));
    if (d.common && d.common.length) box.appendChild(mk("div", "review-note", "共同的记录：" + d.common.map(historyEntryText).join("；")));
    const branches = mk("div", "review-branches");
    (d.branches || []).forEach((branch, i) => {
      const col = mk("div", "basis-col");
      col.appendChild(mk("div", "basis-col-title", (d.contradicts ? ["记录里原有的", "迁移来的"][i] : "第 " + (i + 1) + " 份") || ("第 " + (i + 1) + " 份")));
      branch.forEach((e) => col.appendChild(mk("div", null, historyEntryText(e) + (e.note ? " · " + e.note : ""))));
      branches.appendChild(col);
    });
    box.appendChild(branches);
  } else {
    box.appendChild(mk("div", "review-was", "原判断：" + verdictWord(item.verdict) + " · " + whenText(item)));
    if (item.note) box.appendChild(mk("div", "review-note", "备注：" + item.note));
    const pair = mk("div", "basis-pair");
    pair.append(basisColumn("当时的依据", basisLines(item.basis)), basisColumn("现在", reasonNow(item)));
    box.appendChild(pair);
  }
  const noteInput = mk("input", "form-input");
  noteInput.placeholder = "备注（可选）";
  noteInput.dataset.noteFor = id;
  noteInput.value = reviewNotes.get(id) || "";
  noteInput.addEventListener("input", () => reviewNotes.set(id, noteInput.value));
  const status = mk("div", "notice-status");
  const buttons = [];
  const candidates = item.candidates || [];
  if (candidates.length && (item.verdict === "confirmed" || item.verdict === "rejected")) {
    const cands = mk("div", "review-cands");
    cands.appendChild(mk("div", "review-cands-title",
      "可能对应的新关联（同一次扫描里新出现）：旧判断不会自己转过去，点了才会在它上面记下一条新判断，旧的这条保持原样。"));
    candidates.forEach((c) => {
      const row = mk("div", "review-cand");
      const t = mk("span", "review-link", linkText(c));
      t.title = c.src + " → " + c.dst;
      const b = mkButton("把这条旧判断用到它上面", "btn btn-small", () =>
        judgeFromReview(c, item.verdict, noteInput.value, status, buttons, "已用到新关联上（" + verdictWord(item.verdict) + "）"));
      buttons.push(b);
      row.append(t, b);
      cands.appendChild(row);
    });
    box.appendChild(cands);
  }
  const actions = mk("div", "review-actions");
  const blocked = humanRecordsBlocked();
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
  } else {
    actions.appendChild(noteInput);
    reviewActions(item).forEach(([label, verdict]) => {
      const done = verdict === "withdrawn" ? "已撤回" : label === "仍然成立" ? "已记录：仍然成立" : "已" + label;
      const b = mkButton(label, "btn btn-small", () => judgeFromReview(item, verdict, noteInput.value, status, buttons, done));
      buttons.push(b);
      actions.appendChild(b);
    });
  }
  box.append(actions, status);
  return box;
}

function sourceFiles(item) {
  const d = item.detail || {};
  if (Array.isArray(d.sources) && d.sources.length) return d.sources;
  return [String(item.src).slice(String(item.src).indexOf(":") + 1)];
}

async function renderReviewPanel(subject) {
  let data;
  try {
    data = await apiGet("/api/review");
  } catch (err) {
    if (state.panelSubject !== subject) return;
    renderViewFailure(panelBody, err);
    return;
  }
  if (state.panelSubject !== subject) return;
  const top = panelBody.scrollTop;
  panelBody.innerHTML = "";
  const ledger = data.ledger || {};
  if (ledger.state && ledger.state !== "ok") {
    const warn = mk("div", "notice bad");
    warn.appendChild(mk("div", "notice-title", ledger.message || "判断记录文件当前无法读取，请先恢复它"));
    warn.appendChild(mk("p", null, "修好之前，这里的操作都不会被记录。"));
    panelBody.appendChild(warn);
  }
  const offer = state.reviewOffer;
  const offerStatus = mk("div", "panel-status ok");
  if (offer && offer.until > Date.now()) {
    offerStatus.appendChild(mk("span", null, offer.text));
    const undo = mkButton("撤销", "err-detail-toggle", () => undoFromReview(offer.key, offerStatus));
    offerStatus.appendChild(undo);
  }
  panelBody.appendChild(offerStatus);
  panelBody.appendChild(mk("p", "review-intro",
    "这些判断做出时依据的事实，这次扫描看到的不一样了。判断没有被删掉，也没有被套用：连线暂时按机器的结果显示，等你决定。"));
  if (!data.review.length) panelBody.appendChild(mk("p", "empty-note", "没有待复核的旧判断。"));
  data.review.forEach((item) => panelBody.appendChild(renderReviewItem(item, subject)));
  const held = data.source_unreadable || [], absent = data.not_in_index || [];
  if (held.length || absent.length) {
    panelBody.appendChild(mk("div", "review-quiet-title", "不计入待复核"));
    held.forEach((item) => {
      const row = mk("div", "review-quiet");
      row.append(mk("span", "review-link", linkText(item)),
        " · 来源文件暂不可读：" + sourceFiles(item).join("、") + " · 判断照旧（" + verdictWord(item.verdict) + "）");
      panelBody.appendChild(row);
    });
    absent.forEach((item) => {
      const row = mk("div", "review-quiet");
      row.append(mk("span", "review-link", linkText(item)),
        " · 图谱里还没有这条关联 · 你的判断：" + verdictWord(item.verdict) + "（" + whenText(item) + "）");
      panelBody.appendChild(row);
    });
  }
  if (subject.focus && !subject.scrolled) {
    subject.scrolled = true;
    const target = Array.from(panelBody.querySelectorAll(".review-item")).find((n) => n.dataset.key === subject.focus);
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "center" });
  } else {
    panelBody.scrollTop = top;
  }
}

// -- 记录 (9.2: what `rce records` prints) -------------------------------------

const RECORD_KIND_WORDS = {
  judgements: "对机器连线的确认与否决",
  mappings: "手工连线与备注",
  attempts: "尝试结论",
  attempts_config: "尝试年表配置",
  canvas: "画布位置",
  variables: "变量定义卡",
  legacy: "旧版本索引里的判断",
};

const RECORD_ISSUE_WORDS = {
  dataless: "正在从云端下载", unreadable: "无法读取", conflict_copy: "旁边有同步冲突副本",
  invalid: "内容无法解析", refused_entries: "有条目没有被采用（运行 rce mappings 查看）",
  migration_unfinished: "上次迁移没有完成", needs_migration: "等待迁移",
};

function recordCountText(row) {
  const f = row.facts || {};
  switch (row.code) {
    case "judgements":
      if (typeof f.entries === "number") {
        return f.entries + " 条记录，其中 " + f.standing + " 条判断生效中" + (f.conflicts ? "，" + f.conflicts + " 条记录冲突" : "");
      }
      return f.file_state === "absent" ? "还没有" : "无法读取";
    case "mappings":
      if (f.state === "present") return f.links + " 条手工连线，其中 " + f.with_note + " 条带备注";
      return f.state === "absent" ? "还没有" : "无法读取";
    case "attempts":
      if (f.state === "present") return f.attempts + " 条尝试，其中 " + f.with_verdict + " 条有结论";
      return { not_configured: "还没有配置尝试年表", unusable: "年表配置无法使用", table_missing: "找不到年表" }[f.state] || "无法读取";
    case "attempts_config":
      return f.exists ? "已配置" : "没有";
    case "canvas":
      if (f.state === "ok" || f.state === "legacy") {
        return f.views + " 个视图，其中 " + f.arranged + " 个摆放过" + (f.state === "legacy" ? "（还在索引旁，尚未移入项目）" : "");
      }
      return f.state === "absent" ? "还没有摆放过" : f.state === "dataless" ? "正在从云端下载…" : "无法读取";
    case "variables":
      return f.exists ? f.cards + " 张卡片" : "还没有";
    case "legacy":
      return f.waiting + " 个旧索引等待迁移";
    default:
      return row.count || "";
  }
}

function recordIssueText(row) {
  const f = row.facts || {};
  const words = (f.issues || []).map((code) => {
    if (code === "invalid" && f.line) return "第 " + f.line + " 行无法解析";
    if (Object.prototype.hasOwnProperty.call(RECORD_ISSUE_WORDS, code)) return RECORD_ISSUE_WORDS[code];
    return f.trust_message || "需要处理";
  });
  return Array.from(new Set(words)).join("；");
}

async function openRecordsPanel() {
  const subject = { kind: "records" };
  state.panelSubject = subject;
  panelTitle.textContent = "人工记录";
  panelTitle.title = "";
  panelSubtitle.textContent = "你的劳动成果，保存在项目自己的 .rce/ 里；删掉索引也不会丢";
  panelBody.innerHTML = '<p class="empty-note">载入中…</p>';
  openPanel();
  await renderRecordsPanel(subject);
}

async function renderRecordsPanel(subject) {
  let data;
  try {
    data = await apiGet("/api/records");
  } catch (err) {
    if (state.panelSubject !== subject) return;
    renderErrorBox(panelBody, err);
    return;
  }
  if (state.panelSubject !== subject) return;
  panelBody.innerHTML = "";
  (data.rows || []).forEach((row) => {
    const div = mk("div", "records-row");
    div.appendChild(mk("div", "records-kind", RECORD_KIND_WORDS[row.code] || row.kind));
    const where = mk("div", "records-path");
    where.appendChild(mk("span", "mono", row.path));
    const status = mk("div", "panel-status");
    const inside = row.code !== "legacy" && row.path && row.path !== "-" && row.path.charAt(0) !== "/";
    if (inside) {
      // 在 Finder 中显示: the file itself, or the .rce/ folder it will live in.
      const target = (row.facts && row.facts.exists) ? row.path : ".rce";
      where.appendChild(mkButton("在 Finder 中显示", "err-detail-toggle", () => runOpenAction(target, true, status)));
    }
    div.append(where, mk("div", "records-count", recordCountText(row)));
    div.appendChild(mk("div", "fact-line", row.snapshot ? "最新快照：" + row.snapshot : "还没有快照"));
    if (row.problems && row.problems.length) {
      const problem = mk("div", "records-problem");
      renderBlockingError(problem, recordIssueText(row) || "需要处理", row.problems.join("\n"));
      div.appendChild(problem);
    }
    div.appendChild(status);
    panelBody.appendChild(div);
  });
}

document.getElementById("records-btn").addEventListener("click", () => openRecordsPanel());

// -- Notices above the views ------------------------------------------------------
// One place for what the record needs from the researcher, rebuilt from
// state.summary on every summary refresh -- but only when what it shows
// changed (a typed answer or a running migration is never wiped), and
// never while an answer is in flight.

function notice(tone) {
  return mk("div", "notice" + (tone ? " " + tone : ""));
}

function noticeHead(box, title, onClose) {
  if (onClose) {
    const close = mkButton("×", "notice-close", onClose);
    close.setAttribute("aria-label", "关闭");
    close.title = "关闭";
    box.appendChild(close);
  }
  box.appendChild(mk("div", "notice-title", title));
}

function renderNotices(force) {
  const host = document.getElementById("notices");
  if (!host || (state.noticeBusy && !force)) return;
  const s = state.summary;
  const sig = JSON.stringify([
    state.projectMoved, s && s.read_only, s && s.needs_migration, s && s.migration, s && s.records,
    state.migrationInfo && [state.migrationInfo.loading, !!state.migrationInfo.data, !!state.migrationInfo.error],
    state.sessionNotes.length,
  ]);
  if (!force && sig === state.noticeSig) return;
  state.noticeSig = sig;
  host.innerHTML = "";
  if (state.projectMoved) host.appendChild(movedNotice());
  if (s && s.read_only) host.appendChild(readOnlyNotice());
  if (s && s.needs_migration) host.appendChild(migrationNotice(s));
  // An unfinished migration is said once, by its own banner, not again as
  // a ledger that refuses writes (one cause, one message).
  const migrating = s && s.records && s.records.reason === "migrating" && s.needs_migration;
  if (s && s.records && s.records.state && s.records.state !== "ok" && !migrating) host.appendChild(recordsNotice(s.records));
  state.sessionNotes.forEach((n, i) => host.appendChild(sessionNotice(n, i)));
}

async function reopenProject(statusEl, buttons) {
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在重新打开…");
  try {
    await apiPost("/api/project/reopen", {});
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能重新打开", err);
    return;
  }
  state.projectMoved = false;
  await reloadAllViews();
}

function movedNotice() {
  const box = notice("bad");
  noticeHead(box, "项目已移动或已在别处认领，请重新打开");
  box.appendChild(mk("p", null,
    "刚才的操作没有写入任何东西：这个文件夹已经不在原处，或者另一个文件夹已经认领了这个项目。重新打开后，RCE 会重新确认它是谁。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新打开", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

function readOnlyNotice() {
  const box = notice("warn");
  noticeHead(box, "只读打开");
  box.appendChild(mk("p", null, "原位置暂时无法确认，这次只浏览：不认领、不写入任何东西。原位置能访问后，点「重新检查」回答是移动还是复制。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新检查", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

// -- 9.5: a pre-V5 project's migration -------------------------------------------

async function ensureMigrationInfo(summary) {
  const waiting = (summary.migration && summary.migration.waiting) || [];
  if (!waiting.length || (summary.migration && summary.migration.migrating_from)) return;
  const key = state.dataEpoch + ":" + waiting.map((w) => w.key).join(",");
  if (state.migrationInfo && state.migrationInfo.key === key) return;
  const info = { key: key, loading: true, data: null, error: null };
  state.migrationInfo = info;
  renderNotices();
  try {
    info.data = await apiGet("/api/migration");
  } catch (err) {
    info.error = err;
  }
  info.loading = false;
  if (state.migrationInfo === info) renderNotices();
}

function previewLines(p) {
  const lines = [];
  if (p.error) {
    lines.push("这个旧索引读不出来（" + p.db_path + "）");
    return lines;
  }
  if (p.recorded_path) {
    lines.push("旧索引说它来自：" + p.recorded_path +
      (p.path_exists === false ? "（这个位置现在没有文件夹）" : p.path_exists ? "（这个位置还在）" : ""));
  } else {
    lines.push("旧索引没有记下它来自哪里（" + p.db_path + "）");
  }
  lines.push("里面有 " + p.confirmed + " 条确认、" + p.rejected + " 条否决，" + p.arranged_views + " 个摆放过的画布视图" +
    (p.mapping_links ? "；另有 " + p.mapping_links + " 条手工连线，它们本来就在 mappings.toml 里" : ""));
  if (p.judged) {
    lines.push(p.judged + " 条里有 " + p.produced + " 条的两端能在这个文件夹里扫到");
    if (p.produced / p.judged < 0.5) lines.push("匹配很低：这些判断可能属于另一个项目。");
  }
  if (p.scan_error) lines.push("扫描这个文件夹时出了错，能扫到的数目可能偏低。");
  return lines;
}

function migrationNotice(s) {
  const box = notice("warn");
  const waiting = (s.migration && s.migration.waiting) || [];
  const resuming = s.migration && s.migration.migrating_from;
  noticeHead(box, resuming ? "上次迁移没有完成" : waiting.length ? "旧版本的判断在等待迁移" : "这个项目来自旧版本");
  box.appendChild(mk("p", null, "迁移后才能记录判断。" + (resuming || waiting.length
    ? "迁移会把旧索引里的确认、否决和画布位置写进项目自己的 .rce/，核对数目对上之后才把旧索引移到一旁（不删除）。"
    : "没有找到等待迁移的旧索引；在终端运行 rce migrate --list 可以查看本机所有旧索引。")));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  if (resuming) {
    box.appendChild(mk("div", "fact-line", "旧索引：" + resuming));
    const b = mkButton("继续迁移", "btn btn-primary", () => runMigration("migrate", status, [b]));
    actions.appendChild(b);
  } else if (waiting.length) {
    const info = state.migrationInfo;
    if (!info || info.loading) {
      box.appendChild(mk("p", null, "正在核对旧索引与这个文件夹…"));
    } else if (info.error) {
      const e = mk("div", "notice-status err");
      renderBlockingError(e, "没能读出等待迁移的旧索引", info.error);
      box.appendChild(e);
    } else {
      (info.data.previews || []).forEach((p) => {
        const list = mk("ul", "entry-list");
        previewLines(p).forEach((l) => list.appendChild(mk("li", null, l)));
        box.appendChild(list);
      });
      const yes = mkButton("迁移这些记录", "btn btn-primary", () => runMigration("migrate", status, [yes, no]));
      const no = mkButton("这不是这个项目的", "btn", () => runMigration("not_mine", status, [yes, no]));
      actions.append(yes, no);
    }
  }
  box.append(actions, status);
  return box;
}

function tallyLines(t) {
  if (!t) return [];
  const lines = ["旧索引里有 " + t.m + " 条确认或否决：" + t.applied + " 条已生效，" + t.review_other + " 条待复核" +
    (t.contradicted ? "（其中 " + t.contradicted + " 条记录冲突）" : "") + "，" + t.review_not_produced + " 条机器不再得出、同样待复核"];
  if (t.skipped_mappings) lines.push("手工连线 " + t.skipped_mappings + " 条本来就在 mappings.toml 里，没有重复迁移");
  if (t.stale_mirror && t.stale_mirror.length) lines.push("旧索引里有 " + t.stale_mirror.length + " 处和你的文件不一致，以文件为准");
  if (t.review_other + t.review_not_produced > 0) lines.push("待复核的可以点页面顶部的「待复核」逐条查看。");
  return lines;
}

function migrationResultNote(res) {
  if (res.declined) {
    return { tone: "", title: "已记下：这些旧记录不属于这个项目", lines: ["旧索引保持原样，没有被删除；这个文件夹以后不再提示它们。"] };
  }
  const results = res.results || [];
  const last = results[results.length - 1] || {};
  if (res.ok) {
    const lines = [];
    results.forEach((r) => {
      tallyLines(r.tally).forEach((l) => lines.push(l));
      if (r.retired_to) lines.push("旧索引已移到：" + r.retired_to);
    });
    return { tone: "", title: "迁移完成", lines: lines };
  }
  if (last.holders && last.holders.length) {
    return {
      tone: "bad", title: "记录已经写好，但旧索引还被占用，没有移走",
      lines: last.holders.map((h) => "占用它的进程" + (h.pid != null ? " " + h.pid : "") + "：" + h.what)
        .concat(["请先退出 RCE 与 MCP 服务（占用它的那一个），然后点「继续迁移」。"]),
      detail: last.stopped,
    };
  }
  return {
    tone: "bad", title: "核对没有对上，迁移停了下来",
    lines: ["什么都没有移走，旧索引继续使用；再试一次不会重复写入。"].concat(tallyLines(last.tally)),
    detail: [last.stopped].concat((last.tally && last.tally.unmatched) || []).filter(Boolean).join("\n"),
  };
}

async function runMigration(answer, statusEl, buttons) {
  if (answer === "not_mine" && !window.confirm(
    "确定这些旧记录不属于这个项目？\n\n旧索引保持原样，不会被删除；这个文件夹以后不再提示它们。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", answer === "migrate" ? "正在迁移…（会重新扫描整个项目，可能要一会儿）" : "正在记下…");
  let res;
  try {
    res = await apiPost("/api/migration/run", { answer: answer });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", answer === "migrate" ? "迁移没有完成" : "没能记下", err);
    return;
  }
  state.noticeBusy = false;
  // The latest outcome replaces an earlier one (a refused retire, then 继续迁移).
  state.sessionNotes = state.sessionNotes.filter((n) => n.kind !== "migration");
  state.sessionNotes.push(Object.assign(migrationResultNote(res), { kind: "migration" }));
  await reloadAllViews();
}

// -- 9.3: a ledger RCE cannot trust, and the shrink question -----------------------

  missing: ["判断记录文件不见了", "项目身份文件记着这个项目有判断记录（.rce/judgements.toml），但文件不在。RCE 不会新建一个空文件来代替它；请从备份或同步服务里把它找回来。"],
  dataless: ["判断记录文件还在云端", "系统正在下载 .rce/judgements.toml，下载完成后会自动恢复。"],
  unreadable: ["判断记录文件无法读取", ".rce/judgements.toml 读不出来。"],
  invalid: ["判断记录文件有一处无法解析", ".rce/judgements.toml 里有一处读不懂（常见于手工编辑），请修正它。"],
  empty_but_expected: ["判断记录文件是空的", "这个项目记录过判断，但 .rce/judgements.toml 现在没有任何条目。"],
  conflict_copy: ["判断记录文件旁有同步冲突副本", "同步服务在 .rce/ 里留下了冲突副本。RCE 不会自行合并：请留下正确的那一份，把另一份移走。"],
  no_identity: ["项目身份文件无法读取", "没有可读的项目身份，判断无处记录。"],
  migrating: ["项目正在迁移", "迁移完成之前不能记录判断。"],
};

function recordsNotice(rec) {
  if (rec.state === "shrunk") return shrinkNotice(rec);
  const box = notice("bad");
  const trouble = RECORD_TROUBLE[rec.reason] || [rec.message || "判断记录文件当前无法读取，请先恢复它", ""];
  noticeHead(box, trouble[0]);
  if (trouble[1]) box.appendChild(mk("p", null, trouble[1]));
  if (rec.reason === "invalid" && rec.line) box.appendChild(mk("div", "fact-line", "出错的位置：第 " + rec.line + " 行"));
  if (rec.conflict_copies && rec.conflict_copies.length) box.appendChild(mk("div", "fact-line", "冲突副本：" + rec.conflict_copies.join("、")));
  box.appendChild(mk("p", null, "修好之前，确认、否决、撤回都不会被记录；图谱保留着它原来知道的判断状态，没有因此改变。"));
  if (rec.detail) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", rec.detail);
    box.appendChild(d);
  }
  return box;
}

function shrinkNotice(rec) {
  const missing = rec.missing || [];
  const n = missing.length;
  const box = notice("warn");
  noticeHead(box, "记录文件比图谱少了 " + n + " 条判断");
  box.appendChild(mk("p", null,
    "图谱记得下面这些判断，但 .rce/judgements.toml 里没有了（可能是从备份恢复、同步服务保留了另一台电脑的文件，或文件被截断）。RCE 什么都没改，等你决定以哪一份为准。"));
  const list = mk("ul", "entry-list");
  missing.forEach((m) => {
    const li = mk("li", null, historyEntryText(m));
    li.appendChild(mk("div", "entry-sub", linkText(m) + (m.note ? " · 备注：" + m.note : "")));
    list.appendChild(li);
  });
  box.appendChild(list);
  const ids = missing.map((m) => m.id); // the answer names exactly the entries shown (9.12)
  const status = mk("div", "notice-status");
  const answers = [
    ["file", "以文件为准", "这是有意从备份恢复时要的：图谱忘掉这 " + n + " 条判断，以文件现在的内容为准。"],
    ["restore", "把缺少的补回文件", "把这 " + n + " 条判断按原样追加回文件末尾（标为补回），文件里已有的内容不动。"],
  ];
  const buttons = [];
  answers.forEach(([answer, label, help]) => {
    const row = mk("div", "answer");
    const b = mkButton(label, "btn", () => answerShrink(answer, ids, n, status, buttons));
    buttons.push(b);
    row.append(b, mk("span", "answer-help", help));
    box.appendChild(row);
  });
  box.appendChild(status);
  return box;
}

async function answerShrink(answer, ids, n, statusEl, buttons) {
  if (answer === "file" && !window.confirm("以文件为准？\n\n图谱会忘掉这 " + n + " 条判断，以 .rce/judgements.toml 现在的内容为准。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  try {
    await apiPost("/api/records/answer", { file: "judgements", answer: answer, missing: ids });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个回答", err);
    return;
  }
  state.noticeBusy = false;
  state.sessionNotes.push(answer === "file"
    ? { tone: "", title: "已以文件为准", lines: ["图谱现在只按 .rce/judgements.toml 里的判断显示。"] }
    : { tone: "", title: "已把缺少的 " + n + " 条判断补回文件", lines: ["它们追加在 .rce/judgements.toml 末尾，标为补回。"] });
  await refreshCurrentView();
  renderNotices(true);
}

function sessionNotice(note, index) {
  const box = notice(note.tone);
  noticeHead(box, note.title, () => {
    state.sessionNotes.splice(state.sessionNotes.indexOf(note), 1);
    renderNotices(true);
  });
  (note.lines || []).forEach((l) => box.appendChild(mk("p", null, l)));
  if (note.detail) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", note.detail);
    box.appendChild(d);
  }
  return box;
}

// -- 9.4: the identity questions, asked where the view would have been ------------

const SITUATION_TITLES = {
  copy: "这个文件夹是一个项目的副本",
  cannot_check: "无法确认原来的项目还在不在",
  lost_id: "项目身份文件不见了",
  unreadable_id: "项目身份文件无法读取",
  missing: "找不到项目文件夹（可能已移动）",
};

const ANSWER_HELP = {
  fork: "这个文件夹得到新的项目身份，带着现有的全部记录从这里起与原项目分开；原来的文件夹不受影响。",
  claim: "这里才是原项目：项目的索引改为跟随这个文件夹，并按它重新建立；另一个文件夹下次打开时会被问同样的问题。",
  other: "这个文件夹只是收到了别处复制来的 .rce/：给它新的身份；复制来的判断、画布位置和变量卡移到 .rce/backups/，不再算作它的记录。",

  adopt: "给这个文件夹新的项目身份，.rce/ 里现有的判断、画布位置和变量卡全部保留，并据此重新建立索引。",
};

const ANSWER_CONFIRM = {
  claim: "这里才是原项目？\n\n项目的索引会按这个文件夹重新建立；另一个文件夹下次打开时会被问同样的问题。",
  other: "这是另一个项目？\n\n复制来的判断、画布位置和变量卡会被移到 .rce/backups/（不删除），这个文件夹得到新的身份。",
};

function resolveNote(answer, res) {
  const lines = [];
  if (answer === "fork") lines.push("新的项目身份：" + res.project_id + "。从现在起，这里的判断不会出现在原项目里。");
  if (answer === "claim") lines.push("项目的索引已按这个文件夹重新建立。");
  if (answer === "adopt") lines.push("新的项目身份：" + res.project_id + "，原有记录都保留了。");
  if (answer === "restore" && res.restored_from) lines.push("项目身份文件已从备份恢复：" + res.restored_from);
  if (res.git_tracked_identity) lines.push("注意：.rce/project.toml 由 git 跟踪；提交它，会把新的身份带进它被合并到的分支。");
  if (res.moved_aside && res.moved_aside.length) lines.push("复制来的记录已移进 .rce/backups/（没有删除）：" + res.moved_aside.join("、"));
  const titles = {
    fork: "已作为独立分支继续", claim: "已认领：这里是原项目", other: "已作为另一个项目打开",
    restore: "项目身份已恢复", adopt: "已沿用这些记录，建立新身份",
  };
  if (!titles[answer]) return null;
  if (res.build_error) lines.push("重新建立索引时出了错，下次打开会再试。");
  return { tone: res.build_error ? "bad" : "", title: titles[answer], lines: lines, detail: res.build_error || null };
}

async function answerSituation(answer, statusEl, buttons) {
  if (ANSWER_CONFIRM[answer] && !window.confirm(ANSWER_CONFIRM[answer])) return;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  let res;
  try {
    res = await apiPost("/api/project/resolve", { answer: answer });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个选择", err);
    return;
  }
  const note = resolveNote(answer, res);
  if (note) state.sessionNotes.push(note);
  await reloadAllViews();
}

async function locateProject(projectId, path, statusEl, buttons) {
  if (!path || path.charAt(0) !== "/") {
    setStatus(statusEl, "err", "请填写文件夹的完整路径（以 / 开头）");
    return;
  }
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在确认这个文件夹是不是这个项目…");
  try {
    await apiPost("/api/projects/locate", { id: projectId, path: path });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能使用这个位置", err);
    return;
  }
  await reloadAllViews();
}

function renderSituation(err) {
  const sit = err.situation;
  const box = mk("div", "notice bad state-note");
  noticeHead(box, SITUATION_TITLES[sit.situation] || PROJECT_STATES.project_blocked.title);
  if (sit.message && sit.message !== SITUATION_TITLES[sit.situation]) box.appendChild(mk("p", null, sit.message));
  const fact = (label, value) => { if (value) box.appendChild(mk("div", "fact-line", label + value)); };
  const status = mk("div", "notice-status");
  const buttons = [];
  if (sit.situation === "missing") {
    fact("项目列表里记的位置：", sit.path);
    if (sit.reason === "path_holds_another_project") {
      box.appendChild(mk("p", null, "这个位置现在放着另一个项目（或一个没有项目身份的文件夹），不会被当成它。"));
    }
    if (!sit.project_id) {
      box.appendChild(mk("p", null, "这个项目来自旧版本，没有项目身份，无法按身份找回；请在新位置运行 rce serve。"));
    } else {
      box.appendChild(mk("p", null, "如果你把它移到了别处，在下面指明新位置：RCE 只认带着这个项目身份的文件夹，不会自己去找。"));
      box.appendChild(mk("div", "notice-title", "选择新位置…"));
      const row = mk("div", "locate-row");
      const input = mk("input", "form-input");
      input.id = "locate-path";
      input.placeholder = "新位置的完整路径，例如 /Users/你/Documents/项目文件夹";
      const use = mkButton("使用这个位置", "btn", () => locateProject(sit.project_id, input.value.trim(), status, buttons));
      buttons.push(use);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") use.click(); });
      row.append(input, use);
      if (shellCan("choose-folder")) {
        const pick = mkButton("选择文件夹…", "btn", async () => {
          const chosen = await chooseFolder();
          if (!chosen) return; // cancelled in the native panel
          input.value = chosen;
          locateProject(sit.project_id, chosen, status, buttons);
        });
        buttons.push(pick);
        row.appendChild(pick);
      }
      box.appendChild(row);
    }
  } else {
    fact("这个文件夹：", sit.path);
    if (sit.situation === "copy" || sit.situation === "cannot_check") fact("项目原来的位置：", sit.home);
    if (sit.situation === "lost_id") {
      if (Array.isArray(sit.records) && sit.records.length) fact("在 .rce/ 里找到的记录：", sit.records.join("、"));
      if (sit.snapshot) fact("备份里的项目身份：", sit.snapshot.file + (sit.snapshot.created ? "（创建于 " + sit.snapshot.created + "）" : ""));
    }
    if (sit.situation === "unreadable_id") {
      if (sit.line) fact("出错的位置：", "第 " + sit.line + " 行");
      if (Array.isArray(sit.conflict_copies) && sit.conflict_copies.length) fact("旁边的同步冲突副本：", sit.conflict_copies.join("、"));
      box.appendChild(mk("p", null, "修好 .rce/project.toml（或等它从云端取回、移走冲突副本）之后，点「重新检查」。"));
    }
    box.appendChild(mk("p", null, ((sit.answers || []).length ? "选择之前" : "修好之前") +
      "，RCE 不会写入任何东西，包括项目列表。也可以在上方切换到别的项目。"));
    (sit.answers || []).forEach((answer) => {
      const label = (sit.answer_labels && sit.answer_labels[answer]) || answer;
      const row = mk("div", "answer");
      const b = mkButton(label, "btn", () => answerSituation(answer, status, buttons));
      buttons.push(b);
      row.append(b, mk("span", "answer-help", ANSWER_HELP[answer] || ""));
      box.appendChild(row);
    });
    if (!(sit.answers || []).length) {
      const actions = mk("div", "notice-actions");
      const again = mkButton("重新检查", "btn", () => reopenProject(status, buttons));
      buttons.push(again);
      actions.appendChild(again);
      box.appendChild(actions);
    }
  }
  box.appendChild(status);
  const raw = sit.detail || err.message;
  if (raw) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", raw);
    box.appendChild(d);
  }
  return box;
}

// 「选择文件夹…」 through the native shell (8.9's bridge, task V5 phase 9
// implements the Swift side): page -> native {type: "choose-folder",
// request}; native -> page window.RCE.folderChosen(request, path | null).
// Offered only when the shell says it can (window.RCEShellFeatures), so a
// shell without it -- or a plain browser -- simply has the path field.
const folderRequests = new Map();

function shellCan(feature) {
  try {
    return Array.isArray(window.RCEShellFeatures) && window.RCEShellFeatures.indexOf(feature) >= 0 &&
      !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce);
  } catch (err) {
    return false;
  }
}

function chooseFolder() {
  return new Promise((resolve) => {
    const request = "folder-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    folderRequests.set(request, resolve);
    try {
      window.webkit.messageHandlers.rce.postMessage({ type: "choose-folder", request: request });
    } catch (err) {
      folderRequests.delete(request);
      resolve(null);
    }
  });
}

function folderChosen(request, path) {
  const resolve = folderRequests.get(String(request));
  if (!resolve) return false;
  folderRequests.delete(String(request));
  resolve(typeof path === "string" && path ? path : null);
  return true;
}

// -- 停止服务 (task V3 phase 4) ----------------------------------------------
// The footer button POSTs /api/shutdown behind an explicit Chinese confirm.
// Success replaces the whole page with a plain stopped state and stops the
// generation poll -- the server is gone, and polling it would only spray
// connection errors into the console. Failure re-enables the button and
// says so in the header line (same spot a failed project switch reports),
// leaving the page fully usable.

function renderStoppedState() {
  if (pollTimer !== null) clearInterval(pollTimer);
  closePanel();
  document.getElementById("app").innerHTML =
    '<main id="main"><div class="stopped-note">' +
    "<h2>服务已停止</h2>" +
    "<p>本地服务已经关闭，可以关闭此页。</p>" +
    "<p>下次要查看时，双击 RCE.app，或在终端运行 <code>rce serve</code>。</p>" +
    "</div></main>";
}

document.getElementById("shutdown-btn").addEventListener("click", async () => {
  if (!window.confirm("确定要停止本地服务吗？停止后这个页面将无法继续使用。")) return;
  const btn = document.getElementById("shutdown-btn");
  btn.disabled = true;
  try {
    await apiPost("/api/shutdown", {});
  } catch (err) {
    btn.disabled = false;
    showHeaderError("停止服务失败", err);
    return;
  }
  renderStoppedState();
});

// -- Native shell bridge (DESIGN.md section 8.9, task V4 phase 3) ----------
// RCE.app is a native window around this same page. Its menus reach the
// page through ONE entry point, window.RCE.command(name), which the shell
// calls as the fixed string `window.RCE && RCE.command('<name>')` with a
// name from its own compiled-in whitelist; this table is the page's side
// of that whitelist. Anything not in it returns false and does nothing.
// In a plain browser nobody calls it and nothing is lost: every command
// here is something the page can already do from its own controls.
//
// The two Finder commands go through the existing POST /api/open, never a
// new endpoint: the project root is the path "." (which the server's
// resolve-then-relative_to check maps to the served root itself), and the
// map file is the one the server's own /api/summary echoes from
// .rce/attempts.toml -- fetched fresh at command time so a project switch
// can never open the previous project's map. The server confines both
// exactly as it confines every other /api/open path.
//
// The page reports the current project's label to the shell (window
// title 「RCE — <label>」) over webkit.messageHandlers.rce -- the only
// message shape the shell accepts -- after every loadProjects(), i.e. on
// load and on every project switch. Absent bridge: a silent no-op.

const TEXT_ZOOM_STEPS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
let textZoomIndex = TEXT_ZOOM_STEPS.indexOf(1);

// 放大/缩小/实际大小: the canvas zooms its own camera; the two reading
// views scale their own sections (never the canvas section, whose pointer
// geometry must stay in unscaled CSS pixels).
function shellZoom(step) {
  if (currentView === "canvas") {
    if (step > 0) RCECanvas.zoomIn();
    else if (step < 0) RCECanvas.zoomOut();
    else RCECanvas.zoomReset();
    return;
  }
  textZoomIndex = step === 0 ? TEXT_ZOOM_STEPS.indexOf(1)
    : Math.max(0, Math.min(TEXT_ZOOM_STEPS.length - 1, textZoomIndex + step));
  const z = TEXT_ZOOM_STEPS[textZoomIndex];
  views.tree.style.zoom = z === 1 ? "" : String(z);
  views.lineage.style.zoom = z === 1 ? "" : String(z);
}

// A failed Finder command reports in the header line, the same spot a
// failed project switch uses; the engine's own text sits behind 「详情」.
function shellReport(message, err) {
  showHeaderError(message, err);
}

async function shellOpen(path, reveal, failure) {
  try {
    await apiPost("/api/open", { path: path, reveal: reveal });
  } catch (err) {
    shellReport(failure, err);
  }
}

async function shellOpenMap() {
  let config = null;
  try {
    config = (await apiGet("/api/summary")).attempts_config;
  } catch (err) {
    shellReport("无法打开项目地图", err);
    return;
  }
  if (!config || !config.file) {
    shellReport("这个项目还没有配置项目地图（.rce/attempts.toml）", null);
    return;
  }
  await shellOpen(config.file, false, "无法打开项目地图");
}

const SHELL_COMMANDS = {
  "tree": () => activateView("tree"),
  "lineage": () => activateView("lineage"),
  "canvas": () => activateView("canvas"),
  "new-attempt": () => openAttemptForm("append"),
  "reload": () => window.location.reload(),
  "zoom-in": () => shellZoom(1),
  "zoom-out": () => shellZoom(-1),
  "zoom-reset": () => shellZoom(0),
  // 适应全部 is a canvas notion; from another view it brings the canvas up
  // first rather than silently doing nothing -- and when that starts the
  // canvas's first load, fits once the cards are there (fitting the empty
  // canvas was lost: entering the view then restored its saved viewport).
  "fit": () => {
    const loading = activateView("canvas");
    if (loading) loading.then(() => { if (currentView === "canvas" && views.canvas.dataset.loaded) RCECanvas.fitAll(); });
    else RCECanvas.fitAll();
  },
  "reveal-project": () => shellOpen(".", true, "无法在 Finder 中显示项目"),
  "open-map": () => shellOpenMap(),
};

window.RCE = Object.freeze({
  // The native shell's answer to {type: "choose-folder"} (see chooseFolder).
  folderChosen(request, path) {
    return folderChosen(request, path);
  },
  command(name) {
    if (typeof name !== "string" || !Object.prototype.hasOwnProperty.call(SHELL_COMMANDS, name)) return false;
    // After 停止服务 the page is a static note; a menu click must not throw.
    if (!document.getElementById("view-tree")) return false;
    try {
      SHELL_COMMANDS[name]();
    } catch (err) {
      return false;
    }
    return true;
  },
});

function postShellTitle() {
  try {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce;
    if (bridge) bridge.postMessage({ type: "title", text: String(state.projectLabel || "") });
  } catch (err) {
    /* no shell, or the shell went away: the page works the same */
  }
}

// -- Init -------------------------------------------------------------------
// loadProjects() first (awaited): it fills state.projectLabel, which the
// summary line prefers over a raw-path basename. The views themselves never
// wait on either -- activateView kicks off its own fetch. The generation
// poll (task V3 phase 2) starts alongside: syncGeneration() records the
// server's current generation as this page's starting point (so the first
// interval tick compares against reality, not null), then the interval
// keeps watching for the server-side watcher's bumps.

(async () => {
  await loadProjects();
  loadProjectSummary();
  activateView(storedView() || "tree");
  syncGeneration();
  pollTimer = setInterval(pollGeneration, REFRESH_POLL_MS);
})();
</script>
